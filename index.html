    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body, html { 
            margin: 0; padding: 0; height: 100vh; width: 100vw; 
            font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow: hidden; 
        }
        #root { height: 100%; display: flex; flex-direction: column; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-splash-out { animation: splashOut 0.5s ease-in forwards; animation-delay: 2.7s; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes splashOut { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
            transform: translate3d(0, 0, 0);
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        
        /* Capa de Escáner Optimizada */
        .scanner-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            z-index: 10; pointer-events: none;
        }
        .scanner-guide {
            width: 85vw; height: 53.5vw; /* Ratio INE estándar 1.58 */
            max-width: 480px; max-height: 304px;
            position: relative; border-radius: 20px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.4);
        }
        .scanner-corner { position: absolute; width: 40px; height: 40px; border: 5px solid #3b82f6; }
        .c-tl { top: -5px; left: -5px; border-right: 0; border-bottom: 0; border-radius: 18px 0 0 0; }
        .c-tr { top: -5px; right: -5px; border-left: 0; border-bottom: 0; border-radius: 0 18px 0 0; }
        .c-bl { bottom: -5px; left: -5px; border-right: 0; border-top: 0; border-radius: 0 0 0 18px; }
        .c-br { bottom: -5px; right: -5px; border-left: 0; border-top: 0; border-radius: 0 0 18px 0; }

        @media print {
            body * { visibility: hidden !important; }
            #print-area, #print-area * { visibility: visible !important; }
            #print-area { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; display: flex !important; align-items: center !important; justify-content: center !important; padding: 2cm !important; }
            #print-area img { max-width: 14cm !important; width: 100% !important; border-radius: 0.3cm !important; border: 1px solid #ddd !important; }
            .no-print { display: none !important; }
        }
    </style>

<body>

    <script type="text/babel">
        const { useState, useEffect, Fragment, useRef } = React;

        // --- Firebase Config ---
        const firebaseConfig = {

        // --- Utilidades ---
        const toTitleCase = (str) => {
            if (!str) return "";
            return str.toLowerCase().split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        };

        const getQRCodeURL = (data) => `https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=${encodeURIComponent(data)}`;

        const playErrorSound = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const playTone = (freq, startTime, duration) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0.1, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + duration);
                };
                playTone(100, ctx.currentTime, 0.2);
                playTone(100, ctx.currentTime + 0.25, 0.2);
            } catch (e) { console.warn("Audio Context Error"); }
        };

        const Icon = ({ name, className = "w-5 h-5" }) => {

                camera: <Fragment><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></Fragment>,
                printer: <Fragment><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></Fragment>,
                "arrow-left": <Fragment><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></Fragment>,

                lock: <Fragment><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Fragment>,
                loader: <path d="M21 12a9 9 0 1 1-6.21-8.58"/>,
                search: <Fragment><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Fragment>,
                "edit": <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>,
                "plus-circle": <Fragment><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></Fragment>,
                "key": <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>,
                "refresh-cw": <Fragment><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></Fragment>,
                image: <Fragment><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></Fragment>,
                x: <Fragment><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Fragment>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        // --- Componente: Escáner de Alta Precisión ---
        function IDScanner({ onCapture, onCancel, title = "Centre la identificación" }) {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const guideRef = useRef(null);
            const [stream, setStream] = useState(null);

            useEffect(() => {
                const init = async () => {
                    try {
                        const s = await navigator.mediaDevices.getUserMedia({ 
                            video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
                        });
                        setStream(s); 
                        if(videoRef.current) videoRef.current.srcObject = s;
                    } catch(e) { alert("Active los permisos de cámara."); onCancel(); }
                };
                init();
                return () => { if(stream) stream.getTracks().forEach(t => t.stop()); };
            }, []);

            const capture = () => {
                const video = videoRef.current;
                const guide = guideRef.current;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');

                // 1. Obtener dimensiones reales del video fuente
                const vW = video.videoWidth;
                const vH = video.videoHeight;

                // 2. Obtener dimensiones visuales en pantalla
                const rectVideo = video.getBoundingClientRect();
                const rectGuide = guide.getBoundingClientRect();

                // 3. Calcular factores de escala entre pantalla y sensor
                const scaleX = vW / rectVideo.width;
                const scaleY = vH / rectVideo.height;

                // 4. Calcular coordenadas de recorte relativas al video
                const sx = (rectGuide.left - rectVideo.left) * scaleX;
                const sy = (rectGuide.top - rectVideo.top) * scaleY;
                const sw = rectGuide.width * scaleX;
                const sh = rectGuide.height * scaleY;

                // 5. Configurar canvas de salida (Ratio INE ~1.58)
                canvas.width = 1200;
                canvas.height = 760;

                // 6. Dibujar el área recortada con máxima calidad
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
                
                onCapture(canvas.toDataURL('image/jpeg', 0.9));
                if (stream) stream.getTracks().forEach(t => t.stop());
            };

            return (
                <div className="fixed inset-0 bg-black z-[500] flex flex-col items-center justify-center font-sans overflow-hidden">
                    <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover" />
                    
                    <div className="scanner-container">
                        <div ref={guideRef} className="scanner-guide">
                            <div className="scanner-corner c-tl"></div><div className="scanner-corner c-tr"></div>
                            <div className="scanner-corner c-bl"></div><div className="scanner-corner c-br"></div>
                        </div>
                    </div>

                    <div className="absolute top-12 text-center w-full z-20 px-4">
                        <p className="text-white text-[10px] font-black uppercase tracking-widest bg-black/60 py-3 rounded-full border border-white/10 px-8 inline-block shadow-2xl">{title}</p>
                    </div>
                    
                    <div className="absolute bottom-12 flex justify-center gap-12 items-center z-20 w-full px-6">
                        <button onClick={onCancel} className="p-5 bg-white/10 text-white rounded-full border border-white/20 active:scale-75 transition-all"><Icon name="x" className="w-8 h-8" /></button>
                        <button onClick={capture} className="w-24 h-24 bg-white rounded-full border-[10px] border-white/30 shadow-2xl active:scale-90 transition-all"></button>
                        <div className="w-16"></div>
                    </div>
                    <canvas ref={canvasRef} className="hidden" />
                </div>
            );
        }

        // --- Vista: Administración ---
        function AdminView({ habitantes, agentes, logs, admins, role, activeUser, onResetSuccess }) {
            const [tab, setTab] = useState('residentes');
            const [view, setView] = useState('list');
            const [selectedPhoto, setSelectedPhoto] = useState(null);
            const [isActionLoading, setIsActionLoading] = useState(false);
            const [isScanningGuard, setIsScanningGuard] = useState(false);
            const [guardPhoto, setGuardPhoto] = useState(null);
            const [form, setForm] = useState({ nombre: '', casa: '', password: '' });
            
            const [passRecovery, setPassRecovery] = useState(null); 
            const [editResident, setEditResident] = useState(null);
            const [editGuard, setEditGuard] = useState(null);

            const isMaestro = activeUser?.esMaestro || role === 'superuser';

            const displayLogs = (() => {
                if (role === 'superuser') return logs;
                const moves = logs.filter(l => l.tipo === 'Visita' || l.tipo === 'Acceso Residente');
                if (role === 'admin' && activeUser?.esMaestro) {
                    const systemAccesses = logs.filter(l => l.tipo === 'Acceso Sistema' && l.subtipo !== 'SUPERUSER');
                    return [...moves, ...systemAccesses];
                }
                return moves;
            })();

            const resetFormStates = () => {
                setForm({ nombre: '', casa: '', password: '' });
                setGuardPhoto(null);
                setView('list');
            };

            useEffect(() => { resetFormStates(); }, [tab]);

            const logAction = async (tipo, subtipo, detalles) => {
                await getColRef('bitacora').add({ tipo, subtipo, detalles, autor: activeUser.nombre, timestamp: new Date().toISOString() });
            };

            const deleteEntry = async (col, id, nombre) => {
                if(!confirm(`¿Eliminar permanentemente a ${nombre}?`)) return;
                try { 
                    await getColRef(col).doc(id).delete(); 
                    await logAction('Sistema', 'Borrado', `Eliminó registro: ${nombre}`);
                } catch (e) { alert("Error."); }
            };

            const resetLogs = async () => {
                if(!confirm("¿Vaciar historial por completo?")) return;
                setIsActionLoading(true);
                try {
                    const snapshot = await getColRef('bitacora').get();
                    const batch = db.batch();
                    snapshot.forEach(doc => batch.delete(doc.ref));
                    await batch.commit();
                    alert("Bitácora reiniciada.");
                } catch (e) { alert("Error."); }
                setIsActionLoading(false);
            };

            const handlePassRecovery = async (e) => {
                e.preventDefault();
                const newPass = e.target.newpass.value;
                if(newPass.length < 5) return alert("Mínimo 5 caracteres.");
                setIsActionLoading(true);
                try {
                    await getColRef(passRecovery.col).doc(passRecovery.id).update({ password: newPass, mustChangeCode: true });
                    await logAction('Sistema', 'Reset Clave', `Cambió clave de ${passRecovery.nombre}`);
                    alert("Clave actualizada.");
                    setPassRecovery(null);
                } catch (e) { alert("Error."); }
                setIsActionLoading(false);
            };

            const handleResidentUpdate = async (e) => {
                e.preventDefault();
                const updatedName = toTitleCase(e.target.editName.value);
                const updatedHouse = e.target.editHouse.value;
                setIsActionLoading(true);
                try {
                    await getColRef('habitantes').doc(editResident.id).update({ nombre: updatedName, casa: updatedHouse });
                    await logAction('Sistema', 'Edición', `Editó habitante ${editResident.nombre}`);
                    alert("Datos actualizados.");
                    setEditResident(null);
                } catch (e) { alert("Error."); }
                setIsActionLoading(false);
            };

            const handleGuardUpdate = async (e) => {
                e.preventDefault();
                const updatedName = toTitleCase(e.target.editGuardName.value);
                setIsActionLoading(true);
                try {
                    await getColRef('agentes').doc(editGuard.id).update({ nombre: updatedName });
                    await logAction('Sistema', 'Edición', `Editó guardia ${editGuard.nombre}`);
                    alert("Datos actualizados.");
                    setEditGuard(null);
                } catch (e) { alert("Error."); }
                setIsActionLoading(false);
            };

            const handleSave = async (e) => {
                e.preventDefault();
                if (form.password.length < 5) return alert("Contraseña muy corta.");
                setIsActionLoading(true);
                const colName = tab === 'residentes' ? 'habitantes' : (tab === 'guardias' ? 'agentes' : 'admins');
                try {
                    const nombreFinal = toTitleCase(form.nombre);
                    const data = { nombre: nombreFinal, password: form.password, mustChangeCode: true };
                    if (tab === 'residentes') { data.casa = form.casa; data.disponibleVisitas = true; }
                    if (tab === 'administradores') data.esMaestro = false;
                    if (tab === 'guardias' && guardPhoto) data.fotoINE = guardPhoto;
                    await getColRef(colName).add(data);
                    await logAction('Sistema', 'Registro', `Creó registro: ${nombreFinal}`);
                    alert("Guardado.");
                    resetFormStates();
                } catch (err) { alert("Error."); }
                setIsActionLoading(false);
            };

            return (
                <div className="space-y-4 animate-fade-in pb-24 h-full font-sans">
                    <div className="flex gap-2 bg-white p-2 rounded-2xl shadow-sm border border-slate-200 w-fit overflow-x-auto max-w-full no-print">
                        {['residentes', 'guardias', 'bitacora', (isMaestro ? 'administradores' : null)].filter(Boolean).map(t => (
                            <button key={t} onClick={() => setTab(t)} className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all whitespace-nowrap ${tab === t ? 'bg-slate-900 text-white shadow-lg' : 'text-slate-400'}`}>{t}</button>
                        ))}
                    </div>

                    <div className="bg-white p-6 rounded-[2.5rem] shadow-xl border border-slate-100 min-h-[500px]">
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="text-2xl font-black uppercase text-slate-800 tracking-tight leading-none">{tab}</h2>
                            <div className="flex gap-3">
                                {role === 'superuser' && tab === 'bitacora' && (
                                    <button onClick={resetLogs} disabled={isActionLoading} className="flex items-center gap-2 px-4 py-2 bg-rose-600 text-white text-[10px] font-black uppercase rounded-xl shadow-lg border border-rose-500 active:scale-95"><Icon name="trash" className="w-3 h-3" /> Vaciar Bitácora</button>
                                )}
                                {view === 'list' && tab !== 'bitacora' && (
                                    <button onClick={() => setView('add')} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white text-[10px] font-black uppercase rounded-xl shadow-lg active:scale-95"><Icon name="plus-circle" /> Nuevo</button>
                                )}
                            </div>
                        </div>

                        <div className="overflow-x-auto rounded-3xl border border-slate-100 font-medium">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-slate-50">
                                    {tab === 'bitacora' ? (
                                        <tr><th className="px-6 py-4 text-[10px] font-black uppercase text-slate-400">Fech/Hora</th><th className="px-6">Descripción</th><th className="text-center px-6">INE</th></tr>
                                    ) : (
                                        <tr><th className="px-6 py-4 text-[10px] font-black uppercase text-slate-400">Nombre</th><th className="px-6">Info</th>{isMaestro && <th className="text-right pr-10">Acciones</th>}</tr>
                                    )}
                                </thead>
                                <tbody className="divide-y divide-slate-50">
                                    {tab === 'residentes' && habitantes.sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(h => (
                                        <tr key={h.id} className="hover:bg-slate-50/50 transition-colors">
                                            <td className="px-6 py-4 font-bold text-slate-700">{h.nombre}</td>
                                            <td className="px-6 py-4 text-slate-500 uppercase font-black">{h.casa}</td>
                                            <td className="px-6 py-4 text-right pr-10 flex justify-end gap-1">
                                                {isMaestro && <Fragment>
                                                    <button onClick={() => setEditResident(h)} className="p-2 text-slate-400 hover:bg-slate-100 rounded-lg transition-colors"><Icon name="edit" className="w-4 h-4"/></button>
                                                    <button onClick={() => setPassRecovery({ col: 'habitantes', id: h.id, nombre: h.nombre })} className="p-2 text-blue-500 hover:bg-blue-50 rounded-lg"><Icon name="key" className="w-4 h-4"/></button>
                                                    <button onClick={() => deleteEntry('habitantes', h.id, h.nombre)} className="p-2 text-rose-500 hover:bg-rose-50 rounded-lg"><Icon name="trash" className="w-4 h-4"/></button>
                                                </Fragment>}
                                            </td>
                                        </tr>
                                    ))}
                                    {tab === 'guardias' && agentes.sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(a => (
                                        <tr key={a.id} className="hover:bg-slate-50/50 transition-colors">
                                            <td className="px-6 py-4 font-bold text-slate-700">
                                                <div className="flex items-center gap-2">{a.nombre} {a.fotoINE && <button onClick={() => setSelectedPhoto(a.fotoINE)} className="text-blue-500"><Icon name="image" className="w-3 h-3"/></button>}</div>
                                            </td>
                                            <td className="px-6 py-4 text-slate-500 italic uppercase text-[9px] font-black text-emerald-600 tracking-widest">Guardia</td>
                                            <td className="px-6 py-4 text-right pr-10 flex justify-end gap-1">
                                                {isMaestro && <Fragment>
                                                    <button onClick={() => setEditGuard(a)} className="p-2 text-slate-400 hover:bg-slate-100 rounded-lg transition-colors"><Icon name="edit" className="w-4 h-4"/></button>
                                                    <button onClick={() => setPassRecovery({ col: 'agentes', id: a.id, nombre: a.nombre })} className="p-2 text-blue-500 hover:bg-blue-50 rounded-lg"><Icon name="key" className="w-4 h-4"/></button>
                                                    <button onClick={() => deleteEntry('agentes', a.id, a.nombre)} className="p-2 text-rose-500 hover:bg-rose-50 rounded-lg"><Icon name="trash" className="w-4 h-4"/></button>
                                                </Fragment>}
                                            </td>
                                        </tr>
                                    ))}
                                    {tab === 'administradores' && admins.sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(a => (
                                        <tr key={a.id} className="hover:bg-slate-50/50 transition-colors">
                                            <td className="px-6 py-4 font-bold text-slate-700">{a.nombre} {a.esMaestro && "⭐"}</td>
                                            <td className="px-6 py-4 text-slate-500 italic uppercase text-[9px] font-black text-blue-600">Admin</td>
                                            <td className="px-6 py-4 text-right pr-10">
                                                {(!a.esMaestro || role === 'superuser') && <button onClick={() => deleteEntry('admins', a.id, a.nombre)} className="p-2 text-rose-500 hover:bg-rose-50 rounded-lg"><Icon name="trash" className="w-4 h-4"/></button>}
                                            </td>
                                        </tr>
                                    ))}
                                    {tab === 'bitacora' && displayLogs.sort((a,b)=>b.timestamp.localeCompare(a.timestamp)).map(l => (
                                        <tr key={l.id} className="hover:bg-slate-50 transition-colors">
                                            <td className="px-6 py-4 text-slate-400 tracking-tighter">{new Date(l.timestamp).toLocaleString()}</td>
                                            <td className="px-6 uppercase font-black text-slate-700 leading-tight">
                                                {l.detalles || l.visitante || l.habitanteNombre}
                                                <br/><span className="text-[9px] opacity-60 text-blue-600 font-black uppercase tracking-widest">{l.subtipo || l.tipo} {l.autor ? `| ${l.autor}` : ''}</span>
                                            </td>
                                            <td className="text-center px-6">
                                                {l.fotoINE ? <button onClick={() => setSelectedPhoto(l.fotoINE)} className="p-2 bg-slate-100 rounded-xl text-blue-600 hover:bg-blue-200 shadow-sm transition-colors"><Icon name="image" className="w-4 h-4" /></button> : <span className="text-[8px] text-slate-300 font-black uppercase">N/A</span>}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* MODALES EDICIÓN */}
                    {editResident && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[600] flex items-center justify-center p-6 animate-fade-in">
                            <div className="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-sm text-center border-t-8 border-slate-800">
                                <div className="p-4 bg-slate-50 text-slate-900 rounded-2xl inline-block mb-6"><Icon name="edit" className="w-8 h-8"/></div>
                                <h3 className="text-xl font-black uppercase text-slate-900 mb-1 leading-none">Corregir Datos</h3>
                                <form onSubmit={handleResidentUpdate} className="space-y-4 text-left mt-6">
                                    <input name="editName" defaultValue={editResident.nombre} className="w-full p-4 bg-slate-50 border rounded-2xl font-bold outline-none" required />
                                    <input name="editHouse" defaultValue={editResident.casa} className="w-full p-4 bg-slate-50 border rounded-2xl font-bold outline-none" required />
                                    <div className="flex gap-3 pt-4">
                                        <button type="button" onClick={() => setEditResident(null)} className="flex-1 py-4 bg-slate-100 text-slate-400 rounded-xl font-black uppercase text-[10px]">Cerrar</button>
                                        <button type="submit" disabled={isActionLoading} className="flex-1 py-4 bg-slate-900 text-white rounded-xl font-black uppercase text-[10px] shadow-lg">Actualizar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {editGuard && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[600] flex items-center justify-center p-6 animate-fade-in">
                            <div className="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-sm text-center border-t-8 border-emerald-600">
                                <div className="p-4 bg-emerald-50 text-emerald-600 rounded-2xl inline-block mb-6"><Icon name="edit" className="w-8 h-8"/></div>
                                <h3 className="text-xl font-black uppercase text-slate-900 mb-1 leading-none">Editar Guardia</h3>
                                <form onSubmit={handleGuardUpdate} className="space-y-4 text-left mt-6">
                                    <input name="editGuardName" defaultValue={editGuard.nombre} className="w-full p-4 bg-slate-50 border rounded-2xl font-bold outline-none" required />
                                    <div className="flex gap-3 pt-4">
                                        <button type="button" onClick={() => setEditGuard(null)} className="flex-1 py-4 bg-slate-100 text-slate-400 rounded-xl font-black uppercase text-[10px]">Cerrar</button>
                                        <button type="submit" disabled={isActionLoading} className="flex-1 py-4 bg-emerald-600 text-white rounded-xl font-black uppercase text-[10px] shadow-lg">Actualizar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {passRecovery && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[600] flex items-center justify-center p-6 animate-fade-in">
                            <div className="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-sm text-center border-t-8 border-blue-600">
                                <div className="p-4 bg-blue-50 text-blue-600 rounded-2xl inline-block mb-6"><Icon name="key" className="w-8 h-8"/></div>
                                <h3 className="text-xl font-black uppercase text-slate-900 mb-1 leading-none tracking-tight">Restablecer Clave</h3>
                                <p className="text-[10px] text-slate-400 font-bold uppercase mb-8">{passRecovery.nombre}</p>
                                <form onSubmit={handlePassRecovery} className="space-y-4">
                                    <input name="newpass" type="password" placeholder="Nueva contraseña (min 5)" className="w-full p-4 bg-slate-50 border rounded-2xl font-bold outline-none" required autoFocus />
                                    <div className="flex gap-3">
                                        <button type="button" onClick={() => setPassRecovery(null)} className="flex-1 py-4 bg-slate-100 text-slate-400 rounded-xl font-black uppercase text-[10px]">Cerrar</button>
                                        <button type="submit" className="flex-1 py-4 bg-blue-600 text-white rounded-xl font-black uppercase text-[10px] shadow-lg">Actualizar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* VISTA NUEVO REGISTRO */}
                    {view === 'add' && (
                        <div className="fixed inset-0 bg-slate-50 z-[400] p-6 overflow-y-auto font-sans">
                            <div className="max-w-md mx-auto py-10">
                                <button onClick={resetFormStates} className="mb-8 flex items-center gap-2 text-slate-400 font-black uppercase text-[10px] active:scale-95"><Icon name="arrow-left"/> Volver</button>
                                <h2 className="text-3xl font-black uppercase text-slate-900 mb-8 tracking-tighter leading-none font-black tracking-tight whitespace-nowrap uppercase">Registrar {tab}</h2>
                                <form onSubmit={handleSave} className="space-y-5 text-left">
                                    <input className="w-full p-5 bg-white border rounded-[1.5rem] font-bold outline-none focus:ring-4 focus:ring-blue-100" placeholder="Nombre completo" value={form.nombre} onChange={e => setForm({...form, nombre: e.target.value})} required />
                                    {tab === 'residentes' && <input className="w-full p-5 bg-white border rounded-[1.5rem] font-bold outline-none focus:ring-4 focus:ring-blue-100" placeholder="Lote / Casa" value={form.casa} onChange={e => setForm({...form, casa: e.target.value})} required />}
                                    <input type="password" title="password" className="w-full p-5 bg-white border rounded-[1.5rem] font-bold outline-none focus:ring-4 focus:ring-blue-100" placeholder="Contraseña inicial (min 5)" value={form.password} onChange={e => setForm({...form, password: e.target.value})} required />
                                    {tab === 'guardias' && (
                                        <button type="button" onClick={() => setIsScanningGuard(true)} className={`w-full py-5 border-2 border-dashed rounded-[1.5rem] flex items-center justify-center gap-3 transition-all ${guardPhoto ? 'bg-emerald-50 text-emerald-600 border-emerald-500' : 'bg-white text-slate-400 border-slate-200'}`}>
                                            <Icon name="camera" /> {guardPhoto ? "FOTO ID GUARDADA" : "TOMAR FOTO INE"}
                                        </button>
                                    )}
                                    <button type="submit" className="w-full py-5 bg-slate-900 text-white rounded-[1.5rem] font-black uppercase shadow-xl mt-4 active:scale-95 transition-all">Completar Registro</button>
                                </form>
                                {isScanningGuard && <IDScanner title="Captura ID Guardia" onCapture={(img) => { setGuardPhoto(img); setIsScanningGuard(false); }} onCancel={() => setIsScanningGuard(false)} />}
                            </div>
                        </div>
                    )}

                    {selectedPhoto && (
                        <div className="fixed inset-0 bg-slate-900/95 z-[300] flex flex-col items-center justify-center p-6 backdrop-blur-md animate-fade-in no-print">
                            <div className="max-w-3xl w-full flex flex-col gap-4">
                                <div className="flex justify-between items-center bg-white/10 p-4 rounded-3xl no-print">
                                    <div className="flex gap-3">
                                        <button onClick={() => setSelectedPhoto(null)} className="px-6 py-3 bg-white/20 hover:bg-white/30 text-white rounded-2xl font-black uppercase text-[10px] flex items-center gap-2 transition-all font-black uppercase"><Icon name="arrow-left" /> Regresar</button>
                                        <button onClick={() => window.print()} className="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-black uppercase text-[10px] flex items-center gap-2 shadow-xl shadow-blue-500/20 font-black"><Icon name="printer" /> Imprimir INE</button>
                                    </div>
                                    <button onClick={() => setSelectedPhoto(null)} className="text-white/50 hover:text-white transition-colors"><Icon name="x" className="w-6 h-6"/></button>
                                </div>
                                <div className="bg-white p-2 rounded-[2.5rem] shadow-2xl border-4 border-white/20 overflow-hidden" id="print-area"><img src={selectedPhoto} className="w-full h-auto rounded-[2rem] block shadow-inner" alt="ID" /></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- Resto de Componentes ---
        function App() {
            const [showSplash, setShowSplash] = useState(true);
            const [user, setUser] = useState(null);
            const [role, setRole] = useState(null); 
            const [activeUser, setActiveUser] = useState(null);
            const [habitantes, setHabitantes] = useState([]);
            const [agentes, setAgentes] = useState([]);
            const [admins, setAdmins] = useState([]);
            const [logs, setLogs] = useState([]);
            const [loading, setLoading] = useState(true);
            const [dataReady, setDataReady] = useState(false);
            const [authStep, setAuthStep] = useState('login');
            const [loginError, setLoginError] = useState(false);

            const forceReset = () => { setRole(null); setActiveUser(null); setAuthStep('login'); setLoginError(false); };

            useEffect(() => {
                const timer = setTimeout(() => setShowSplash(false), 3000);
                const init = async () => {
                    try {
                        await auth.signInAnonymously();
                        auth.onAuthStateChanged((u) => { if (u) { setUser(u); } });
                    } catch (e) { console.error(e); }
                };
                init();
                return () => clearTimeout(timer);
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsub1 = getColRef('habitantes').onSnapshot(s => setHabitantes(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsub2 = getColRef('agentes').onSnapshot(s => setAgentes(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsub3 = getColRef('bitacora').onSnapshot(s => setLogs(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsub4 = getColRef('admins').onSnapshot(s => {
                    setAdmins(s.docs.map(d => ({ id: d.id, ...d.data() })));
                    setDataReady(true);
                    setLoading(false);
                });
                return () => { unsub1(); unsub2(); unsub3(); unsub4(); };
            }, [user]);

            const handleLogin = async (nameInput, passInput) => {
                if (!dataReady) return alert("Conectando...");
                const formattedName = toTitleCase(nameInput.trim());
                const maestroExists = admins.some(a => a.esMaestro);

                let foundUser = null;
                let foundRole = null;

                if (nameInput.toLowerCase() === 'superuser' && passInput === 'tlahuiscalpantecutli') {
                    foundUser = { nombre: 'Súper Usuario' };
                    foundRole = 'superuser';
                }
                else if (!maestroExists && nameInput.toLowerCase() === 'admin' && passInput === '123') {
                    foundUser = { nombre: 'Activación Maestro', mustInit: true };
                    foundRole = 'admin';
                }
                else {
                    const admin = admins.find(a => a.nombre === formattedName && a.password === passInput);
                    if (admin) { foundUser = admin; foundRole = 'admin'; }
                    else {
                        const guard = agentes.find(a => a.nombre === formattedName && a.password === passInput);
                        if (guard) { foundUser = guard; foundRole = 'guardia'; }
                        else {
                            const hab = habitantes.find(h => h.nombre === formattedName && h.password === passInput);
                            if (hab) { foundUser = hab; foundRole = 'habitante'; }
                        }
                    }
                }

                if (foundUser) {
                    setActiveUser(foundUser);
                    setRole(foundRole);
                    setAuthStep('dashboard');
                    setLoginError(false);
                    await getColRef('bitacora').add({ tipo: 'Acceso Sistema', subtipo: foundRole.toUpperCase(), habitanteNombre: foundUser.nombre, timestamp: new Date().toISOString() });
                } else {
                    setLoginError(true);
                    playErrorSound();
                    setTimeout(() => setLoginError(false), 800);
                }
            };

            if (showSplash) return (
                <div className="fixed inset-0 z-[1000] bg-slate-950 flex flex-col items-center justify-center text-white animate-splash-out">
                    <div className="p-8 bg-blue-600 rounded-[3rem] shadow-[0_0_100px_rgba(37,99,235,0.4)] animate-bounce mb-8 border border-blue-400/20 shadow-blue-600/30">
                        <Icon name="shield" className="w-24 h-24 text-white shadow-2xl" />
                    </div>
                    <h1 className="text-5xl md:text-7xl font-black text-center leading-none font-black tracking-tighter px-4 uppercase">{TITULO_SISTEMA}</h1>
                    <p className="mt-4 text-[10px] uppercase font-black tracking-[0.6em] text-white/40">{VERSION}</p>
                </div>
            );

            if (loading) return null;

            if (authStep === 'login' && !activeUser) {
                const maestroExists = admins.some(a => a.esMaestro);
                return (
                    <div className="flex-1 flex items-center justify-center p-6 bg-slate-50 h-screen animate-fade-in font-sans">
                        <div className={`bg-white p-10 rounded-[3.5rem] shadow-2xl w-full max-w-sm border-2 text-center relative overflow-hidden transition-all duration-300 ${loginError ? 'shake border-rose-500' : 'border-slate-100'}`}>
                            <div className={`absolute top-0 left-0 w-full h-2 ${loginError ? 'bg-rose-500' : 'bg-slate-900'}`}></div>
                            <div className="flex justify-center mb-6">
                                <div className={`p-4 rounded-2xl shadow-xl transition-colors duration-300 ${loginError ? 'bg-rose-500' : 'bg-slate-900'} text-white`}>
                                    <Icon name={loginError ? "alert-circle" : "lock"} className="w-8 h-8" />
                                </div>
                            </div>
                            <h2 className={`text-2xl font-black transition-colors duration-300 ${loginError ? 'text-rose-600' : 'text-slate-900'} leading-none font-black tracking-tighter uppercase`}>{TITULO_SISTEMA}</h2>
                            <p className="text-[10px] text-slate-400 font-bold uppercase mb-8 tracking-widest leading-none mt-2 font-black">{VERSION}</p>
                            {loginError && <div className="mb-6 py-3 bg-rose-50 text-rose-600 rounded-2xl text-[10px] font-black uppercase border border-rose-100 animate-fade-in">Datos Incorrectos</div>}
                            {!maestroExists && !loginError && <div className="mb-6 px-4 py-2 bg-blue-50 text-blue-600 rounded-xl text-[9px] font-bold uppercase border border-blue-100 animate-pulse font-black">Activación: admin / 123</div>}
                            <form onSubmit={e => { e.preventDefault(); handleLogin(e.target.name.value, e.target.pass.value); }} className="space-y-4 text-left">
                                <input name="name" className="w-full p-4 bg-slate-50 rounded-2xl border font-bold text-xs outline-none focus:ring-4 focus:ring-blue-100" placeholder="Nombre completo" required />
                                <input name="pass" type="password" placeholder="Contraseña" className="w-full p-4 bg-slate-50 rounded-2xl border font-bold text-xs outline-none focus:ring-4 focus:ring-blue-100" required />
                                <button className={`w-full py-4 rounded-2xl font-black uppercase shadow-xl transition-all text-[11px] tracking-widest ${loginError ? 'bg-rose-500' : 'bg-slate-900 hover:bg-black'} text-white`}>{loginError ? 'REINTENTAR' : 'Entrar al Sistema'}</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-full flex flex-col overflow-hidden bg-slate-50 animate-fade-in font-sans">
                    <header className="bg-slate-900 text-white h-16 flex items-center justify-between px-6 shadow-2xl shrink-0 z-[100] border-b border-slate-800 no-print">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2 rounded-xl shadow-lg border border-blue-400/20 active:scale-95 transition-transform"><Icon name="shield" className="w-4 h-4 text-white"/></div>
                            <div className="flex flex-col leading-none font-black uppercase">
                                <span className="text-sm tracking-tight tracking-tighter leading-none font-black whitespace-nowrap">{TITULO_SISTEMA}</span>
                                <span className="text-[7px] font-bold text-blue-400 uppercase tracking-widest mt-1 uppercase leading-none">SEGURIDAD - {VERSION}</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="flex flex-col items-end text-right">
                                <span className="text-[10px] font-black uppercase text-white leading-none mb-1 truncate max-w-[150px] font-black">{activeUser?.nombre}</span>
                                <span className="text-[8px] font-black text-blue-400 uppercase tracking-widest leading-none font-black leading-none uppercase">
                                    {role === 'admin' ? (activeUser?.esMaestro ? 'Administrador Maestro' : 'Administrador Auxiliar') : role === 'guardia' ? 'Guardia de Seguridad' : role === 'superuser' ? 'Súper Usuario' : 'Residente'}
                                </span>
                            </div>
                            <button onClick={forceReset} className="px-3 py-1.5 bg-slate-800 hover:bg-rose-600 text-white rounded-lg font-bold text-[9px] uppercase transition-all shadow-lg border border-slate-700 font-black">Salir</button>
                        </div>
                    </header>
                    <div className="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar bg-slate-50">
                        <div className="max-w-7xl mx-auto w-full h-full no-print">
                            {(role === 'admin' || role === 'superuser') && <AdminView habitantes={habitantes} agentes={agentes} logs={logs} admins={admins} role={role} activeUser={activeUser} onResetSuccess={forceReset} />}
                            {role === 'habitante' && <HabitanteModule habitante={habitantes.find(h => h.nombre === activeUser?.nombre) || activeUser} />}
                            {role === 'guardia' && <GuardiaFlow agente={activeUser} habitantes={habitantes} />}
                        </div>
                    </div>
                </div>
            );
        }

        function MaestroReg({ onComplete }) {
            const [m, setM] = useState({ n: '', p: '', c: '' });
            const handle = async (e) => {
                e.preventDefault();
                if (m.p !== m.c) return alert("Contraseñas no coinciden.");
                if (m.p.length < 5) return alert("Mínimo 5 caracteres.");
                try {
                    const userData = { nombre: toTitleCase(m.n), password: m.p, esMaestro: true, mustChangeCode: false };
                    await getColRef('admins').add(userData);
                    await getColRef('bitacora').add({ tipo: 'Sistema', subtipo: 'Activación', detalles: `Se activó perfil maestro para ${userData.nombre}`, timestamp: new Date().toISOString() });
                    alert("¡Activación Exitosa!"); onComplete(userData);
                } catch (e) { alert("Error."); }
            };
            return (
                <div className="flex-1 flex items-center justify-center p-6 bg-slate-950 h-screen animate-fade-in rounded-[3rem]">
                    <div className="bg-white p-12 rounded-[4rem] shadow-2xl w-full max-w-md text-center border-t-8 border-blue-600 relative z-10 font-sans">
                        <div className="p-5 bg-blue-600 text-white rounded-[2rem] inline-block mb-8 shadow-2xl"><Icon name="key" className="w-10 h-10"/></div>
                        <h2 className="text-3xl font-black uppercase text-slate-950 mb-2 leading-none font-black tracking-tight uppercase">Activar Maestro</h2>
                        <form onSubmit={handle} className="space-y-4 text-left mt-6">
                            <input className="w-full p-5 bg-slate-50 border rounded-2xl font-bold outline-none" placeholder="Su nombre completo" onChange={e => setM({...m, n: e.target.value})} required />
                            <input type="password" title="p" className="w-full p-5 bg-slate-50 border rounded-2xl font-bold outline-none" placeholder="Clave maestra (min 5)" onChange={e => setM({...m, p: e.target.value})} required />
                            <input type="password" title="c" className="w-full p-5 bg-slate-50 border rounded-2xl font-bold outline-none" placeholder="Confirmar" onChange={e => setM({...m, c: e.target.value})} required />
                            <button className="w-full py-5 bg-blue-600 text-white rounded-[1.5rem] font-black uppercase shadow-2xl mt-4 active:scale-95 transition-all">Establecer Acceso</button>
                        </form>
                    </div>
                </div>
            );
        }

        function GuardiaFlow({ agente, habitantes }) {
            const [search, setSearch] = useState("");
            const [sel, setSel] = useState(null);
            const [vName, setVName] = useState("");
            const [photo, setPhoto] = useState(null);
            const [scanning, setScanning] = useState(false);

            const handleReg = async () => {
                try {
                    await getColRef('bitacora').add({
                        tipo: 'Visita', subtipo: 'Entrada', visitante: vName.toUpperCase(), habitanteNombre: sel.nombre, casa: sel.casa, timestamp: new Date().toISOString(), autor: agente.nombre, fotoINE: photo
                    });
                    alert("Acceso autorizado."); setSel(null); setVName(""); setPhoto(null); setSearch("");
                } catch(e) { alert("Error."); }
            };

            const filtered = search.length > 1 ? habitantes.filter(h => h.nombre.toLowerCase().includes(search.toLowerCase()) || h.casa.toLowerCase().includes(search.toLowerCase())) : [];

            return (
                <div className="space-y-6 max-w-5xl mx-auto py-2 animate-fade-in pb-20">
                    <div className="bg-white p-5 rounded-[2.5rem] shadow-xl border border-slate-100 flex items-center gap-5 focus-within:ring-8 focus:ring-blue-50 group">
                        <Icon name="search" className="text-slate-300 w-10 h-10 transition-colors group-focus-within:text-blue-500 font-black" />
                        <input className="flex-1 outline-none text-xl font-black placeholder:text-slate-200 uppercase tracking-tighter" placeholder="Identificar habitante o lote..." value={search} onChange={e => setSearch(e.target.value)} />
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {filtered.map(h => (
                            <div key={h.id} className={`bg-white rounded-[2.5rem] shadow-xl border-t-[12px] flex flex-col animate-fade-in ${h.disponibleVisitas ? 'border-emerald-500' : 'border-rose-600'}`}>
                                <div className="p-6 space-y-5">
                                    <h4 className="font-black text-slate-900 uppercase text-lg truncate leading-tight">{h.nombre}</h4>
                                    <div className={`py-4 rounded-2xl text-center border-2 ${h.disponibleVisitas ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-rose-50 border-rose-200 text-rose-700'}`}>
                                        <span className="text-lg font-black uppercase tracking-tighter block leading-none">{h.disponibleVisitas ? 'PERMITIDO' : 'BLOQUEADO'}</span>
                                    </div>
                                    <button disabled={!h.disponibleVisitas} onClick={() => setSel(h)} className={`w-full py-4 rounded-2xl font-black text-xs uppercase shadow-lg transition-all active:scale-95 ${h.disponibleVisitas ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-slate-100 text-slate-300'}`}>Registrar Visita</button>
                                </div>
                            </div>
                        ))}
                    </div>
                    {sel && (
                        <div className="fixed inset-0 bg-slate-950/90 z-[200] flex items-center justify-center p-6 backdrop-blur-md overflow-y-auto">
                            <div className="bg-white p-10 rounded-[3.5rem] w-full max-w-md space-y-8 animate-fade-in relative text-center shadow-2xl border border-slate-100 overflow-hidden">
                                <h3 className="text-xl font-black uppercase text-slate-900 leading-none font-black tracking-tight">Nueva Visita</h3>
                                <div className="p-8 bg-slate-50 rounded-[3rem] border border-slate-100">
                                    <p className="text-xl font-black text-slate-800 uppercase leading-none font-black">{sel.nombre}</p>
                                    <p className="text-blue-600 font-black text-[11px] uppercase tracking-widest mt-1 leading-none">LOTE {sel.casa}</p>
                                </div>
                                <div className="space-y-6 text-left">
                                    <input autoFocus className="w-full p-5 bg-slate-50 rounded-3xl border-2 border-slate-100 font-bold outline-none focus:border-blue-500 uppercase text-center" placeholder="Nombre completo visitante" value={vName} onChange={e => setVName(e.target.value)} />
                                    <button onClick={() => setScanning(true)} className={`w-full py-5 rounded-[1.5rem] border-2 border-dashed flex items-center justify-center gap-3 transition-all ${photo ? 'bg-emerald-50 border-emerald-500 text-emerald-600' : 'bg-slate-50 border-slate-200 text-slate-400 hover:bg-slate-50'}`}>
                                        <Icon name="camera" /> {photo ? "IFE CAPTURADA" : "ESCANEAR INE VISITA"}
                                    </button>
                                    {photo && <img src={photo} className="w-full h-32 object-cover rounded-2xl border shadow-inner" alt="Previo INE" />}
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={() => {setSel(null); setPhoto(null);}} className="flex-1 py-5 bg-slate-50 text-slate-400 rounded-[1.5rem] font-black uppercase text-xs font-black transition-colors hover:bg-slate-100">Cerrar</button>
                                    <button disabled={!vName.trim()} onClick={handleReg} className="flex-1 py-5 bg-slate-950 text-white rounded-[1.5rem] font-black uppercase text-xs shadow-2xl active:scale-95 disabled:opacity-20 transition-all font-black">Autorizar</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {scanning && <IDScanner title="Fotografía INE Visitante" onCapture={(img) => { setPhoto(img); setScanning(false); }} onCancel={() => setScanning(false)} />}
                </div>
            );
        }

        function HabitanteModule({ habitante }) {
            const [updating, setUpdating] = useState(false);
            const claveRes = (n, c) => {
                const p = n.trim().split(/\s+/);
                const nPart = (p[0]||"XX").slice(0,2).toUpperCase();
                const sPart = (p[1]||p[0].slice(2,4)||"XX").slice(0,2).toUpperCase();
                const hPart = (c.trim().split(/\s+/)[0]||"XX").slice(0,2).toUpperCase();
                const match = c.match(/\d+/);
                const numPart = match ? match[0].padStart(2,'0').slice(-2) : "00";
                return `RES-${nPart}${sPart}${hPart}${numPart}`;
            };
            const currentClave = claveRes(habitante.nombre, habitante.casa);
            const toggle = async () => {
                setUpdating(true);
                await getColRef('habitantes').doc(habitante.id).update({ disponibleVisitas: !habitante.disponibleVisitas });
                setUpdating(false);
            };
            return (
                <div className="max-w-md mx-auto py-4 space-y-6 animate-fade-in text-slate-900 font-sans">
                    <div className="bg-white p-10 rounded-[4rem] shadow-2xl border border-slate-100 text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-3 bg-blue-600"></div>
                        <h2 className="text-2xl font-black uppercase mb-8 mt-2 tracking-tighter font-black leading-none uppercase">Pase Residencial</h2>
                        <img src={getQRCodeURL(currentClave)} className="w-56 h-56 mx-auto mb-6 shadow-sm" alt="QR" />
                        <div className="bg-slate-50 p-6 rounded-3xl border border-slate-100 w-full shadow-inner">
                            <span className="text-[10px] font-black uppercase text-slate-400 block mb-1 tracking-widest leading-none">Identificador Único</span>
                            <p className="font-black text-blue-600 text-2xl tracking-[0.2em] uppercase leading-none">{currentClave}</p>
                        </div>
                    </div>
                    <button disabled={updating} onClick={toggle} className={`w-full py-8 rounded-[2.5rem] font-black uppercase text-sm tracking-widest shadow-2xl transition-all active:scale-95 border-b-8 ${habitante.disponibleVisitas ? 'bg-emerald-500 border-emerald-700 text-white' : 'bg-rose-50 border-rose-700 text-white'}`}>
                        {updating ? <Icon name="loader" className="animate-spin mx-auto w-6 h-6" /> : (habitante.disponibleVisitas ? 'Pase de Visitas: ON' : 'Pase de Visitas: OFF')}
                    </button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
