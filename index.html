<html lang="es">
<head>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body, html { 
            margin: 0; padding: 0; height: 100vh; width: 100vw; 
            font-family: 'Inter', sans-serif; background-color: #f8fafc; 
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        #root { height: 100%; display: flex; flex-direction: column; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-splash-out { animation: splashOut 0.5s ease-in forwards; animation-delay: 2.7s; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes splashOut { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
            transform: translate3d(0, 0, 0);
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .camera-flash {
            position: fixed; inset: 0; background: white; z-index: 1000;
            pointer-events: none; opacity: 0;
        }
        .camera-flash.active { animation: flash-anim 0.4s ease-out; }
        @keyframes flash-anim { 0% { opacity: 1; } 100% { opacity: 0; } }
        
        .scanner-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            z-index: 10; pointer-events: none;
        }
        .scanner-guide {
            width: 85vw; height: 53.8vw;
            max-width: 440px; max-height: 278px;
            position: relative; border-radius: 20px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.75);
            border: 2px solid rgba(255, 255, 255, 0.4);
        }
        .scanner-corner { position: absolute; width: 30px; height: 30px; border: 4px solid #3b82f6; }
        .c-tl { top: -4px; left: -4px; border-right: 0; border-bottom: 0; border-radius: 14px 0 0 0; }
        .c-tr { top: -4px; right: -4px; border-left: 0; border-bottom: 0; border-radius: 0 14px 0 0; }
        .c-bl { bottom: -4px; left: -4px; border-right: 0; border-top: 0; border-radius: 0 0 0 14px; }
        .c-br { bottom: -4px; right: -4px; border-left: 0; border-top: 0; border-radius: 0 0 14px 0; }

        .diagonal-strike {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
            white-space: nowrap;
            z-index: 30;
            pointer-events: none;
            padding: 2px 6px;
            background: rgba(255, 255, 255, 0.2);
            border: 1.5px solid #ef4444;
            color: #ef4444;
            font-size: 8px;
            font-weight: 900;
            border-radius: 3px;
            text-transform: uppercase;
        }

        /* Input fix for iOS zoom */
        input, select, textarea { font-size: 16px !important; }

        @media print {
            body * { visibility: hidden !important; }
            #print-area, #print-area * { visibility: visible !important; }
            #print-area { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; display: flex !important; align-items: center !important; justify-content: center !important; padding: 1cm !important; }
            #print-area img { max-width: 14cm !important; border-radius: 0.3cm !important; border: 1px solid #ddd !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>

    <script type="text/babel">
        const { useState, useEffect, Fragment, useRef } = React;

        // --- Configuración de Firebase ---
        const firebaseConfig = {
            apiKey: "AIzaSyCu2kV9s9ZCmQCFElHZaf7vXPUKStVAh9o",

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = "viyautepec2seccion";
        const VERSION = "Ver. 6.9";

        const CATEGORIAS_ACCESO = [
            { id: 'visita', label: 'Visita', icon: 'user', color: 'emerald' },
            { id: 'delivery', label: 'Delivery', icon: 'motorcycle', color: 'orange' },
            { id: 'paquetería', label: 'Paquetería', icon: 'package', color: 'blue' },
            { id: 'empleado', label: 'Empleado', icon: 'worker-helmet', color: 'amber' },
            { id: 'construccion', label: 'Mat. Construcción', icon: 'truck', color: 'slate' }
        ];

        // --- Utilidades Globales ---
        const getColRef = (name) => db.collection('artifacts').doc(appId).collection('public').doc('data').collection(name);

        const toTitleCase = (str) => {
            if (!str) return "";
            return str.toLowerCase().split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        };

        const getClaveResidente = (n, c) => {
            if (!n || !c) return "RES-XXXX00";
            const p = n.trim().split(/\s+/);
            const nPart = (p[0]||"XX").slice(0,2).toUpperCase();
            const sPart = (p[1]||p[0].slice(2,4)||"XX").slice(0,2).toUpperCase();
            const hPart = (c.trim().split(/\s+/)[0]||"XX").slice(0,2).toUpperCase();
            const match = c.match(/\d+/);
            const numPart = match ? match[0].padStart(2,'0').slice(-2) : "00";
            return `RES-${nPart}${sPart}${hPart}${numPart}`;
        };

        const getQRCodeURL = (data) => `https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=${encodeURIComponent(data)}`;

        const playErrorSound = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const playTone = (freq, startTime, duration) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0.1, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + duration);
                };
                playTone(100, ctx.currentTime, 0.2);
                playTone(100, ctx.currentTime + 0.25, 0.2);
            } catch (e) { }
        };

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,
                user: <Fragment><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Fragment>,
                camera: <Fragment><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></Fragment>,
                printer: <Fragment><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></Fragment>,
                "arrow-left": <Fragment><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 5 5 12 12 19"/></Fragment>,
                trash: <Fragment><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Fragment>,
                edit: <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>,
                "plus-circle": <Fragment><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></Fragment>,
                "alert-circle": <Fragment><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></Fragment>,
                x: <Fragment><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Fragment>,
                "x-circle": <Fragment><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></Fragment>,
                key: <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>,
                lock: <Fragment><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Fragment>,
                eye: <Fragment><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></Fragment>,
                "eye-off": <Fragment><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></Fragment>,
                package: <Fragment><path d="M16.5 9.4L7.5 4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></Fragment>,
                motorcycle: <path d="M5 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm14 0a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM6 18h12m-9 0 1-4h5l1 4m-7-4h6l-1-4h-4zM16 10l-1.5-3h-5L8 10"/>,
                "worker-helmet": <Fragment><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4z M12 14c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/><path d="M9 4a5 5 0 0 1 6 0"/><line x1="12" y1="1" x2="12" y2="4"/></Fragment>,
                truck: <Fragment><rect x="1" y="3" width="15" height="13" /><polygon points="16 8 20 8 23 11 23 16 16 16 16 8" /><circle cx="5.5" cy="18.5" r="2.5" /><circle cx="18.5" cy="18.5" r="2.5" /><path d="M1 10h15" /></Fragment>,
                image: <Fragment><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></Fragment>,
                search: <Fragment><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Fragment>,
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        function PasswordInput({ name, placeholder, value, onChange }) {
            const [show, setShow] = useState(false);
            return (
                <div className="relative font-black">
                    <input name={name} type={show ? "text" : "password"} placeholder={placeholder} value={value} onChange={onChange} className="w-full p-4 pr-12 bg-slate-50 border rounded-2xl font-bold outline-none focus:ring-4 focus:ring-blue-100 shadow-sm" required />
                    <button type="button" onClick={() => setShow(!show)} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 hover:text-blue-500 transition-colors font-black">
                        <Icon name={show ? "eye-off" : "eye"} className="w-5 h-5 font-black" />
                    </button>
                </div>
            );
        }

        function IDScannerWidget({ onCapture, onCancel }) {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const guideRef = useRef(null);
            const [isAutoDetecting, setIsAutoDetecting] = useState(false);
            const [isFlashing, setIsFlashing] = useState(false);
            const autoTimer = useRef(null);

            useEffect(() => {
                const constraints = { video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } };
                navigator.mediaDevices.getUserMedia(constraints)
                .then(s => { 
                    if(videoRef.current) videoRef.current.srcObject = s;
                    setTimeout(() => { setIsAutoDetecting(true); autoTimer.current = setTimeout(capture, 2800); }, 1200);
                })
                .catch(err => { alert("Error cámara: " + err.message); onCancel(); });
                return () => {
                    if (videoRef.current?.srcObject) videoRef.current.srcObject.getTracks().forEach(t => t.stop());
                    if (autoTimer.current) clearTimeout(autoTimer.current);
                };
            }, []);

            const capture = () => {
                if (!videoRef.current || !guideRef.current) return;
                const v = videoRef.current; const g = guideRef.current; const c = canvasRef.current; const ctx = c.getContext('2d');
                setIsFlashing(true); setTimeout(() => setIsFlashing(false), 400);
                const scale = v.videoWidth / v.clientWidth;
                const rG = g.getBoundingClientRect();
                const rV = v.getBoundingClientRect();
                const sx = (rG.left - rV.left) * scale;
                const sy = (rG.top - rV.top) * scale;
                const sw = rG.width * scale;
                const sh = rG.height * scale;
                c.width = 1600; c.height = 1012;
                ctx.drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
                onCapture(c.toDataURL('image/jpeg', 0.92));
            };

            return (
                <div className="fixed inset-0 bg-black z-[500] flex flex-col items-center justify-center overflow-hidden font-bold text-white">
                    <div className={`camera-flash ${isFlashing ? 'active' : ''}`} />
                    <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover" />
                    <div className="scanner-container">
                        <div ref={guideRef} className={`scanner-guide ${isAutoDetecting ? 'detecting' : ''}`}>
                            <div className="scanner-corner c-tl"></div><div className="scanner-corner c-tr"></div>
                            <div className="scanner-corner c-bl"></div><div className="scanner-corner c-br"></div>
                        </div>
                    </div>
                    <div className="absolute bottom-12 flex justify-center gap-12 items-center z-20 w-full px-6">
                        <button onClick={onCancel} className="p-5 bg-white/10 text-white rounded-full"><Icon name="x" className="w-8 h-8" /></button>
                        <button onClick={capture} className="w-24 h-24 bg-white/10 rounded-full border-[10px] border-white/20 active:scale-90 flex items-center justify-center"><div className="w-14 h-14 bg-white rounded-full"></div></button>
                        <div className="w-16"></div>
                    </div>
                    <canvas ref={canvasRef} className="hidden" />
                </div>
            );
        }

        function AdminView({ habitantes, agentes, logs, admins, role, activeUser, onResetSuccess }) {
            const [tab, setTab] = useState('residentes');
            const [view, setView] = useState('list');
            const [selectedPhoto, setSelectedPhoto] = useState(null);
            const [isActionLoading, setIsActionLoading] = useState(false);
            const [form, setForm] = useState({ nombre: '', casa: '', password: '' });
            const [passRecovery, setPassRecovery] = useState(null); 
            const [editResident, setEditResident] = useState(null);
            const [passError, setPassError] = useState("");

            const isMaestro = activeUser?.esMaestro || role === 'superuser';

            // REGLA: Súper Usuario es invisible para el Maestro y para otros Auxiliares
            const filteredAdmins = admins.filter(a => {
                if (role === 'superuser') return a.usuario !== 'superuser'; 
                if (activeUser?.esMaestro) return !a.esMaestro && a.usuario !== 'superuser'; 
                return false;
            });

            // REGLA: Filtrado de Bitácora por Jerarquía Estricta
            const displayLogs = (() => {
                if (role === 'superuser') return logs;
                if (activeUser?.esMaestro) return logs.filter(l => l.autorRole !== 'SUPERUSER');
                // Auxiliar solo ve visitas y denegaciones
                return logs.filter(l => l.tipo === 'Visita' || l.tipo === 'Acceso Denegado');
            })();

            const resetFormStates = () => { setForm({ nombre: '', casa: '', password: '' }); setView('list'); setPassError(""); };
            useEffect(() => { resetFormStates(); }, [tab]);

            const logAction = async (tipo, detalles) => {
                await getColRef('bitacora').add({ 
                    tipo, detalles, 
                    autor: activeUser.nombre, 
                    autorRole: role === 'superuser' ? 'SUPERUSER' : (activeUser.esMaestro ? 'MAESTRO' : 'AUXILIAR'),
                    timestamp: new Date().toISOString() 
                });
            };

            const resetSystem = async () => {
                if (!confirm("¡ADVERTENCIA! Esta acción borrará TODOS los datos. ¿Desea continuar?")) return;
                setIsActionLoading(true);
                try {
                    const collections = ['habitantes', 'agentes', 'bitacora', 'admins'];
                    for (const col of collections) {
                        const snap = await getColRef(col).get();
                        const batch = db.batch();
                        snap.forEach(doc => batch.delete(doc.ref));
                        await batch.commit();
                    }
                    onResetSuccess();
                } catch (e) { alert("Error al reiniciar."); }
                setIsActionLoading(false);
            };

            const deleteEntry = async (colName, id, nombre) => {
                if(!confirm(`¿Desea eliminar registro de: ${nombre}?`)) return;
                try { 
                    await getColRef(colName).doc(id).delete(); 
                    await logAction('Sistema', `Eliminó registro: ${nombre} de ${colName}`); 
                } catch (e) { alert("Error."); }
            };

            const handlePassRecovery = async (e) => {
                e.preventDefault(); 
                const newPass = e.target.newpass.value;
                if(newPass.length < 5) { setPassError("Mínimo 5 caracteres."); return; }
                setPassError(""); setIsActionLoading(true);
                try {
                    await getColRef(passRecovery.col).doc(passRecovery.id).update({ password: newPass, mustChangeCode: true });
                    await logAction('Sistema', `Cambió clave de ${passRecovery.nombre}`);
                    alert("Clave actualizada."); setPassRecovery(null);
                } catch (e) { alert("Error."); }
                setIsActionLoading(false);
            };

            const handleResidentUpdate = async (e) => {
                e.preventDefault(); const n = toTitleCase(e.target.editName.value); const h = e.target.editHouse.value;
                setIsActionLoading(true);
                try {
                    await getColRef('habitantes').doc(editResident.id).update({ nombre: n, casa: h });
                    setEditResident(null);
                } catch (e) { alert("Error."); }
                setIsActionLoading(false);
            };

            const handleSave = async (e) => {
                e.preventDefault(); 
                if (form.password.length < 5) { setPassError("Mínimo 5 caracteres."); return; }
                setPassError(""); setIsActionLoading(true);
                const colName = tab === 'residentes' ? 'habitantes' : (tab === 'guardias' ? 'agentes' : 'admins');
                try {
                    const finalName = toTitleCase(form.nombre);
                    const data = { nombre: finalName, password: form.password, mustChangeCode: true, esMaestro: false };
                    if (tab === 'residentes') { data.casa = form.casa; CATEGORIAS_ACCESO.forEach(cat => data[`permiso_${cat.id}`] = true); }
                    await getColRef(colName).add(data);
                    await logAction('Sistema', `Creó registro: ${finalName} en ${tab}`);
                    resetFormStates();
                } catch (err) { alert("Error."); }
                setIsActionLoading(false);
            };

            return (
                <div className="space-y-4 animate-fade-in pb-24 h-full font-black">
                    <div className="flex gap-2 bg-white p-2 rounded-2xl shadow-sm border border-slate-200 w-fit overflow-x-auto max-w-full no-print">
                        {['residentes', 'guardias', 'bitacora', (isMaestro && 'administradores')].filter(Boolean).map(t => (
                            <button key={t} onClick={() => setTab(t)} className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all whitespace-nowrap ${tab === t ? 'bg-slate-900 text-white shadow-lg' : 'text-slate-400'}`}>{t}</button>
                        ))}
                    </div>

                    <div className="bg-white p-6 rounded-[2.5rem] shadow-xl border border-slate-100 min-h-[500px]">
                        <div className="flex justify-between items-center mb-8 font-black">
                            <h2 className="text-xl font-black uppercase text-slate-800 tracking-tight leading-none">{tab}</h2>
                            <div className="flex gap-3">
                                {role === 'superuser' && tab === 'bitacora' && <button onClick={resetSystem} className="flex items-center gap-2 px-4 py-2 bg-rose-600 text-white text-[10px] font-black uppercase rounded-xl shadow-lg border border-rose-500 active:scale-95 transition-all">REINICIAR SISTEMA</button>}
                                {view === 'list' && tab !== 'bitacora' && <button onClick={() => setView('add')} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white text-[10px] font-black uppercase rounded-xl shadow-lg active:scale-95 transition-all font-black"><Icon name="plus-circle" /> Nuevo</button>}
                            </div>
                        </div>

                        {view === 'list' ? (
                            <div className="overflow-x-auto rounded-3xl border border-slate-100 font-medium font-black">
                                <table className="w-full text-left text-sm font-black">
                                    <thead className="bg-slate-50 font-black uppercase text-[10px] text-slate-400">

            const handleReg = async (isAuthorized = true) => {
                try {
                    await getColRef('bitacora').add({
                        tipo: isAuthorized ? 'Visita' : 'Acceso Denegado', 
                        subtipo: CATEGORIAS_ACCESO.find(c => c.id === catId)?.label.toUpperCase(), 
                        visitante: vName.toUpperCase() || 'DESCONOCIDO',

                                    <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100 flex justify-between items-center font-black">
                                        <span className="text-[10px] text-slate-400 font-black uppercase">LOTE</span>
                                        <span className="text-sm font-black text-blue-600 font-black">{h.casa}</span>
                                    </div>
                                    <button onClick={() => { setSel(h); setStep(2); }} className="w-full py-4 bg-slate-950 text-white rounded-2xl font-black text-xs uppercase shadow-lg active:scale-95 transition-all font-black">Verificar Entrada</button>
                                </div>
                            </div>

                    </div>
                    {sel && (
                        <div className="fixed inset-0 bg-slate-950/90 z-[200] flex items-center justify-center p-4 backdrop-blur-md overflow-y-auto font-black font-black">
                            <div className="bg-white p-6 sm:p-8 rounded-[3.5rem] w-full max-w-lg space-y-8 animate-fade-in relative text-center shadow-2xl border border-slate-100 font-black font-black">
                                <h3 className="text-xl font-black uppercase text-slate-900 font-black uppercase font-black font-black">Acceso a Domicilio</h3>
                                <div className="p-6 bg-slate-50 rounded-[3rem] border border-slate-100 leading-none font-black font-black"><p className="text-xl font-black text-slate-800 uppercase mb-1 font-black">{sel.nombre}</p><p className="text-blue-600 font-black text-[11px] uppercase tracking-widest font-black font-black">LOTE {sel.casa}</p></div>
                                
                                {step === 2 && (
                                    <div className="space-y-6 font-black font-black">
                                        <p className="text-[10px] font-black uppercase text-slate-400 tracking-widest font-black font-black">Tablero de Autorización</p>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 font-black">
                                            {CATEGORIAS_ACCESO.map(cat => {
                                                const allowed = sel[`permiso_${cat.id}`] !== false;
                                                return (
                                                    <button key={cat.id} onClick={() => { setCatId(cat.id); setStep(3); }}
                                                        className={`flex flex-col items-center justify-center gap-1 p-4 rounded-3xl border-2 transition-all active:scale-90 font-black bg-white border-slate-100 text-slate-900 relative`}
                                                    >
                                                        <div className={`p-3 rounded-2xl bg-${cat.color}-100 text-${cat.color}-600 font-black relative`}>
                                                            <Icon name={cat.icon} className="w-8 h-8 font-black" />

                                                                <div className="diagonal-strike font-black">BLOQUEADO</div>
                                                            )}
                                                        </div>
                                                        <div className="text-center font-black mt-2 font-black">
                                                            <span className="text-[8px] uppercase leading-none block font-black mb-1 font-black">{cat.label}</span>
                                                            {allowed && <span className="text-[8px] font-black uppercase text-emerald-500 font-black font-black">PERMITIDO</span>}
                                                        </div>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                                {step === 3 && (
                                    <div className="space-y-6 text-left font-black font-black font-black font-black">
                                        <div className={`${sel[`permiso_${catId}`] !== false ? 'bg-blue-600' : 'bg-rose-600'} text-white p-5 rounded-[2.5rem] flex items-center gap-5 font-black`}>

        function App() {
            const [showSplash, setShowSplash] = useState(true);
            const [user, setUser] = useState(null);
            const [role, setRole] = useState(null); 
            const [activeUser, setActiveUser] = useState(null);
            const [habitantes, setHabitantes] = useState([]);
            const [agentes, setAgentes] = useState([]);
            const [admins, setAdmins] = useState([]);
            const [logs, setLogs] = useState([]);
            const [loading, setLoading] = useState(true);
            const [dataReady, setDataReady] = useState(false);
            const [authStep, setAuthStep] = useState('login');
            const [loginError, setLoginError] = useState(false);
            const [loginPass, setLoginPass] = useState("");

            const forceReset = () => { setRole(null); setActiveUser(null); setAuthStep('login'); setLoginError(false); setLoginPass(""); };

            useEffect(() => {
                const timer = setTimeout(() => setShowSplash(false), 3000);
                const init = async () => { try { await auth.signInAnonymously(); auth.onAuthStateChanged((u) => { if (u) setUser(u); }); } catch (e) { } };
                init(); return () => clearTimeout(timer);
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsub1 = getColRef('habitantes').onSnapshot(s => setHabitantes(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsub2 = getColRef('agentes').onSnapshot(s => setAgentes(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsub3 = getColRef('bitacora').onSnapshot(s => setLogs(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsub4 = getColRef('admins').onSnapshot(s => { setAdmins(s.docs.map(d => ({ id: d.id, ...d.data() }))); setDataReady(true); setLoading(false); });
                return () => { unsub1(); unsub2(); unsub3(); unsub4(); };
            }, [user]);

            const handleLogin = async (nameInput, passInput) => {
                if (!dataReady) return alert("Sincronizando...");
                const formattedName = toTitleCase(nameInput.trim());
                let foundUser = null, foundRole = null;
                if (nameInput.toLowerCase() === 'superuser' && passInput === 'tlahuiscalpantecutli') { foundUser = { nombre: 'Súper Usuario', usuario: 'superuser' }; foundRole = 'superuser'; }
                else {
                    const admin = admins.find(a => a.nombre === formattedName && a.password === passInput);
                    if (admin) { foundUser = admin; foundRole = 'admin'; }
                    else {
                        const guard = agentes.find(a => a.nombre === formattedName && a.password === passInput);
                        if (guard) { foundUser = guard; foundRole = 'guardia'; }
                        else {
                            const hab = habitantes.find(h => h.nombre === formattedName && h.password === passInput);
                            if (hab) { foundUser = hab; foundRole = 'habitante'; }
                        }
                    }
                }
                if (foundUser) { setActiveUser(foundUser); setRole(foundRole); setAuthStep('dashboard'); setLoginError(false); await getColRef('bitacora').add({ tipo: 'Acceso Sistema', subtipo: foundRole.toUpperCase(), habitanteNombre: foundUser.nombre, timestamp: new Date().toISOString(), autorRole: foundRole === 'superuser' ? 'SUPERUSER' : (foundUser.esMaestro ? 'MAESTRO' : 'AUXILIAR') }); }
                else { setLoginError(true); playErrorSound(); setTimeout(() => setLoginError(false), 800); }
            };

            if (showSplash) return (
                <div className="fixed inset-0 z-[1000] bg-slate-950 flex flex-col items-center justify-center text-white animate-splash-out p-6 font-black font-black font-black font-black">
                    <div className="p-8 bg-blue-600 rounded-[3rem] shadow-[0_0_100px_rgba(37,99,235,0.4)] animate-bounce mb-8 border border-blue-400/20 shadow-blue-600/30 font-black font-black"><Icon name="shield" className="w-16 h-16 sm:w-24 sm:h-24 text-white shadow-2xl" /></div>
                    <h1 className="responsive-title font-black text-center tracking-tighter px-2 font-black font-black font-black">{TITULO_SISTEMA}</h1>
                    <p className="mt-4 text-[10px] uppercase font-black tracking-[0.6em] text-white/40 font-black">{VERSION}</p>
                </div>
            );
            if (loading) return null;
            if (authStep === 'login' && !activeUser) return (
                <div className="flex-1 flex items-center justify-center p-6 bg-slate-50 h-screen animate-fade-in font-sans text-center font-black font-black font-black">
                    <div className={`bg-white p-10 rounded-[3.5rem] shadow-2xl w-full max-w-sm border-2 text-center relative overflow-hidden transition-all duration-300 ${loginError ? 'shake border-rose-500 font-black' : 'border-slate-100 font-black font-black'}`}>
                        <div className={`absolute top-0 left-0 w-full h-2 ${loginError ? 'bg-rose-500 font-black' : 'bg-slate-900 font-black'}`}></div>
                        <div className="flex justify-center mb-6 font-black font-black"><div className={`p-4 rounded-2xl shadow-xl transition-colors duration-300 ${loginError ? 'bg-rose-500' : 'bg-slate-900'} text-white font-black font-black`}><Icon name={loginError ? "alert-circle" : "lock"} className="w-8 h-8 font-black font-black" /></div></div>
                        <h2 className={`text-xl sm:text-2xl font-black transition-colors duration-300 ${loginError ? 'text-rose-600' : 'text-slate-900'} leading-tight tracking-tight px-2 break-words font-black`}>{TITULO_SISTEMA}</h2>
                        <p className="text-[10px] text-slate-400 font-bold uppercase mb-8 tracking-widest leading-none mt-2 font-black font-black font-black font-black">{VERSION}</p>
                        <form onSubmit={e => { e.preventDefault(); handleLogin(e.target.name.value, loginPass); }} className="space-y-4 text-left font-black">
                            <input name="name" className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-xs outline-none focus:ring-4 focus:ring-blue-100 shadow-sm font-black font-black" style={{fontSize: '16px'}} placeholder="Nombre completo" required />
                            <PasswordInput placeholder="Contraseña" value={loginPass} onChange={e => setLoginPass(e.target.value)} />
                            <button className={`w-full py-4 rounded-2xl font-black uppercase shadow-xl transition-all text-[11px] tracking-widest ${loginError ? 'bg-rose-500 font-black' : 'bg-slate-900 hover:bg-black font-black'} text-white font-black font-black font-black font-black font-black`}>{loginError ? 'REINTENTAR' : 'Entrar al Sistema'}</button>
                            <button type="button" onClick={forceReset} className="w-full mt-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-400 rounded-xl font-black uppercase text-[9px] tracking-[0.2em] transition-all flex items-center justify-center gap-2 font-black font-black font-black"><Icon name="log-out" className="w-3 h-3 font-black font-black font-black" /> Salir / Regresar</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="h-full flex flex-col overflow-hidden bg-slate-50 animate-fade-in font-sans font-black font-black font-black">
                    <header className="bg-slate-900 text-white h-16 flex items-center justify-between px-6 shadow-2xl shrink-0 z-[100] border-b border-slate-800 font-black">
                        <div className="flex items-center gap-3 font-black">
                            <Icon name="shield" className="w-5 h-5 text-blue-500 font-black" />
                            <div className="flex flex-col leading-none font-black overflow-hidden font-black">
                                <span className="text-[10px] sm:text-xs tracking-tighter leading-none font-black truncate max-w-[120px] sm:max-w-none font-black">{TITULO_SISTEMA}</span>
                                <span className="text-[7px] font-bold text-blue-400 uppercase tracking-widest mt-1 uppercase font-black">CONTROL - {VERSION}</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-4 font-sans font-black font-black font-black">
                            <div className="flex flex-col items-end text-right font-black font-black font-black font-black font-black">
                                <span className="text-[10px] font-black uppercase text-white leading-none mb-1 truncate max-w-[150px] font-black font-black">{activeUser?.nombre}</span>
                                <span className="text-[8px] font-black text-blue-400 uppercase tracking-widest leading-none uppercase font-black font-black">
                                    {role === 'admin' ? (activeUser?.esMaestro ? 'ADMIN MAESTRO' : 'ADMIN AUXILIAR') : role === 'guardia' ? 'GUARDIA' : role === 'superuser' ? 'SÚPER USUARIO' : 'RESIDENTE'}
                                </span>
                            </div>
                            <button onClick={forceReset} className="px-3 py-1.5 bg-slate-800 hover:bg-rose-600 text-white rounded-lg font-bold text-[9px] uppercase transition-all shadow-lg border border-slate-700 font-black font-black font-black font-black">Salir</button>
                        </div>
                    </header>
                    <div className="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar bg-slate-50 font-black font-black font-black">
                        <div className="max-w-7xl mx-auto w-full h-full no-print font-black font-black font-black font-black font-black">
                            {(role === 'admin' || role === 'superuser') && <AdminView habitantes={habitantes} agentes={agentes} logs={logs} admins={admins} role={role} activeUser={activeUser} onResetSuccess={forceReset} />}
                            {role === 'habitante' && <HabitanteModule habitante={habitantes.find(h => h.id === activeUser?.id) || activeUser} />}
                            {role === 'guardia' && <GuardiaFlow agente={activeUser} habitantes={habitantes} />}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
