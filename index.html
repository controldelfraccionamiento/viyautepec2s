<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viyautepec 2a. Sección - Control de Accesos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body, html { 
            margin: 0; padding: 0; height: 100vh; width: 100vw; 
            font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow: hidden; 
        }
        #root { height: 100%; display: flex; flex-direction: column; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-splash-out { animation: splashOut 0.5s ease-in forwards; animation-delay: 2.7s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes splashOut { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
        
        .scanner-guide {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; height: 55%; border: 4px solid #3b82f6; border-radius: 24px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.75); z-index: 10;
        }

        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 1cm; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, Fragment, useRef } = React;

        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyCu2kV9s9ZCmQCFElHZaf7vXPUKStVAh9o",
            authDomain: "viyautepec2seccion.firebaseapp.com",
            projectId: "viyautepec2seccion",
            storageBucket: "viyautepec2seccion.firebasestorage.app",
            messagingSenderId: "1008154187449",
            appId: "1:1008154187449:web:669811e04babbbfb986d68",
            measurementId: "G-D828S2ZK3H"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = "viyautepec2seccion";

        // --- Helper de Rutas ---
        const getColRef = (name) => db.collection('artifacts').doc(appId).collection('public').doc('data').collection(name);

        // --- Utilidades de Formato ---
        const toTitleCase = (str) => {
            if (!str) return "";
            return str.toLowerCase().split(' ').map(word => {
                return word.charAt(0).toUpperCase() + word.slice(1);
            }).join(' ');
        };

        const getClaveResidente = (n, c) => {
            const p = n.trim().split(/\s+/);
            const namePart = (p[0]||"XX").slice(0,2).toUpperCase();
            const surPart = (p[1]||p[0].slice(2,4)||"XX").slice(0,2).toUpperCase();
            const housePart = (c.trim().split(/\s+/)[0]||"XX").slice(0,2).toUpperCase();
            const match = c.match(/\d+/);
            const numPart = match ? match[0].padStart(2,'0').slice(-2) : "00";
            return `RES-${namePart}${surPart}${housePart}${numPart}`;
        };

        const getQRCodeURL = (data) => `https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=${encodeURIComponent(data)}`;

        // Iconos SVG
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,
                user: <Fragment><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Fragment>,
                camera: <Fragment><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></Fragment>,
                printer: <Fragment><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></Fragment>,
                "arrow-left": <Fragment><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></Fragment>,
                x: <Fragment><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Fragment>,
                image: <Fragment><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></Fragment>,
                "plus-circle": <Fragment><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></Fragment>,
                "refresh-cw": <Fragment><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></Fragment>,
                "search": <Fragment><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Fragment>,
                lock: <Fragment><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Fragment>,
                loader: <path d="M21 12a9 9 0 1 1-6.21-8.58"/>,
                "key": <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        // --- Componentes Compartidos ---
        function IDScanner({ onCapture, onCancel, title = "Capture la identificación" }) {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [stream, setStream] = useState(null);

            useEffect(() => {
                const init = async () => {
                    try {
                        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: 1280, height: 720 } });
                        setStream(s); if(videoRef.current) videoRef.current.srcObject = s;
                    } catch(e) { alert("Cámara no disponible."); onCancel(); }
                };
                init();
                return () => { if(stream) stream.getTracks().forEach(t => t.stop()); };
            }, []);

            const capture = () => {
                const ctx = canvasRef.current.getContext('2d');
                canvasRef.current.width = videoRef.current.videoWidth;
                canvasRef.current.height = videoRef.current.videoHeight;
                ctx.drawImage(videoRef.current, 0, 0);
                onCapture(canvasRef.current.toDataURL('image/jpeg', 0.7));
                if (stream) stream.getTracks().forEach(t => t.stop());
            };

            return (
                <div className="fixed inset-0 bg-black z-[500] flex flex-col items-center justify-center">
                    <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover" />
                    <div className="scanner-guide"></div>
                    <div className="absolute top-12 left-0 w-full text-center z-20 px-4">
                        <p className="text-white text-[10px] font-black uppercase tracking-widest bg-black/60 py-3 rounded-full border border-white/10 px-8 inline-block">{title}</p>
                    </div>
                    <div className="absolute bottom-12 flex justify-center gap-10 items-center z-20 w-full px-6">
                        <button onClick={onCancel} className="p-5 bg-white/10 text-white rounded-full border border-white/20"><Icon name="x" className="w-8 h-8" /></button>
                        <button onClick={capture} className="w-24 h-24 bg-white rounded-full border-[10px] border-white/30 active:scale-90 transition-all"></button>
                        <div className="w-16"></div>
                    </div>
                    <canvas ref={canvasRef} className="hidden" />
                </div>
            );
        }

        // --- Vista: Administración ---
        function AdminView({ habitantes, agentes, logs, admins, role, activeUser, onResetSuccess }) {
            const [tab, setTab] = useState('residentes');
            const [view, setView] = useState('list');
            const [selectedPhoto, setSelectedPhoto] = useState(null);
            const [isActionLoading, setIsActionLoading] = useState(false);
            const [isScanningAgent, setIsScanningAgent] = useState(false);
            const [agentPhoto, setAgentPhoto] = useState(null);
            const [form, setForm] = useState({ nombre: '', casa: '', usuario: '', password: '' });

            const isMaestro = activeUser?.esMaestro || role === 'superuser';

            const deleteEntry = async (col, id) => {
                if(!confirm("¿Seguro que desea eliminar este registro permanentemente?")) return;
                try {
                    await getColRef(col).doc(id).delete();
                    alert("Registro eliminado.");
                } catch (e) { alert("Error: " + e.message); }
            };

            const resetAdministrators = async () => {
                if(!confirm("PELIGRO: Se borrarán todos los administradores. El acceso inicial 'admin / 123' se activará de nuevo. ¿Confirmar?")) return;
                setIsActionLoading(true);
                try {
                    const snapshot = await getColRef('admins').get();
                    const batch = db.batch();
                    snapshot.forEach(doc => batch.delete(doc.ref));
                    await batch.commit();
                    alert("Base de datos limpia.");
                    onResetSuccess();
                } catch (e) { alert("Error: " + e.message); }
                setIsActionLoading(false);
            };

            const handleSave = async (e) => {
                e.preventDefault();
                if (form.password.length < 5) return alert("La contraseña debe tener al menos 5 caracteres.");
                
                setIsActionLoading(true);
                const colName = tab === 'residentes' ? 'habitantes' : (tab === 'agentes' ? 'agentes' : 'admins');
                try {
                    const data = { 
                        ...form, 
                        nombre: toTitleCase(form.nombre), // Title Case
                        usuario: (form.usuario || "").trim().toLowerCase(), 
                        mustChangeCode: true 
                    };
                    if (tab === 'residentes') data.disponibleVisitas = true;
                    if (tab === 'administradores') data.esMaestro = false;
                    if (tab === 'agentes' && agentPhoto) data.fotoINE = agentPhoto;

                    await getColRef(colName).add(data);
                    alert("Guardado correctamente.");
                    setForm({ nombre: '', casa: '', usuario: '', password: '' });
                    setAgentPhoto(null);
                    setView('list');
                } catch (err) { alert("Error: " + err.message); }
                setIsActionLoading(false);
            };

            useEffect(() => { setView('list'); }, [tab]);

            return (
                <div className="space-y-4 animate-fade-in pb-24 h-full">
                    <div className="flex gap-2 bg-white p-2 rounded-2xl shadow-sm border border-slate-200 w-fit overflow-x-auto max-w-full no-print">
                        {['residentes', 'agentes', 'bitacora', (isMaestro ? 'administradores' : null)].filter(Boolean).map(t => (
                            <button key={t} onClick={() => setTab(t)} className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all whitespace-nowrap ${tab === t ? 'bg-slate-900 text-white shadow-lg' : 'text-slate-400'}`}>{t}</button>
                        ))}
                    </div>

                    <div className="bg-white p-6 rounded-[2.5rem] shadow-xl border border-slate-100 min-h-[500px]">
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="text-2xl font-black uppercase text-slate-800 tracking-tight">{tab}</h2>
                            <div className="flex gap-3">
                                {role === 'superuser' && tab === 'administradores' && (
                                    <button onClick={resetAdministrators} disabled={isActionLoading} className="flex items-center gap-2 px-4 py-2 bg-rose-600 text-white text-[10px] font-black uppercase rounded-xl shadow-lg disabled:opacity-50">
                                        <Icon name="refresh-cw" className={isActionLoading ? 'animate-spin' : ''} /> Reiniciar Admins
                                    </button>
                                )}
                                {view === 'list' && tab !== 'bitacora' && (
                                    <button onClick={() => setView('add')} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white text-[10px] font-black uppercase rounded-xl shadow-lg">
                                        <Icon name="plus-circle" /> Nuevo {tab.slice(0,-1)}
                                    </button>
                                )}
                            </div>
                        </div>

                        {view === 'add' ? (
                            <div className="max-w-md mx-auto py-4 animate-fade-in">
                                <form onSubmit={handleSave} className="space-y-5">
                                    <input className="w-full p-4 bg-slate-50 border rounded-2xl font-bold outline-none focus:ring-4 focus:ring-blue-100" placeholder="Nombre completo" value={form.nombre} onChange={e => setForm({...form, nombre: e.target.value})} required />
                                    {tab === 'residentes' ? (
                                        <input className="w-full p-4 bg-slate-50 border rounded-2xl font-bold outline-none focus:ring-4 focus:ring-blue-100" placeholder="Lote / Casa" value={form.casa} onChange={e => setForm({...form, casa: e.target.value})} required />
                                    ) : (
                                        <input className="w-full p-4 bg-slate-50 border rounded-2xl font-bold outline-none focus:ring-4 focus:ring-blue-100" placeholder="ID de Usuario" value={form.usuario} onChange={e => setForm({...form, usuario: e.target.value})} required />
                                    )}
                                    <input type="password" title="password" className="w-full p-4 bg-slate-50 border rounded-2xl font-bold outline-none focus:ring-4 focus:ring-blue-100" placeholder="Clave inicial (min 5 car.)" value={form.password} onChange={e => setForm({...form, password: e.target.value})} required />
                                    {tab === 'agentes' && (
                                        <div className="space-y-2">
                                            <button type="button" onClick={() => setIsScanningAgent(true)} className={`w-full py-4 border-2 border-dashed rounded-2xl flex items-center justify-center gap-3 transition-all ${agentPhoto ? 'bg-emerald-50 text-emerald-600 border-emerald-500' : 'bg-slate-50 text-slate-400 border-slate-200'}`}>
                                                <Icon name="camera" /> {agentPhoto ? "FOTO ID GUARDADA" : "TOMAR FOTO INE AGENTE"}
                                            </button>
                                            {agentPhoto && <img src={agentPhoto} className="w-full h-24 object-cover rounded-xl border" />}
                                        </div>
                                    )}
                                    <div className="flex gap-4 pt-4">
                                        <button type="button" onClick={() => setView('list')} className="flex-1 py-4 bg-slate-100 text-slate-400 font-black uppercase rounded-2xl text-[10px]">Cancelar</button>
                                        <button type="submit" className="flex-1 py-4 bg-slate-900 text-white font-black uppercase rounded-2xl text-[10px] shadow-xl">Registrar</button>
                                    </div>
                                </form>
                                {isScanningAgent && <IDScanner title="Fotografía ID Agente" onCapture={(img) => { setAgentPhoto(img); setIsScanningAgent(false); }} onCancel={() => setIsScanningAgent(false)} />}
                            </div>
                        ) : (
                            <div className="overflow-x-auto rounded-3xl border border-slate-100 font-medium">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-50">
                                        {tab === 'bitacora' ? (
                                            <tr><th className="px-6 py-4 text-[10px] font-black uppercase text-slate-400">Fech/Hora de acceso</th><th>Visitante</th><th className="text-center px-6">INE</th></tr>
                                        ) : (
                                            <tr><th className="px-6 py-4 text-[10px] font-black uppercase text-slate-400">Nombre</th><th>Identificador</th>{isMaestro && <th className="text-right pr-6">Acción</th>}</tr>
                                        )}
                                    </thead>
                                    <tbody className="divide-y divide-slate-50">
                                        {tab === 'residentes' && habitantes.map(h => (
                                            <tr key={h.id} className="hover:bg-slate-50/50 transition-colors">
                                                <td className="px-6 py-4 font-bold text-slate-700">{h.nombre}</td>
                                                <td className="px-6 py-4 text-slate-500 uppercase font-black">{h.casa}</td>
                                                <td className="px-6 py-4 text-right pr-6">{isMaestro && <button onClick={() => deleteEntry('habitantes', h.id)} className="text-rose-400 font-black">×</button>}</td>
                                            </tr>
                                        ))}
                                        {tab === 'agentes' && agentes.map(a => (
                                            <tr key={a.id} className="hover:bg-slate-50/50 transition-colors">
                                                <td className="px-6 py-4 font-bold text-slate-700">
                                                    <div className="flex items-center gap-2">
                                                        {a.nombre} {a.fotoINE && <button onClick={() => setSelectedPhoto(a.fotoINE)} className="text-blue-500"><Icon name="image" className="w-3 h-3"/></button>}
                                                    </div>
                                                </td>
                                                <td className="px-6 py-4 text-slate-500">@{a.usuario}</td>
                                                <td className="px-6 py-4 text-right pr-6">{isMaestro && <button onClick={() => deleteEntry('agentes', a.id)} className="text-rose-400 font-black">×</button>}</td>
                                            </tr>
                                        ))}
                                        {tab === 'administradores' && admins.map(a => (
                                            <tr key={a.id} className="hover:bg-slate-50/50 transition-colors">
                                                <td className="px-6 py-4 font-bold text-slate-700">{a.nombre} {a.esMaestro && "⭐"}</td>
                                                <td className="px-6 py-4 text-slate-500">@{a.usuario}</td>
                                                <td className="px-6 py-4 text-right pr-6">{(!a.esMaestro || role === 'superuser') && <button onClick={() => deleteEntry('admins', a.id)} className="text-rose-400 font-black">×</button>}</td>
                                            </tr>
                                        ))}
                                        {tab === 'bitacora' && logs.sort((a,b)=>b.timestamp.localeCompare(a.timestamp)).map(l => (
                                            <tr key={l.id} className="hover:bg-slate-50 transition-colors">
                                                <td className="px-6 py-4 text-slate-400 tracking-tighter">{new Date(l.timestamp).toLocaleString()}</td>
                                                <td className="uppercase font-black text-slate-700">{l.visitante || l.habitanteNombre}<br/><span className="text-[9px] opacity-60 text-blue-600 font-black">{l.tipo}</span></td>
                                                <td className="text-center px-6">
                                                    {l.fotoINE ? <button onClick={() => setSelectedPhoto(l.fotoINE)} className="p-2 bg-slate-100 rounded-xl text-blue-600 hover:bg-blue-200 transition-all"><Icon name="image" className="w-4 h-4" /></button> : <span className="text-[8px] text-slate-300 font-black tracking-tighter">N/A</span>}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>

                    {selectedPhoto && (
                        <div className="fixed inset-0 bg-slate-900/95 z-[300] flex flex-col items-center justify-center p-6 backdrop-blur-md animate-fade-in no-print">
                            <div className="max-w-3xl w-full flex flex-col gap-4" id="print-area">
                                <div className="flex justify-between items-center bg-white/10 p-4 rounded-3xl no-print">
                                    <button onClick={() => setSelectedPhoto(null)} className="px-5 py-2 bg-white/20 hover:bg-white/30 text-white rounded-2xl font-black uppercase text-[10px] flex items-center gap-2 transition-all">
                                        <Icon name="arrow-left" className="w-4 h-4" /> Volver
                                    </button>
                                    <button onClick={() => window.print()} className="px-5 py-2 bg-blue-600 text-white rounded-2xl font-black uppercase text-[10px] flex items-center gap-2 shadow-xl shadow-blue-500/20">
                                        <Icon name="printer" className="w-4 h-4" /> Imprimir
                                    </button>
                                </div>
                                <div className="bg-white p-2 rounded-[2.5rem] shadow-2xl overflow-hidden border-4 border-white/20">
                                    <img src={selectedPhoto} className="w-full h-auto rounded-[2rem] block" alt="IFE" />
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- Vista: Registro Maestro ---
        function MaestroReg({ onComplete }) {
            const [m, setM] = useState({ n: '', u: '', p: '', c: '' });
            const [isSaving, setIsSaving] = useState(false);

            const handle = async (e) => {
                e.preventDefault();
                if (m.p !== m.c) return alert("Contraseñas no coinciden.");
                if (m.p.length < 5) return alert("La contraseña debe tener al menos 5 caracteres.");
                
                setIsSaving(true);
                try {
                    const userData = { 
                        nombre: toTitleCase(m.n), // Title Case
                        usuario: m.u.trim().toLowerCase(), 
                        password: m.p, 
                        esMaestro: true, 
                        mustChangeCode: false 
                    };
                    const res = await getColRef('admins').add(userData);
                    alert("Maestro activado."); 
                    onComplete({ id: res.id, ...userData });
                } catch (e) { alert("Error: " + e.message); }
                setIsSaving(false);
            };

            return (
                <div className="flex-1 flex items-center justify-center p-6 bg-slate-950 h-screen animate-fade-in relative overflow-hidden">
                    <div className="bg-white p-12 rounded-[4rem] shadow-2xl w-full max-w-md text-center border-t-8 border-blue-600 relative z-10">
                        <div className="w-20 h-20 bg-blue-600 text-white rounded-[2rem] flex items-center justify-center mx-auto mb-8 shadow-2xl"><Icon name="key" className="w-10 h-10" /></div>
                        <h2 className="text-3xl font-black uppercase text-slate-950 mb-2 tracking-tight">Activar Maestro</h2>
                        <form onSubmit={handle} className="space-y-4 text-left">
                            <input className="w-full p-4 bg-slate-50 border rounded-2xl font-bold outline-none" placeholder="Nombre completo" onChange={e => setM({...m, n: e.target.value})} required />
                            <input className="w-full p-4 bg-slate-50 border rounded-2xl font-bold outline-none" placeholder="ID de Usuario" onChange={e => setM({...m, u: e.target.value})} required />
                            <input type="password" title="p" className="w-full p-4 bg-slate-50 border rounded-2xl font-bold outline-none" placeholder="Clave maestra (min 5 car.)" onChange={e => setM({...m, p: e.target.value})} required />
                            <input type="password" title="c" className="w-full p-4 bg-slate-50 border rounded-2xl font-bold outline-none" placeholder="Confirmar" onChange={e => setM({...m, c: e.target.value})} required />
                            <button disabled={isSaving} className="w-full py-5 bg-blue-600 text-white rounded-[1.5rem] font-black uppercase shadow-2xl mt-4">Activar Acceso</button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- Módulos Finales ---
        function GuardiaFlow({ agente, habitantes }) {
            const [search, setSearch] = useState("");
            const [sel, setSel] = useState(null);
            const [vName, setVName] = useState("");
            const [photo, setPhoto] = useState(null);
            const [scanning, setScanning] = useState(false);

            const handleReg = async () => {
                try {
                    await getColRef('bitacora').add({
                        tipo: 'Visita', subtipo: 'Entrada', visitante: vName.toUpperCase(), habitanteNombre: sel.nombre, casa: sel.casa, timestamp: new Date().toISOString(), agente: agente.nombre, fotoINE: photo
                    });
                    alert("Acceso Registrado."); setSel(null); setVName(""); setPhoto(null);
                } catch(e) { alert("Fallo al registrar."); }
            };

            const filtered = search.length > 1 ? habitantes.filter(h => h.nombre.toLowerCase().includes(search.toLowerCase()) || h.casa.toLowerCase().includes(search.toLowerCase())) : [];

            return (
                <div className="space-y-6 max-w-5xl mx-auto py-2 animate-fade-in pb-20">
                    <div className="bg-white p-5 rounded-[2.5rem] shadow-xl border border-slate-100 flex items-center gap-5 focus-within:ring-8 focus:ring-blue-50 group">
                        <Icon name="search" className="text-slate-300 w-10 h-10 group-focus-within:text-blue-500 transition-colors" />
                        <input className="flex-1 outline-none text-xl font-black placeholder:text-slate-200 uppercase tracking-tighter" placeholder="Identificar habitante..." value={search} onChange={e => setSearch(e.target.value)} />
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {filtered.map(h => (
                            <div key={h.id} className={`bg-white rounded-[2.5rem] shadow-xl border-t-[12px] flex flex-col animate-fade-in ${h.disponibleVisitas ? 'border-emerald-500' : 'border-rose-600'}`}>
                                <div className="p-6 space-y-5">
                                    <h4 className="font-black text-slate-900 uppercase text-lg truncate leading-tight font-black">{h.nombre}</h4>
                                    <div className={`py-4 rounded-2xl text-center border-2 ${h.disponibleVisitas ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-rose-50 border-rose-200 text-rose-700'}`}>
                                        <span className="text-lg font-black uppercase tracking-tighter block">{h.disponibleVisitas ? 'ACCESO PERMITIDO' : 'ACCESO BLOQUEADO'}</span>
                                    </div>
                                    <button disabled={!h.disponibleVisitas} onClick={() => setSel(h)} className={`w-full py-4 rounded-2xl font-black text-xs uppercase shadow-lg transition-all active:scale-95 ${h.disponibleVisitas ? 'bg-blue-600 text-white shadow-blue-200 hover:bg-blue-700' : 'bg-slate-100 text-slate-300 cursor-not-allowed'}`}>Registrar Visita</button>
                                </div>
                            </div>
                        ))}
                    </div>
                    {sel && (
                        <div className="fixed inset-0 bg-slate-950/90 z-[200] flex items-center justify-center p-6 backdrop-blur-md overflow-y-auto">
                            <div className="bg-white p-10 rounded-[3.5rem] w-full max-w-md space-y-8 animate-fade-in relative text-center shadow-2xl border border-slate-100 overflow-hidden">
                                <h3 className="text-xl font-black uppercase text-slate-900 leading-none">Nueva Visita</h3>
                                <div className="p-8 bg-slate-50 rounded-[3rem] border border-slate-100">
                                    <p className="text-xl font-black text-slate-800 uppercase leading-none">{sel.nombre}</p>
                                    <p className="text-blue-600 font-black text-[11px] uppercase tracking-widest mt-1">LOTE {sel.casa}</p>
                                </div>
                                <div className="space-y-6 text-left">
                                    <input autoFocus className="w-full p-5 bg-slate-50 rounded-3xl border-2 border-slate-100 font-bold outline-none focus:border-blue-500 uppercase" placeholder="Nombre visitante" value={vName} onChange={e => setVName(e.target.value)} />
                                    <button onClick={() => setScanning(true)} className={`w-full py-5 rounded-[1.5rem] border-2 border-dashed flex items-center justify-center gap-3 transition-all ${photo ? 'bg-emerald-50 border-emerald-500 text-emerald-600' : 'bg-slate-50 border-slate-200 text-slate-400'}`}>
                                        <Icon name="camera" /> {photo ? "IFE CAPTURADA" : "ESCANEAR INE VISITA"}
                                    </button>
                                    {photo && <img src={photo} className="w-full h-32 object-cover rounded-2xl border shadow-inner" alt="Previo" />}
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={() => {setSel(null); setPhoto(null);}} className="flex-1 py-5 bg-slate-50 text-slate-400 rounded-[1.5rem] font-black uppercase text-xs">Cerrar</button>
                                    <button disabled={!vName.trim()} onClick={handleReg} className="flex-1 py-5 bg-slate-950 text-white rounded-[1.5rem] font-black uppercase text-xs shadow-2xl active:scale-95 disabled:opacity-20">Autorizar</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {scanning && <IDScanner onCapture={(img) => { setPhoto(img); setScanning(false); }} onCancel={() => setScanning(false)} />}
                </div>
            );
        }

        function HabitanteModule({ habitante }) {
            const [updating, setUpdating] = useState(false);
            const currentClave = getClaveResidente(habitante.nombre, habitante.casa);
            const toggle = async () => {
                setUpdating(true);
                await getColRef('habitantes').doc(habitante.id).update({ disponibleVisitas: !habitante.disponibleVisitas });
                setUpdating(false);
            };
            return (
                <div className="max-w-md mx-auto py-4 space-y-6 animate-fade-in">
                    <div className="bg-white p-10 rounded-[4rem] shadow-2xl border border-slate-100 text-center relative overflow-hidden text-slate-900">
                        <div className="absolute top-0 left-0 w-full h-3 bg-blue-600"></div>
                        <h2 className="text-2xl font-black uppercase mb-8 mt-2 tracking-tighter">Pase Residencial</h2>
                        <img src={getQRCodeURL(currentClave)} className="w-56 h-56 mx-auto mb-6 shadow-sm" alt="QR" />
                        <div className="bg-slate-50 p-6 rounded-3xl border border-slate-100 w-full">
                            <span className="text-[10px] font-black uppercase text-slate-400 block mb-1">Identificador Único</span>
                            <p className="font-black text-blue-600 text-2xl tracking-[0.2em] uppercase">{currentClave}</p>
                        </div>
                    </div>
                    <button disabled={updating} onClick={toggle} className={`w-full py-8 rounded-[2.5rem] font-black uppercase text-sm tracking-widest shadow-2xl transition-all active:scale-95 border-b-8 ${habitante.disponibleVisitas ? 'bg-emerald-500 border-emerald-700 text-white shadow-emerald-200' : 'bg-rose-50 border-rose-700 text-white shadow-rose-200'}`}>
                        {updating ? <Icon name="loader" className="animate-spin mx-auto w-6 h-6" /> : (habitante.disponibleVisitas ? 'Pase Activado' : 'Pase Bloqueado')}
                    </button>
                </div>
            );
        }

        // --- App Principal ---
        function App() {
            const [showSplash, setShowSplash] = useState(true);
            const [user, setUser] = useState(null);
            const [role, setRole] = useState(null); 
            const [activeUser, setActiveUser] = useState(null);
            const [habitantes, setHabitantes] = useState([]);
            const [agentes, setAgentes] = useState([]);
            const [admins, setAdmins] = useState([]);
            const [logs, setLogs] = useState([]);
            const [loading, setLoading] = useState(true);
            const [dataReady, setDataReady] = useState(false);
            const [authStep, setAuthStep] = useState('login');

            const forceReset = () => { setRole(null); setActiveUser(null); setAuthStep('login'); };

            useEffect(() => {
                const timer = setTimeout(() => setShowSplash(false), 3000);
                const init = async () => {
                    try {
                        await auth.signInAnonymously();
                        auth.onAuthStateChanged((u) => { if (u) { setUser(u); } });
                    } catch (e) { console.error(e); }
                };
                init();
                return () => clearTimeout(timer);
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsub1 = getColRef('habitantes').onSnapshot(s => setHabitantes(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsub2 = getColRef('agentes').onSnapshot(s => setAgentes(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsub3 = getColRef('bitacora').onSnapshot(s => setLogs(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsub4 = getColRef('admins').onSnapshot(s => {
                    setAdmins(s.docs.map(d => ({ id: d.id, ...d.data() })));
                    setDataReady(true);
                    setLoading(false);
                });
                return () => { unsub1(); unsub2(); unsub3(); unsub4(); };
            }, [user]);

            const handleLogin = (u, p) => {
                if (!dataReady) return alert("Cargando...");
                const searchId = u.trim().toLowerCase();
                const maestroExists = admins.some(a => a.esMaestro);

                // 1. Superuser
                if (searchId === 'superuser' && p === 'tlahuiscalpantecutli') {
                    setActiveUser({ nombre: 'Súper Usuario', usuario: 'superuser', id: 'superuser' });
                    setRole('superuser'); setAuthStep('dashboard'); return;
                }

                // 2. Acceso Inicial
                if (!maestroExists && searchId === 'admin' && p === '123') {
                    setActiveUser({ nombre: 'Activación Maestro', usuario: 'admin', mustInit: true });
                    setRole('admin'); setAuthStep('dashboard'); return;
                }

                // 3. Admin / Agente / Habitante
                const adminFound = admins.find(a => (a.usuario?.toLowerCase() === searchId || a.id === u) && a.password === p);
                if (adminFound) { setActiveUser(adminFound); setRole('admin'); setAuthStep('dashboard'); return; }

                const agentFound = agentes.find(a => (a.usuario?.toLowerCase() === searchId || a.id === u) && a.password === p);
                if (agentFound) { setActiveUser(agentFound); setRole('guardia'); setAuthStep('dashboard'); return; }

                const habFound = habitantes.find(h => h.id === u && h.password === p);
                if (habFound) { setActiveUser(habFound); setRole('habitante'); setAuthStep('dashboard'); return; }

                alert("Credenciales no encontradas.");
            };

            if (showSplash) return (
                <div className="fixed inset-0 z-[1000] bg-slate-950 flex flex-col items-center justify-center text-white animate-splash-out">
                    <div className="p-8 bg-blue-600 rounded-[3rem] shadow-[0_0_100px_rgba(37,99,235,0.4)] animate-bounce mb-8">
                        <Icon name="shield" className="w-24 h-24" />
                    </div>
                    <h1 className="text-5xl md:text-7xl font-black uppercase tracking-tighter text-center leading-none">VIYAUTEPEC<br/><span className="text-blue-500 text-3xl">2a. Sección</span></h1>
                </div>
            );

            if (loading) return null;

            if (authStep === 'login' && !activeUser) {
                const maestroExists = admins.some(a => a.esMaestro);
                return (
                    <div className="flex-1 flex items-center justify-center p-6 bg-slate-50 h-screen">
                        <div className="bg-white p-10 rounded-[3.5rem] shadow-2xl w-full max-w-sm border border-slate-100 text-center animate-fade-in relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-2 bg-slate-900"></div>
                            <div className="flex justify-center mb-6">
                                <div className="p-4 bg-slate-900 text-white rounded-2xl shadow-xl"><Icon name="lock" className="w-8 h-8" /></div>
                            </div>
                            <h2 className="text-3xl font-black uppercase mb-1 tracking-tighter text-slate-900">Bienvenido</h2>
                            <p className="text-[10px] text-slate-400 font-bold uppercase mb-8 tracking-widest leading-none">Control de Seguridad - Viyautepec</p>
                            {!maestroExists && (
                                <div className="mb-6 px-4 py-2 bg-blue-50 text-blue-600 rounded-xl text-[9px] font-bold uppercase border border-blue-100 animate-pulse">Acceso Inicial: admin / 123</div>
                            )}
                            <form onSubmit={e => { e.preventDefault(); handleLogin(e.target.u.value, e.target.p.value); }} className="space-y-4 text-left">
                                <input name="u" className="w-full p-4 bg-slate-50 rounded-2xl border font-bold text-xs outline-none focus:ring-4 focus:ring-blue-100" placeholder="ID de Usuario" required />
                                <input name="p" type="password" placeholder="Contraseña" className="w-full p-4 bg-slate-50 rounded-2xl border font-bold text-xs outline-none focus:ring-4 focus:ring-blue-100" required />
                                <button className="w-full py-4 bg-slate-900 text-white rounded-2xl font-black uppercase shadow-xl hover:bg-black transition-all text-[11px] tracking-widest tracking-tight">Acceder al Sistema</button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (activeUser?.mustInit) return <MaestroReg onComplete={(data) => { setActiveUser(data); setRole('admin'); setAuthStep('dashboard'); }} />;

            return (
                <div className="h-full flex flex-col overflow-hidden bg-slate-50 animate-fade-in">
                    <header className="bg-slate-900 text-white h-16 flex items-center justify-between px-6 shadow-2xl shrink-0 z-[100] border-b border-slate-800 no-print">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2 rounded-xl shadow-lg border border-blue-400/20"><Icon name="shield" className="w-4 h-4 text-white"/></div>
                            <div className="flex flex-col leading-none">
                                <span className="font-black text-sm uppercase tracking-tight">VIYAUTEPEC</span>
                                <span className="text-[8px] font-bold text-blue-400 uppercase tracking-widest">2a. Sección</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="flex flex-col items-end text-right">
                                <span className="text-[10px] font-black uppercase text-white leading-none mb-1 truncate max-w-[150px]">{activeUser?.nombre}</span>
                                <span className="text-[8px] font-black text-blue-400 uppercase tracking-widest leading-none">
                                    {role === 'admin' ? (activeUser?.esMaestro ? 'Maestro' : 'Administrador') : role === 'guardia' ? 'Seguridad' : role === 'superuser' ? 'Root' : 'Residente'}
                                </span>
                            </div>
                            <button onClick={() => {setRole(null); setActiveUser(null); setAuthStep('login');}} className="px-3 py-1.5 bg-slate-800 hover:bg-rose-600 text-white rounded-lg font-bold text-[9px] uppercase transition-all shadow-lg border border-slate-700">Salir</button>
                        </div>
                    </header>
                    <div className="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar bg-slate-50">
                        <div className="max-w-7xl mx-auto w-full h-full no-print">
                            {(role === 'admin' || role === 'superuser') && <AdminView habitantes={habitantes} agentes={agentes} logs={logs} admins={admins} role={role} activeUser={activeUser} onResetSuccess={forceReset} />}
                            {role === 'habitante' && <HabitanteModule habitante={habitantes.find(h => h.id === activeUser.id) || activeUser} />}
                            {role === 'guardia' && <GuardiaFlow agente={activeUser} habitantes={habitantes} />}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
