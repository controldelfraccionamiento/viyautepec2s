<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Viyautepec 2a Sección - Ver. 7.1</title>
    <!-- Bibliotecas Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body, html { 
            margin: 0; padding: 0; height: 100vh; width: 100vw; 
            font-family: 'Inter', sans-serif; background-color: #f8fafc; 
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        #root { height: 100%; display: flex; flex-direction: column; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-splash-out { animation: splashOut 0.5s ease-in forwards; animation-delay: 2.7s; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes splashOut { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
            transform: translate3d(0, 0, 0);
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .camera-flash {
            position: fixed; inset: 0; background: white; z-index: 1000;
            pointer-events: none; opacity: 0;
        }
        .camera-flash.active { animation: flash-anim 0.4s ease-out; }
        @keyframes flash-anim { 0% { opacity: 1; } 100% { opacity: 0; } }
        
        .scanner-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            z-index: 10; pointer-events: none;
        }
        .scanner-guide {
            width: 85vw; height: 53.8vw;
            max-width: 440px; max-height: 278px;
            position: relative; border-radius: 15px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.75);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .scanner-corner { position: absolute; width: 25px; height: 25px; border: 4px solid #3b82f6; }
        .c-tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
        .c-tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; border-radius: 0 12px 0 0; }
        .c-bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; border-radius: 0 0 0 12px; }
        .c-br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }

        .diagonal-strike {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            white-space: nowrap;
            z-index: 40;
            pointer-events: none;
            padding: 1px 3px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            font-size: 7px;
            font-weight: 900;
            border-radius: 2px;
            text-transform: uppercase;
        }

        .responsive-title {
            font-size: clamp(1.5rem, 8vw, 4.5rem);
            line-height: 1.1;
            font-weight: 900;
        }

        /* Input fix for iOS zoom */
        input, select, textarea { font-size: 16px !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, Fragment, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyCu2kV9s9ZCmQCFElHZaf7vXPUKStVAh9o",
            authDomain: "viyautepec2seccion.firebaseapp.com",
            projectId: "viyautepec2seccion",
            storageBucket: "viyautepec2seccion.firebasestorage.app",
            messagingSenderId: "1008154187449",
            appId: "1:1008154187449:web:669811e04babbbfb986d68",
            measurementId: "G-D828S2ZK3H"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = "viyautepec2seccion";
        const VERSION = "Ver. 7.1";
        const TITULO_SISTEMA = "Viyautepec 2a Sección";

        const CATEGORIAS_ACCESO = [
            { id: 'visita', label: 'Visita', icon: 'user', color: 'emerald' },
            { id: 'delivery', label: 'Delivery', icon: 'motorcycle', color: 'orange' },
            { id: 'paquetería', label: 'Paquetería', icon: 'package', color: 'blue' },
            { id: 'empleado', label: 'Empleado', icon: 'worker-helmet', color: 'amber' },
            { id: 'construccion', label: 'Mat. Construcción', icon: 'truck', color: 'slate' }
        ];

        // --- Utilidades ---
        const getColRef = (name) => db.collection('artifacts').doc(appId).collection('public').doc('data').collection(name);
        const toTitleCase = (str) => str ? str.toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ') : "";
        const getClaveResidente = (n, c) => {
            if (!n || !c) return "RES-XXXX00";
            const p = n.trim().split(/\s+/);
            const nP = (p[0]||"XX").slice(0,2).toUpperCase();
            const sP = (p[1]||p[0].slice(2,4)||"XX").slice(0,2).toUpperCase();
            const hP = (c.trim().split(/\s+/)[0]||"XX").slice(0,2).toUpperCase();
            const match = c.match(/\d+/);
            const num = match ? match[0].padStart(2,'0').slice(-2) : "00";
            return `RES-${nP}${sP}${hP}${num}`;
        };
        const getQRCodeURL = (data) => `https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=${encodeURIComponent(data)}`;

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,
                user: <Fragment><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Fragment>,
                camera: <Fragment><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></Fragment>,
                printer: <Fragment><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></Fragment>,
                "arrow-left": <path d="M19 12H5m7-7-7 7 7 7" stroke="currentColor" strokeWidth="2" fill="none" />,
                trash: <Fragment><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Fragment>,
                edit: <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>,
                search: <Fragment><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Fragment>,
                "plus-circle": <Fragment><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></Fragment>,
                x: <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" strokeWidth="2" />,
                "x-circle": <Fragment><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></Fragment>,
                key: <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>,
                package: <Fragment><path d="M16.5 9.4L7.5 4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></Fragment>,
                motorcycle: <path d="M5 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm14 0a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM6 18h12m-9 0 1-4h5l1 4m-7-4h6l-1-4h-4zM16 10l-1.5-3h-5L8 10"/>,
                "worker-helmet": <path d="M12 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zM6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M8 5a5 5 0 0 1 8 0M12 2v3"/>,
                truck: <path d="M1 3h15v13H1V3zm15 5h4l3 3v5h-7V8zM5.5 18.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zm13 0a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>,
                image: <Fragment><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></Fragment>,
                "log-out": <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5m5 5H9"/>,
                lock: <Fragment><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Fragment>,
                eye: <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>,
                "eye-off": <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"/>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        function PasswordInput({ name, placeholder, value, onChange }) {
            const [show, setShow] = useState(false);
            return (
                <div className="relative font-black">
                    <input name={name} type={show ? "text" : "password"} placeholder={placeholder} value={value} onChange={onChange} className="w-full p-4 pr-12 bg-slate-50 border rounded-2xl font-bold outline-none focus:ring-4 focus:ring-blue-100 shadow-sm" required />
                    <button type="button" onClick={() => setShow(!show)} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-500 transition-colors font-black">
                        <Icon name={show ? "eye-off" : "eye"} className="w-5 h-5 font-black" />
                    </button>
                </div>
            );
        }

        // --- Escáner e Inteligencia Artificial (OCR) ---
        function IDScannerWidget({ onCapture, onCancel }) {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const guideRef = useRef(null);
            const [isFlashing, setIsFlashing] = useState(false);
            const [processing, setProcessing] = useState(false);

            useEffect(() => {
                const constraints = { video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } };
                navigator.mediaDevices.getUserMedia(constraints)
                .then(s => { if(videoRef.current) videoRef.current.srcObject = s; })
                .catch(() => { alert("Error cámara"); onCancel(); });
                return () => { if (videoRef.current?.srcObject) videoRef.current.srcObject.getTracks().forEach(t => t.stop()); };
            }, []);

            const extractNameFromText = (text) => {
                const lines = text.split('\n').map(l => l.trim().toUpperCase()).filter(l => l.length > 3);
                const nameIndex = lines.findIndex(l => l.includes('NOMBRE') || l.includes('APELLIDO'));
                if (nameIndex !== -1 && lines[nameIndex + 1]) return lines[nameIndex + 1];
                return "";
            };

            const capture = async () => {
                if (!videoRef.current || !guideRef.current || processing) return;
                const v = videoRef.current; const g = guideRef.current; const c = canvasRef.current; const ctx = c.getContext('2d');
                setIsFlashing(true); setProcessing(true);
                setTimeout(() => setIsFlashing(false), 400);

                const scale = v.videoWidth / v.clientWidth;
                const rG = g.getBoundingClientRect();
                const rV = v.getBoundingClientRect();
                const sx = (rG.left - rV.left) * scale;
                const sy = (rG.top - rV.top) * scale;
                const sw = rG.width * scale;
                const sh = rG.height * scale;
                
                c.width = 1600; c.height = 1012;
                ctx.drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
                const imageData = c.toDataURL('image/jpeg', 0.9);

                try {
                    const result = await Tesseract.recognize(imageData, 'spa');
                    const extractedName = extractNameFromText(result.data.text);
                    onCapture(imageData, extractedName);
                } catch (e) {
                    onCapture(imageData, "");
                }
            };

            return (
                <div className="fixed inset-0 bg-black z-[500] flex flex-col items-center justify-center overflow-hidden">
                    <div className={`camera-flash ${isFlashing ? 'active' : ''}`} />
                    <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover" />
                    <div className="scanner-container">
                        <div ref={guideRef} className="scanner-guide">
                            <div className="scanner-corner c-tl"></div><div className="scanner-corner c-tr"></div>
                            <div className="scanner-corner c-bl"></div><div className="scanner-corner c-br"></div>
                        </div>
                    </div>
                    <div className="absolute top-12 w-full text-center px-4">
                        <p className="text-white text-[10px] font-black uppercase tracking-widest bg-black/60 py-3 rounded-full px-8 inline-block">
                            {processing ? "PROCESANDO IDENTIDAD..." : "ENFOQUE EL FRENTE DEL INE"}
                        </p>
                    </div>
                    <div className="absolute bottom-12 flex justify-center gap-12 items-center z-20 w-full">
                        <button onClick={onCancel} className="p-5 bg-white/10 text-white rounded-full"><Icon name="x" className="w-8 h-8" /></button>
                        <button onClick={capture} disabled={processing} className={`w-24 h-24 bg-white/10 rounded-full border-[10px] border-white/20 flex items-center justify-center ${processing ? 'opacity-50' : 'active:scale-90'}`}><div className="w-14 h-14 bg-white rounded-full"></div></button>
                        <div className="w-16"></div>
                    </div>
                    <canvas ref={canvasRef} className="hidden" />
                </div>
            );
        }

        function AdminView({ habitantes, agentes, logs, admins, role, activeUser, onResetSuccess }) {
            const [tab, setTab] = useState('residentes');
            const [view, setView] = useState('list');
            const [isActionLoading, setIsActionLoading] = useState(false);
            const [form, setForm] = useState({ nombre: '', casa: '', password: '' });
            const [passRecovery, setPassRecovery] = useState(null); 
            const [selectedPhoto, setSelectedPhoto] = useState(null);
            const [passError, setPassError] = useState("");

            const isMaestro = activeUser?.esMaestro || role === 'superuser';

            const filteredAdmins = admins.filter(a => {
                if (role === 'superuser') return a.usuario !== 'superuser'; 
                if (activeUser?.esMaestro) return !a.esMaestro && a.usuario !== 'superuser'; 
                return false;
            });

            const displayLogs = (() => {
                if (role === 'superuser') return logs;
                return logs.filter(l => l.autorRole !== 'SUPERUSER');
            })();

            useEffect(() => { setView('list'); setPassError(""); }, [tab]);

            const logAction = async (tipo, detalles) => {
                await getColRef('bitacora').add({ 
                    tipo, detalles, 
                    autor: activeUser.nombre, 
                    autorRole: role === 'superuser' ? 'SUPERUSER' : (activeUser.esMaestro ? 'MAESTRO' : 'AUXILIAR'),
                    timestamp: new Date().toISOString() 
                });
            };

            const resetSystem = async () => {
                if (!confirm("¡ADVERTENCIA! Esta acción borrará TODO. ¿Desea continuar?")) return;
                setIsActionLoading(true);
                try {
                    const collections = ['habitantes', 'agentes', 'bitacora', 'admins'];
                    for (const col of collections) {
                        const snap = await getColRef(col).get();
                        const batch = db.batch();
                        snap.forEach(doc => batch.delete(doc.ref));
                        await batch.commit();
                    }
                    onResetSuccess();
                } catch (e) { alert("Error al reiniciar."); }
                setIsActionLoading(false);
            };

            const deleteEntry = async (colName, id, nombre) => {
                if(!confirm(`¿Eliminar a ${nombre}?`)) return;
                try { await getColRef(colName).doc(id).delete(); await logAction('Sistema', `Borrado: ${nombre} (${colName})`); } catch (e) {}
            };

            const handlePassRecovery = async (e) => {
                e.preventDefault(); 
                const newPass = e.target.newpass.value;
                if(newPass.length < 5) { setPassError("Mínimo 5 caracteres."); return; }
                setPassError(""); setIsActionLoading(true);
                try {
                    await getColRef(passRecovery.col).doc(passRecovery.id).update({ password: newPass, mustChangeCode: true });
                    await logAction('Sistema', `Reset Clave: ${passRecovery.nombre}`);
                    setPassRecovery(null);
                } catch (e) {}
                setIsActionLoading(false);
            };

            const handleSave = async (e) => {
                e.preventDefault(); 
                if (form.password.length < 5) { setPassError("Mínimo 5 caracteres."); return; }
                setPassError(""); setIsActionLoading(true);
                const col = tab === 'residentes' ? 'habitantes' : (tab === 'guardias' ? 'agentes' : 'admins');
                try {
                    const finalName = toTitleCase(form.nombre);
                    const data = { nombre: finalName, password: form.password, mustChangeCode: true, esMaestro: false };
                    if (tab === 'residentes') { data.casa = form.casa; CATEGORIAS_ACCESO.forEach(cat => data[`permiso_${cat.id}`] = true); }
                    await getColRef(col).add(data);
                    await logAction('Sistema', `Nuevo ${tab}: ${finalName}`);
                    setForm({ nombre: '', casa: '', password: '' });
                    setView('list');
                } catch (err) { alert("Error."); }
                setIsActionLoading(false);
            };

            return (
                <div className="space-y-4 animate-fade-in pb-24 h-full font-black">
                    <div className="flex gap-2 bg-white p-2 rounded-2xl shadow-sm border border-slate-200 w-fit overflow-x-auto max-w-full">
                        {['residentes', 'guardias', 'bitacora', (isMaestro && 'administradores')].filter(Boolean).map(t => (
                            <button key={t} onClick={() => setTab(t)} className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all whitespace-nowrap ${tab === t ? 'bg-slate-900 text-white shadow-lg' : 'text-slate-400'}`}>{t}</button>
                        ))}
                    </div>

                    <div className="bg-white p-6 rounded-[2.5rem] shadow-xl border border-slate-100 min-h-[500px]">
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="text-xl font-black uppercase text-slate-800 tracking-tight leading-none">{tab}</h2>
                            <div className="flex gap-3">
                                {role === 'superuser' && tab === 'bitacora' && <button onClick={resetSystem} className="bg-rose-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase">REINICIAR SISTEMA</button>}
                                {view === 'list' && tab !== 'bitacora' && <button onClick={() => setView('add')} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white text-[10px] font-black uppercase rounded-xl shadow-lg"><Icon name="plus-circle" /> Nuevo</button>}
                            </div>
                        </div>

                        {view === 'list' ? (
                            <div className="overflow-x-auto rounded-3xl border border-slate-100 font-black">
                                <table className="w-full text-left text-sm font-black">
                                    <thead className="bg-slate-50 font-black uppercase text-[10px] text-slate-400 border-b">
                                        <tr><th className="px-6 py-4">Sujeto</th><th className="px-6">Info</th><th className="text-right pr-10">Acción</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-50">
                                        {(tab==='bitacora' ? displayLogs : tab==='residentes' ? habitantes : tab==='guardias' ? agentes : filteredAdmins).sort((a,b)=> (b.timestamp || "").localeCompare(a.timestamp || "")).map(x => (
                                            <tr key={x.id} className={`hover:bg-slate-50/50 transition-colors ${x.tipo === 'Acceso Denegado' ? 'bg-rose-50/30' : ''}`}>
                                                <td className="px-6 py-4 font-black">
                                                    <div className="flex items-center gap-2">
                                                        {x.tipo === 'Acceso Denegado' && <span className="text-rose-600"><Icon name="x-circle" className="w-4 h-4" /></span>}
                                                        {x.visitante || x.nombre || x.habitanteNombre}
                                                    </div>
                                                </td>
                                                <td className="px-6 py-4 text-slate-500 uppercase text-xs font-black">
                                                    {x.casa || (x.esMaestro ? 'MAESTRO' : x.tipo || 'AUXILIAR')}
                                                </td>
                                                <td className="px-6 py-4 text-right pr-10 flex justify-end gap-1">
                                                    {x.fotoINE && <button onClick={() => setSelectedPhoto(x.fotoINE)} className="p-2 text-blue-600"><Icon name="image" className="w-4 h-4"/></button>}
                                                    {tab !== 'bitacora' && <Fragment>
                                                        <button onClick={() => setPassRecovery({ col: tab === 'residentes' ? 'habitantes' : (tab === 'guardias' ? 'agentes' : 'admins'), id: x.id, nombre: x.nombre })} className="p-2 text-blue-500"><Icon name="key" className="w-4 h-4"/></button>
                                                        <button onClick={() => deleteEntry(tab === 'residentes' ? 'habitantes' : (tab === 'guardias' ? 'agentes' : 'admins'), x.id, x.nombre || x.visitante)} className="p-2 text-rose-500"><Icon name="trash" className="w-4 h-4"/></button>
                                                    </Fragment>}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        ) : (
                            <form onSubmit={handleSave} className="max-w-md mx-auto space-y-4">
                                <input className="w-full p-5 bg-slate-50 border rounded-2xl outline-none" placeholder="Nombre completo" value={form.nombre} onChange={e => setForm({...form, nombre: e.target.value})} required />
                                {tab === 'residentes' && <input className="w-full p-5 bg-slate-50 border rounded-2xl outline-none" placeholder="Lote / Casa" value={form.casa} onChange={e => setForm({...form, casa: e.target.value})} required />}
                                <PasswordInput name="password" placeholder="Contraseña (min 5)" value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
                                {passError && <p className="text-rose-600 text-xs font-black">{passError}</p>}
                                <button type="submit" className="w-full py-5 bg-slate-900 text-white rounded-2xl font-black uppercase shadow-xl mt-4">Guardar Registro</button>
                                <button type="button" onClick={() => setView('list')} className="w-full text-center text-slate-400 text-xs uppercase font-black">Cancelar</button>
                            </form>
                        )}
                    </div>
                    {passRecovery && (
                        <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-md z-[600] flex items-center justify-center p-6 animate-fade-in font-black">
                            <div className="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-sm text-center border-t-8 border-blue-600">
                                <h3 className="text-xl font-black uppercase text-slate-900 mb-4 font-black">Nueva Clave</h3>
                                <form onSubmit={handlePassRecovery} className="space-y-4">
                                    <PasswordInput name="newpass" placeholder="Mínimo 5 caracteres" />
                                    {passError && <p className="text-rose-600 text-xs font-black">{passError}</p>}
                                    <div className="flex gap-3"><button type="button" onClick={() => setPassRecovery(null)} className="flex-1 py-4 bg-slate-100 rounded-xl uppercase text-[10px]">Cerrar</button><button type="submit" className="flex-1 py-4 bg-blue-600 text-white rounded-xl uppercase text-[10px] shadow-lg font-black font-black">Actualizar</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                    {selectedPhoto && (
                        <div className="fixed inset-0 bg-slate-900/95 z-[300] flex flex-col items-center justify-center p-6 backdrop-blur-md animate-fade-in no-print font-black">
                            <div className="max-w-3xl w-full flex flex-col gap-4">
                                <div className="flex justify-between items-center bg-white/10 p-4 rounded-3xl no-print">
                                    <button onClick={() => setSelectedPhoto(null)} className="px-6 py-3 bg-white/20 text-white rounded-2xl text-[10px] uppercase font-black flex items-center gap-2"><Icon name="arrow-left" /> Volver</button>
                                    <button onClick={() => window.print()} className="px-6 py-3 bg-blue-600 text-white rounded-2xl text-[10px] uppercase font-black flex items-center gap-2 shadow-xl font-black font-black"><Icon name="printer" /> Imprimir</button>
                                    <button onClick={() => setSelectedPhoto(null)} className="text-white/50"><Icon name="x" className="w-7 h-7"/></button>
                                </div>
                                <div className="bg-white p-2 rounded-[2.5rem] shadow-2xl overflow-hidden font-black" id="print-area font-black font-black font-black"><img src={selectedPhoto} className="w-full h-auto rounded-[2rem] block" alt="ID" /></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function HabitanteModule({ habitante }) {
            const [updating, setUpdating] = useState(false);
            const currentClave = getClaveResidente(habitante.nombre, habitante.casa);
            const togglePermission = async (catId) => {
                setUpdating(true); const field = `permiso_${catId}`;
                await getColRef('habitantes').doc(habitante.id).update({ [field]: !habitante[field] });
                setUpdating(false);
            };
            const isAllowed = (catId) => habitante[`permiso_${catId}`] !== false;
            return (
                <div className="max-w-md mx-auto py-4 space-y-6 animate-fade-in font-black">
                    <div className="bg-white p-8 rounded-[3.5rem] shadow-2xl border border-slate-100 text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-3 bg-blue-600 font-black"></div>
                        <h2 className="text-2xl font-black uppercase mb-6 mt-2 tracking-tighter text-slate-900 leading-none">Pase Residencial</h2>
                        <img src={getQRCodeURL(currentClave)} className="w-48 h-48 mx-auto mb-6 shadow-sm rounded-2xl border-8 border-slate-50" alt="QR" />
                        <div className="bg-slate-50 p-5 rounded-3xl border border-slate-100 w-full shadow-inner font-black">
                            <span className="text-[9px] font-black uppercase text-slate-400 block mb-1 tracking-widest leading-none font-black">ID Único de Domicilio</span>
                            <p className="font-black text-blue-600 text-xl tracking-[0.2em] uppercase leading-none">{currentClave}</p>
                        </div>
                    </div>
                    <div className="bg-white p-8 rounded-[3.5rem] shadow-2xl border border-slate-100 space-y-4">
                        <h3 className="text-sm font-black uppercase text-slate-400 tracking-widest ml-4 mb-2">Permisos de Acceso</h3>
                        <div className="grid grid-cols-1 gap-3 font-black">
                            {CATEGORIAS_ACCESO.map(cat => (
                                <button key={cat.id} onClick={() => togglePermission(cat.id)} disabled={updating} className={`flex items-center justify-between p-5 rounded-2xl border-2 transition-all active:scale-95 ${isAllowed(cat.id) ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-rose-50 border-rose-200 text-rose-700 opacity-60'}`}>
                                    <div className="flex items-center gap-4">
                                        <div className={`p-2 rounded-xl ${isAllowed(cat.id) ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}`}><Icon name={cat.icon} className="w-5 h-5 font-black" /></div>
                                        <div className="flex flex-col items-start leading-none font-black font-black">
                                            <span className="text-xs font-black uppercase tracking-tight font-black">{cat.label}</span>
                                            <span className="text-[9px] font-bold opacity-60 mt-1 uppercase font-black">{isAllowed(cat.id) ? 'Autorizado' : 'Bloqueado'}</span>
                                        </div>
                                    </div>
                                    <div className={`w-10 h-6 rounded-full relative transition-colors ${isAllowed(cat.id) ? 'bg-emerald-500' : 'bg-rose-500'}`}><div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-all ${isAllowed(cat.id) ? 'right-1' : 'left-1'}`}></div></div>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function GuardiaFlow({ agente, habitantes }) {
            const [search, setSearch] = useState("");
            const [sel, setSel] = useState(null);
            const [step, setStep] = useState(1); 
            const [catId, setCatId] = useState("");
            const [vName, setVName] = useState("");
            const [photo, setPhoto] = useState(null);
            const [scanning, setScanning] = useState(false);
            const inputRef = useRef(null);

            useEffect(() => { if (sel && step === 3) { window.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(() => inputRef.current?.focus(), 500); } }, [step]);

            const handleReg = async (isAuthorized = true) => {
                try {
                    await getColRef('bitacora').add({
                        tipo: isAuthorized ? 'Visita' : 'Acceso Denegado', 
                        subtipo: CATEGORIAS_ACCESO.find(c => c.id === catId)?.label.toUpperCase(), 
                        visitante: vName.toUpperCase() || 'DESCONOCIDO', 
                        habitanteNombre: sel.nombre, casa: sel.casa, timestamp: new Date().toISOString(), 
                        autor: agente.nombre, autorRole: 'GUARDIA', fotoINE: photo || ''
                    });
                    setSel(null); setStep(1); setVName(""); setPhoto(null); setSearch("");
                } catch(e) { alert("Error."); }
            };

            const filtered = search.length > 1 ? habitantes.filter(h => h.nombre.toLowerCase().includes(search.toLowerCase()) || h.casa.toLowerCase().includes(search.toLowerCase())) : [];

            return (
                <div className="space-y-6 max-w-5xl mx-auto py-2 animate-fade-in pb-20 font-black">
                    <div className="bg-white p-5 rounded-[2.5rem] shadow-xl border border-slate-100 flex items-center gap-5 focus-within:ring-8 focus:ring-blue-50 transition-all group">
                        <Icon name="search" className="text-slate-300 w-10 h-10 transition-colors group-focus-within:text-blue-500 font-black" />
                        <input className="flex-1 outline-none text-xl font-black placeholder:text-slate-200 uppercase tracking-tighter" placeholder="Nombre o Domicilio..." value={search} onChange={e => setSearch(e.target.value)} />
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 font-black font-black">
                        {filtered.map(h => (
                            <div key={h.id} className="bg-white rounded-[2.5rem] shadow-xl border-t-[12px] border-slate-800 flex flex-col animate-fade-in overflow-hidden font-black">
                                <div className="p-6 space-y-4">
                                    <h4 className="font-black text-slate-900 uppercase text-lg truncate font-black">{h.nombre}</h4>
                                    <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100 flex justify-between items-center font-black">
                                        <span className="text-[10px] text-slate-400 font-black uppercase">LOTE</span>
                                        <span className="text-sm font-black text-blue-600">{h.casa}</span>
                                    </div>
                                    <button onClick={() => { setSel(h); setStep(2); }} className="w-full py-4 bg-slate-950 text-white rounded-2xl font-black text-xs uppercase shadow-lg active:scale-95 transition-all">Verificar Entrada</button>
                                </div>
                            </div>
                        ))}
                    </div>
                    {sel && (
                        <div className="fixed inset-0 bg-slate-950/90 z-[200] flex items-center justify-center p-4 backdrop-blur-md overflow-y-auto font-black">
                            <div className="bg-white p-6 sm:p-8 rounded-[3.5rem] w-full max-w-lg space-y-8 animate-fade-in relative text-center shadow-2xl border border-slate-100 font-black font-black font-black">
                                <h3 className="text-xl font-black uppercase text-slate-900 font-black font-black">Acceso a Domicilio</h3>
                                <div className="p-6 bg-slate-50 rounded-[3rem] border border-slate-100 leading-none font-black font-black"><p className="text-xl font-black text-slate-800 uppercase mb-1 font-black">{sel.nombre}</p><p className="text-blue-600 font-black text-[11px] uppercase tracking-widest">LOTE {sel.casa}</p></div>
                                
                                {step === 2 && (
                                    <div className="space-y-6 font-black font-black">
                                        <p className="text-[10px] font-black uppercase text-slate-400 tracking-widest font-black">Tablero de Autorización</p>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 font-black">
                                            {CATEGORIAS_ACCESO.map(cat => {
                                                const allowed = sel[`permiso_${cat.id}`] !== false;
                                                return (
                                                    <button key={cat.id} onClick={() => { setCatId(cat.id); setStep(3); }}
                                                        className={`flex flex-col items-center justify-center gap-1 p-4 rounded-3xl border-2 transition-all active:scale-90 font-black bg-white border-slate-100 text-slate-900 relative`}
                                                    >
                                                        <div className={`p-3 rounded-2xl bg-${cat.color}-100 text-${cat.color}-600 font-black relative flex items-center justify-center`}>
                                                            <Icon name={cat.icon} className="w-8 h-8 font-black" />
                                                            {!allowed && <div className="diagonal-strike font-black">BLOQUEADO</div>}
                                                        </div>
                                                        <div className="text-center font-black mt-2">
                                                            <span className="text-[8px] uppercase leading-none block font-black mb-1 font-black">{cat.label}</span>
                                                            {allowed && <span className="text-[8px] font-black uppercase text-emerald-500 font-black font-black">PERMITIDO</span>}
                                                        </div>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                                {step === 3 && (
                                    <div className="space-y-6 text-left font-black">
                                        <div className={`${sel[`permiso_${catId}`] !== false ? 'bg-blue-600' : 'bg-rose-600'} text-white p-5 rounded-[2.5rem] flex items-center gap-5 font-black font-black`}>
                                            <div className="bg-white/20 p-3 rounded-2xl font-black font-black"><Icon name={CATEGORIAS_ACCESO.find(c=>c.id===catId)?.icon} className="w-7 h-7 font-black" /></div>
                                            <div className="leading-none font-black font-black">
                                                <span className="text-[9px] font-black uppercase opacity-70 font-black">Entrada Clasificada</span>
                                                <p className="font-black text-xl uppercase mt-1 font-black">{CATEGORIAS_ACCESO.find(c=>c.id===catId)?.label}</p>
                                            </div>
                                        </div>
                                        <div className="space-y-2 font-black font-black font-black">
                                            <label className="text-[10px] font-black uppercase text-slate-400 ml-4">Nombre de quien ingresa</label>
                                            <input ref={inputRef} style={{fontSize: '16px'}} className="w-full p-5 bg-slate-50 rounded-[2rem] border-2 border-slate-100 font-black outline-none focus:border-blue-500 uppercase text-center font-black" placeholder="Ej: Juan Pérez..." value={vName} onChange={e => setVName(e.target.value)} />
                                        </div>
                                        <button onClick={() => setScanning(true)} className={`w-full py-6 rounded-[2.5rem] border-2 border-dashed flex items-center justify-center gap-4 transition-all font-black font-black ${photo ? 'bg-emerald-50 border-emerald-600 text-emerald-600' : 'bg-slate-50 border-slate-200 text-slate-400 hover:bg-slate-100'}`}>
                                            <Icon name="camera" className="w-6 h-6 font-black" /> <span className="font-black tracking-widest text-[11px] uppercase font-black">{photo ? "IDENTIFICACIÓN CAPTURADA" : "TOMAR FOTO INE"}</span>
                                        </button>
                                    </div>
                                )}
                                <div className="flex gap-4 font-black font-black"><button onClick={() => { if(step > 1) setStep(step - 1); else { setSel(null); setStep(1); setSearch(""); } }} className="flex-1 py-5 bg-slate-50 text-slate-400 rounded-[1.5rem] font-black uppercase text-[10px]">Atrás / Cerrar</button>{step === 3 && (sel[`permiso_${catId}`] !== false ? <button disabled={!vName.trim()} onClick={() => handleReg(true)} className="flex-1 py-5 bg-emerald-600 text-white rounded-[1.5rem] font-black uppercase text-[10px] shadow-2xl active:scale-95 transition-all">Autorizar</button> : <button onClick={() => handleReg(false)} className="flex-1 py-5 bg-rose-600 text-white rounded-[1.5rem] font-black uppercase text-[10px] shadow-2xl active:scale-95 transition-all font-black">Negar Acceso</button>)}</div>
                            </div>
                        </div>
                    )}
                    {scanning && <IDScannerWidget onCapture={(img, name) => { setPhoto(img); setVName(name); setScanning(false); }} onCancel={() => setScanning(false)} />}
                </div>
            );
        }

        function App() {
            const [showSplash, setShowSplash] = useState(true);
            const [user, setUser] = useState(null);
            const [role, setRole] = useState(null); 
            const [activeUser, setActiveUser] = useState(null);
            const [habitantes, setHabitantes] = useState([]);
            const [agentes, setAgentes] = useState([]);
            const [admins, setAdmins] = useState([]);
            const [logs, setLogs] = useState([]);
            const [loading, setLoading] = useState(true);
            const [dataReady, setDataReady] = useState(false);
            const [authStep, setAuthStep] = useState('login');
            const [loginPass, setLoginPass] = useState("");

            const forceReset = () => { setRole(null); setActiveUser(null); setAuthStep('login'); setLoginPass(""); };

            useEffect(() => {
                const timer = setTimeout(() => setShowSplash(false), 3000);
                auth.signInAnonymously().then(() => auth.onAuthStateChanged(u => setUser(u)));
                return () => clearTimeout(timer);
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsub1 = getColRef('habitantes').onSnapshot(s => setHabitantes(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsub2 = getColRef('agentes').onSnapshot(s => setAgentes(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsub3 = getColRef('bitacora').onSnapshot(s => setLogs(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsub4 = getColRef('admins').onSnapshot(s => { setAdmins(s.docs.map(d => ({ id: d.id, ...d.data() }))); setDataReady(true); setLoading(false); });
                return () => { unsub1(); unsub2(); unsub3(); unsub4(); };
            }, [user]);

            const handleLogin = async (nameInput, passInput) => {
                if (!dataReady) return alert("Sincronizando...");
                const formattedName = toTitleCase(nameInput.trim());
                let foundUser = null, foundRole = null;
                if (nameInput.toLowerCase() === 'superuser' && passInput === 'tlahuiscalpantecutli') { foundUser = { nombre: 'Súper Usuario', usuario: 'superuser' }; foundRole = 'superuser'; }
                else {
                    const admin = admins.find(a => a.nombre === formattedName && a.password === passInput);
                    if (admin) { foundUser = admin; foundRole = 'admin'; }
                    else {
                        const guard = agentes.find(a => a.nombre === formattedName && a.password === passInput);
                        if (guard) { foundUser = guard; foundRole = 'guardia'; }
                        else {
                            const hab = habitantes.find(h => h.nombre === formattedName && h.password === passInput);
                            if (hab) { foundUser = hab; foundRole = 'habitante'; }
                        }
                    }
                }
                if (foundUser) { setActiveUser(foundUser); setRole(foundRole); setAuthStep('dashboard'); await getColRef('bitacora').add({ tipo: 'Acceso Sistema', subtipo: foundRole.toUpperCase(), habitanteNombre: foundUser.nombre, timestamp: new Date().toISOString(), autorRole: foundRole === 'superuser' ? 'SUPERUSER' : (foundUser.esMaestro ? 'MAESTRO' : 'AUXILIAR') }); }
                else { playErrorSound(); }
            };

            if (showSplash) return (
                <div className="fixed inset-0 z-[1000] bg-slate-950 flex flex-col items-center justify-center text-white animate-splash-out p-6 font-black">
                    <div className="p-8 bg-blue-600 rounded-[3rem] shadow-[0_0_100px_rgba(37,99,235,0.4)] animate-bounce mb-8 border border-blue-400/20 shadow-blue-600/30 font-black"><Icon name="shield" className="w-16 h-16 sm:w-24 sm:h-24 text-white shadow-2xl" /></div>
                    <h1 className="responsive-title font-black text-center tracking-tighter px-2 font-black">{TITULO_SISTEMA}</h1>
                    <p className="mt-4 text-[10px] uppercase font-black tracking-[0.6em] text-white/40 font-black">{VERSION}</p>
                </div>
            );

            if (loading) return null;

            if (authStep === 'login') return (
                <div className="flex-1 flex items-center justify-center p-6 bg-slate-50 h-screen font-black font-black">
                    <div className="bg-white p-10 rounded-[3.5rem] shadow-2xl w-full max-w-sm border-2 border-slate-100 text-center font-black">
                        <div className="flex justify-center mb-6"><div className="p-4 rounded-2xl bg-slate-900 text-white font-black"><Icon name="lock" className="w-8 h-8 font-black" /></div></div>
                        <h2 className="text-xl sm:text-2xl font-black leading-tight tracking-tight px-2">{TITULO_SISTEMA}</h2>
                        <form onSubmit={e => { e.preventDefault(); handleLogin(e.target.name.value, e.target.pass.value); }} className="space-y-4 text-left mt-6">
                            <input name="name" className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-xs outline-none" placeholder="Nombre completo" required />
                            <input name="pass" type="password" placeholder="Contraseña" className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-xs outline-none" required />
                            <button className="w-full py-4 rounded-2xl font-black uppercase shadow-xl bg-slate-900 hover:bg-black text-white text-[11px] tracking-widest">Entrar al Sistema</button>
                            <button type="button" onClick={forceReset} className="w-full mt-4 py-3 bg-slate-100 text-slate-400 rounded-xl font-black uppercase text-[9px] tracking-[0.2em] flex items-center justify-center gap-2"><Icon name="log-out" className="w-3 h-3 font-black" /> Salir</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="h-full flex flex-col overflow-hidden bg-slate-50 font-black">
                    <header className="bg-slate-900 text-white h-16 flex items-center justify-between px-6 shadow-2xl shrink-0 z-[100] border-b border-slate-800 font-black font-black">
                        <div className="flex items-center gap-3">
                            <Icon name="shield" className="w-5 h-5 text-blue-500 font-black" />
                            <div className="flex flex-col leading-none font-black">
                                <span className="text-[10px] sm:text-xs tracking-tighter leading-none truncate max-w-[120px] sm:max-w-none">{TITULO_SISTEMA}</span>
                                <span className="text-[7px] font-bold text-blue-400 uppercase tracking-widest mt-1">CONTROL - {VERSION}</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-4 font-sans font-black font-black">
                            <div className="flex flex-col items-end text-right font-black font-black">
                                <span className="text-[10px] font-black uppercase text-white leading-none mb-1 truncate max-w-[150px] font-black">{activeUser?.nombre}</span>
                                <span className="text-[8px] font-black text-blue-400 uppercase tracking-widest leading-none font-black">
                                    {role === 'admin' ? (activeUser?.esMaestro ? 'ADMIN MAESTRO' : 'ADMIN AUXILIAR') : role === 'guardia' ? 'GUARDIA' : role === 'superuser' ? 'SÚPER USUARIO' : 'RESIDENTE'}
                                </span>
                            </div>
                            <button onClick={forceReset} className="px-3 py-1.5 bg-slate-800 hover:bg-rose-600 text-white rounded-lg font-bold text-[9px] uppercase transition-all shadow-lg border border-slate-700 font-black font-black font-black">Salir</button>
                        </div>
                    </header>
                    <div className="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar bg-slate-50 font-black font-black font-black">
                        <div className="max-w-7xl mx-auto w-full h-full no-print font-black font-black font-black font-black">
                            {(role === 'admin' || role === 'superuser') && <AdminView habitantes={habitantes} agentes={agentes} logs={logs} admins={admins} role={role} activeUser={activeUser} onResetSuccess={forceReset} />}
                            {role === 'habitante' && <HabitanteModule habitante={habitantes.find(h => h.id === activeUser?.id) || activeUser} />}
                            {role === 'guardia' && <GuardiaFlow agente={activeUser} habitantes={habitantes} />}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
