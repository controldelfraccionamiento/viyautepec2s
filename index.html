<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, Fragment, useRef } = React;

        // --- Configuración de Firebase ---
        const firebaseConfig = {
            apiKey: "AIzaSyCu2kV9s9ZCmQCFElHZaf7vXPUKStVAh9o",
            authDomain: "viyautepec2seccion.firebaseapp.com",
            projectId: "viyautepec2seccion",
            storageBucket: "viyautepec2seccion.firebasestorage.app",
            messagingSenderId: "1008154187449",
            appId: "1:1008154187449:web:669811e04babbbfb986d68",
            measurementId: "G-D828S2ZK3H"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = "viyautepec2seccion";

        // --- Utilidades ---
        const getClavePersonalizada = (nombre, casa) => {
            if (!nombre || !casa) return "RES-XXXX";
            const cleanName = nombre.trim().split(/\s+/);
            const n = (cleanName[0] || "XX").slice(0, 2).toUpperCase();
            const a = (cleanName[1] || cleanName[0].slice(2, 4) || "XX").slice(0, 2).toUpperCase();
            
            const cleanCasa = casa.trim().split(/\s+/);
            const c = (cleanCasa[0] || "XX").slice(0, 2).toUpperCase();
            
            const matchNum = casa.match(/\d+/);
            const num = matchNum ? matchNum[0].padStart(2, '0').slice(-2) : "00";
            
            return `RES-${n}${a}${c}${num}`;
        };

        const getQRURL = (data) => `https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=${encodeURIComponent(data)}`;

        // --- Componente de Iconos SVG ---
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,
                user: <Fragment><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Fragment>,
                settings: <Fragment><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></Fragment>,
                camera: <Fragment><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></Fragment>,
                printer: <Fragment><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></Fragment>,
                "arrow-left": <Fragment><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></Fragment>,
                "check-circle": <Fragment><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></Fragment>,
                "x-circle": <Fragment><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></Fragment>,
                "loader-2": <path d="M21 12a9 9 0 1 1-6.21-8.58"/>,
                x: <Fragment><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Fragment>,
                image: <Fragment><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></Fragment>,
                key: <Fragment><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></Fragment>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        // --- Componente: Tabla Genérica ---
        const DataTable = ({ headers, rows }) => (
            <div className="overflow-x-auto rounded-3xl border border-slate-100">
                <table className="w-full text-left text-sm">
                    <thead className="bg-slate-50">
                        <tr>{headers.map(h => <th key={h} className="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">{h}</th>)}</tr>
                    </thead>
                    <tbody className="divide-y divide-slate-50">
                        {rows.map((row, i) => (
                            <tr key={i} className="hover:bg-slate-50/50 transition-colors">
                                {row.map((cell, j) => <td key={j} className="px-6 py-4 font-bold text-slate-700">{cell}</td>)}
                            </tr>
                        ))}
                        {rows.length === 0 && (
                            <tr><td colSpan={headers.length} className="px-6 py-12 text-center text-slate-300 italic">Sin registros disponibles</td></tr>
                        )}
                    </tbody>
                </table>
            </div>
        );

        // --- Vista: Administración ---
        function AdminView({ habitantes, agentes, logs, admins, role }) {
            const [tab, setTab] = useState('residentes');
            const [selectedPhoto, setSelectedPhoto] = useState(null);

            const deleteEntry = async (col, id) => {
                if(confirm("¿Seguro que desea eliminar este registro?")) {
                    await db.doc(`artifacts/${appId}/public/data/${col}/${id}`).delete();
                }
            };

            const tabs = ['residentes', 'agentes', 'bitacora'];
            if (role === 'superuser') tabs.push('administradores');

            return (
                <div className="space-y-4 animate-fade-in pb-20">
                    <div className="flex gap-2 bg-white p-2 rounded-2xl shadow-sm border border-slate-200 w-fit overflow-x-auto max-w-full no-print">
                        {tabs.map(t => (
                            <button key={t} onClick={() => setTab(t)} className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all whitespace-nowrap ${tab === t ? 'bg-slate-900 text-white shadow-lg' : 'text-slate-400 hover:text-slate-600'}`}>{t}</button>
                        ))}
                    </div>

                    <div className="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-100 min-h-[400px]">
                        {tab === 'residentes' && (
                            <div className="space-y-4">
                                <h2 className="text-xl font-black uppercase text-slate-800 tracking-tight">Directorio Habitantes</h2>
                                <DataTable 
                                    headers={['Nombre', 'Lote', 'Acción']} 
                                    rows={habitantes.map(h => [h.nombre, h.casa, <button onClick={() => deleteEntry('habitantes', h.id)} className="text-rose-500 font-black">Borrar</button>])}
                                />
                            </div>
                        )}

                        {tab === 'agentes' && (
                            <div className="space-y-4">
                                <h2 className="text-xl font-black uppercase text-slate-800 tracking-tight">Cuerpo de Seguridad</h2>
                                <DataTable 
                                    headers={['Agente', 'Usuario', 'Acción']} 
                                    rows={agentes.map(a => [a.nombre, `@${a.usuario}`, <button onClick={() => deleteEntry('agentes', a.id)} className="text-rose-500 font-black">Borrar</button>])}
                                />
                            </div>
                        )}

                        {tab === 'administradores' && role === 'superuser' && (
                            <div className="space-y-4">
                                <h2 className="text-xl font-black uppercase text-slate-800 tracking-tight">Gestión de Admins</h2>
                                <DataTable 
                                    headers={['Nombre', 'Usuario', 'Acción']} 
                                    rows={admins.map(a => [a.nombre, `@${a.usuario}`, <button onClick={() => deleteEntry('admins', a.id)} className="text-rose-500 font-black">Borrar</button>])}
                                />
                            </div>
                        )}

                        {tab === 'bitacora' && (
                            <div className="space-y-4">
                                <h2 className="text-xl font-black uppercase text-slate-800 tracking-tight">Bitácora de Accesos</h2>
                                <div className="overflow-x-auto rounded-3xl border border-slate-100">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-slate-50">
                                            <tr><th className="px-6 py-4 text-[10px] font-black uppercase text-slate-400">Fecha/Hora</th><th>Sujeto</th><th className="text-center">INE</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50">
                                            {logs.sort((a,b)=>b.timestamp.localeCompare(a.timestamp)).map(l => (
                                                <tr key={l.id} className="hover:bg-slate-50 transition-colors">
                                                    <td className="px-6 py-4 text-slate-400">{new Date(l.timestamp).toLocaleString()}</td>
                                                    <td className="uppercase font-black text-slate-700">{l.visitante || l.habitanteNombre}<br/><span className="text-[9px] opacity-60 text-blue-600 font-black">{l.tipo}</span></td>
                                                    <td className="text-center">
                                                        {l.fotoINE ? <button onClick={() => setSelectedPhoto(l.fotoINE)} className="p-2 bg-slate-100 rounded-xl text-blue-600 hover:bg-blue-100 transition-all"><Icon name="image" className="w-4 h-4" /></button> : <span className="text-[8px] text-slate-300 font-black">N/A</span>}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </div>

                    {selectedPhoto && (
                        <div className="fixed inset-0 bg-slate-900/95 z-[300] flex flex-col items-center justify-center p-6 backdrop-blur-md animate-fade-in no-print">
                            <div className="max-w-3xl w-full flex flex-col gap-4" id="print-area">
                                <div className="flex justify-between items-center bg-white/10 p-4 rounded-3xl no-print">
                                    <div className="flex gap-3">
                                        <button onClick={() => setSelectedPhoto(null)} className="px-6 py-3 bg-white/20 hover:bg-white/30 text-white rounded-2xl font-black uppercase text-[10px] flex items-center gap-2">
                                            <Icon name="arrow-left" className="w-4 h-4" /> Retroceder
                                        </button>
                                        <button onClick={() => window.print()} className="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-black uppercase text-[10px] flex items-center gap-2 shadow-xl">
                                            <Icon name="printer" className="w-4 h-4" /> Imprimir INE
                                        </button>
                                    </div>
                                    <button onClick={() => setSelectedPhoto(null)} className="text-white/50"><Icon name="x" className="w-6 h-6" /></button>
                                </div>
                                <div className="bg-white p-2 rounded-[2.5rem] shadow-2xl overflow-hidden border-4 border-white/20">
                                    <img src={selectedPhoto} className="w-full h-auto rounded-[2rem] block" alt="IFE" />
                                </div>
                                <p className="text-center text-white/40 text-[9px] font-bold uppercase tracking-[0.3em] mt-4 no-print">Registro Oficial - Viyautepec 2a. Sección</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- Vista: Escáner ---
        function IDScanner({ onCapture, onCancel }) {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [stream, setStream] = useState(null);

            useEffect(() => {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: 1280, height: 720 } })
                .then(s => { setStream(s); if(videoRef.current) videoRef.current.srcObject = s; })
                .catch(() => { alert("Acceso a cámara denegado."); onCancel(); });
                return () => { if(stream) stream.getTracks().forEach(t => t.stop()); };
            }, []);

            const capture = () => {
                const ctx = canvasRef.current.getContext('2d');
                canvasRef.current.width = videoRef.current.videoWidth;
                canvasRef.current.height = videoRef.current.videoHeight;
                ctx.drawImage(videoRef.current, 0, 0);
                onCapture(canvasRef.current.toDataURL('image/jpeg', 0.7));
            };

            return (
                <div className="fixed inset-0 bg-black z-[400] flex flex-col items-center justify-center">
                    <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover" />
                    <div className="scanner-guide"></div>
                    <div className="absolute top-12 left-0 w-full text-center z-20 px-8">
                        <p className="text-white text-[10px] font-black uppercase tracking-widest bg-black/60 py-3 rounded-full border border-white/20">Encuadre el INE dentro del marco azul</p>
                    </div>
                    <div className="absolute bottom-12 flex justify-center gap-10 items-center z-20 w-full">
                        <button onClick={onCancel} className="p-5 bg-white/10 text-white rounded-full border border-white/20"><Icon name="x" className="w-8 h-8" /></button>
                        <button onClick={capture} className="w-24 h-24 bg-white rounded-full border-[12px] border-white/20 shadow-2xl active:scale-90 transition-all"></button>
                        <div className="w-16"></div>
                    </div>
                    <canvas ref={canvasRef} className="hidden" />
                </div>
            );
        }

        // --- App Principal ---
        function App() {
            const [user, setUser] = useState(null);
            const [role, setRole] = useState(null); 
            const [activeUser, setActiveUser] = useState(null);
            const [habitantes, setHabitantes] = useState([]);
            const [agentes, setAgentes] = useState([]);
            const [admins, setAdmins] = useState([]);
            const [logs, setLogs] = useState([]);
            const [loading, setLoading] = useState(true);
            const [authStep, setAuthStep] = useState('portal');

            useEffect(() => {
                auth.signInAnonymously().catch(e => console.error(e));
                auth.onAuthStateChanged((u) => { if (u) { setUser(u); setLoading(false); } });
            }, []);

            useEffect(() => {
                if (!user) return;
                const pathFn = (c) => db.collection(`artifacts/${appId}/public/data/${c}`);
                pathFn('habitantes').onSnapshot(s => setHabitantes(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                pathFn('agentes').onSnapshot(s => setAgentes(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                pathFn('bitacora').onSnapshot(s => setLogs(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                pathFn('admins').onSnapshot(s => setAdmins(s.docs.map(d => ({ id: d.id, ...d.data() }))));
            }, [user]);

            const handleLogin = (r, u, p) => {
                if (u === 'superuser' && p === 'tlahuiscalpantecutli') {
                    setActiveUser({ nombre: 'Súper Usuario', usuario: 'superuser', isSuper: true });
                    setRole('superuser'); setAuthStep('dashboard'); return;
                }
                if (r === 'admin' && u === 'admin' && p === '123') {
                    setActiveUser({ nombre: 'Activación Maestro', usuario: 'admin', mustInit: true });
                    setRole('admin'); setAuthStep('dashboard'); return;
                }
                let source = r === 'guardia' ? agentes : (r === 'habitante' ? habitantes : (r === 'admin' ? admins : []));
                const target = source.find(x => (x.usuario || x.id) === u && x.password === p);
                if (target) { setActiveUser(target); setRole(r); setAuthStep('dashboard'); } 
                else { alert("Credenciales incorrectas."); }
            };

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center bg-slate-900 text-white gap-6">
                    <div className="p-4 bg-blue-600 rounded-[2rem] shadow-2xl animate-bounce"><Icon name="shield" className="w-14 h-14" /></div>
                    <h2 className="text-2xl font-black tracking-widest uppercase animate-pulse">VIYAUTEPEC</h2>
                </div>
            );

            if (authStep === 'portal') return (
                <div className="flex-1 flex flex-col items-center justify-center p-6 bg-slate-50 space-y-12 animate-fade-in h-screen">
                    <div className="text-center">
                        <div className="p-4 bg-blue-600 text-white rounded-3xl inline-block shadow-2xl mb-6"><Icon name="shield" className="w-10 h-10" /></div>
                        <h1 className="text-4xl md:text-6xl font-black text-slate-900 tracking-tighter uppercase leading-none">Viyautepec 2a. Sección</h1>
                        <p className="text-slate-400 font-bold text-sm md:text-base uppercase mt-2 tracking-widest opacity-80">(control de seguridad)</p>
                    </div>
                    <div className="flex flex-row justify-center items-stretch gap-4 md:gap-6 w-full max-w-4xl px-4">
                        <PortalButton icon="settings" title="ADMIN" color="bg-slate-900" onClick={() => setAuthStep('login_admin')} />
                        <PortalButton icon="user" title="HABITANTE" color="bg-blue-600" onClick={() => setAuthStep('login_habitante')} />
                        <PortalButton icon="shield-check" title="SEGURIDAD" color="bg-emerald-600" onClick={() => setAuthStep('login_guardia')} />
                    </div>
                </div>
            );

            if (authStep.startsWith('login_') && !activeUser) {
                const mode = authStep.split('_')[1];
                return (
                    <div className="flex-1 flex items-center justify-center p-6 bg-slate-50 h-screen">
                        <div className="bg-white p-10 rounded-[3.5rem] shadow-2xl w-full max-w-sm border border-slate-100 text-center animate-fade-in relative overflow-hidden">
                            <div className={`absolute top-0 left-0 w-full h-2 ${mode === 'admin' ? 'bg-slate-900' : mode === 'guardia' ? 'bg-emerald-600' : 'bg-blue-600'}`}></div>
                            <h2 className="text-3xl font-black uppercase mb-1 tracking-tighter">Entrar</h2>
                            <p className="text-[10px] text-slate-400 font-bold uppercase mb-8">Módulo: {mode}</p>
                            {mode === 'admin' && <div className="mb-6 px-4 py-2 bg-blue-50 text-blue-600 rounded-xl text-[9px] font-bold uppercase">Acceso inicial: admin / 123</div>}
                            <form onSubmit={e => { e.preventDefault(); handleLogin(mode, e.target.u.value, e.target.p.value); }} className="space-y-4 text-left">
                                {mode === 'habitante' ? (
                                    <select name="u" className="w-full p-4 bg-slate-50 rounded-2xl border font-black text-xs outline-none focus:ring-4 focus:ring-blue-100" required>
                                        <option value="">Seleccione Nombre...</option>
                                        {habitantes.sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(h => <option key={h.id} value={h.id}>{h.nombre}</option>)}
                                    </select>
                                ) : <input name="u" className="w-full p-4 bg-slate-50 rounded-2xl border font-black text-xs outline-none focus:ring-4 focus:ring-blue-100" placeholder="ID Usuario" required />}
                                <input name="p" type="password" placeholder="Clave" className="w-full p-4 bg-slate-50 rounded-2xl border font-black text-xs outline-none focus:ring-4 focus:ring-blue-100" required />
                                <button className="w-full py-4 bg-slate-900 text-white rounded-2xl font-black uppercase shadow-xl hover:bg-black transition-all text-[10px] tracking-widest">Ingresar</button>
                                <button type="button" onClick={() => setAuthStep('portal')} className="w-full text-center text-slate-400 text-[10px] font-black uppercase mt-4">Volver al inicio</button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (activeUser?.mustInit) return <MaestroReg onComplete={setActiveUser} />;

            return (
                <div className="h-full flex flex-col overflow-hidden bg-slate-50 animate-fade-in">
                    <header className="bg-slate-900 text-white h-16 flex items-center justify-between px-6 shadow-2xl shrink-0 z-[100] border-b border-slate-800 no-print">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2 rounded-xl shadow-lg"><Icon name="shield" className="w-4 h-4 text-white"/></div>
                            <div className="flex flex-col leading-none">
                                <span className="font-black text-sm uppercase">VIYAUTEPEC</span>
                                <span className="text-[8px] font-bold text-blue-400 uppercase">2a. Sección</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="flex flex-col items-end text-right">
                                <span className="text-[10px] font-black uppercase text-white leading-none mb-1">{activeUser?.nombre}</span>

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

                                            {logs.sort((a,b)=>b.timestamp.localeCompare(a.timestamp)).map(l => (

                                                    <td className="px-6 py-4 text-slate-400">{new Date(l.timestamp).toLocaleString()}</td>

                                                    <td className="text-center">
                                                        {l.fotoINE ? <button onClick={() => setSelectedPhoto(l.fotoINE)} className="p-2 bg-slate-100 rounded-xl text-blue-600 hover:bg-blue-100 transition-all"><Icon name="image" className="w-4 h-4" /></button> : <span className="text-[8px] text-slate-300 font-black">N/A</span>}

                                                </tr>
                                            ))}

                                    </table>
                                </div>
                            </div>
                        )}
                    </div>

                    {selectedPhoto && (
                        <div className="fixed inset-0 bg-slate-900/95 z-[300] flex flex-col items-center justify-center p-6 backdrop-blur-md animate-fade-in no-print">

                                <div className="flex justify-between items-center bg-white/10 p-4 rounded-3xl no-print">
                                    <div className="flex gap-3">
                                        <button onClick={() => setSelectedPhoto(null)} className="px-6 py-3 bg-white/20 hover:bg-white/30 text-white rounded-2xl font-black uppercase text-[10px] flex items-center gap-2">
                                            <Icon name="arrow-left" className="w-4 h-4" /> Retroceder
                                        </button>
                                        <button onClick={() => window.print()} className="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-black uppercase text-[10px] flex items-center gap-2 shadow-xl">

                                        </button>

                                </div>
                                <p className="text-center text-white/40 text-[9px] font-bold uppercase tracking-[0.3em] mt-4 no-print">Registro Oficial - Viyautepec 2a. Sección</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- Vista: Escáner ---
        function IDScanner({ onCapture, onCancel }) {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [stream, setStream] = useState(null);

            useEffect(() => {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: 1280, height: 720 } })
                .then(s => { setStream(s); if(videoRef.current) videoRef.current.srcObject = s; })
                .catch(() => { alert("Acceso a cámara denegado."); onCancel(); });
                return () => { if(stream) stream.getTracks().forEach(t => t.stop()); };
            }, []);

            const capture = () => {
                const ctx = canvasRef.current.getContext('2d');
                canvasRef.current.width = videoRef.current.videoWidth;
                canvasRef.current.height = videoRef.current.videoHeight;
                ctx.drawImage(videoRef.current, 0, 0);
                onCapture(canvasRef.current.toDataURL('image/jpeg', 0.7));
            };

            return (
                <div className="fixed inset-0 bg-black z-[400] flex flex-col items-center justify-center">
                    <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover" />
                    <div className="scanner-guide"></div>
                    <div className="absolute top-12 left-0 w-full text-center z-20 px-8">
                        <p className="text-white text-[10px] font-black uppercase tracking-widest bg-black/60 py-3 rounded-full border border-white/20">Encuadre el INE dentro del marco azul</p>
                    </div>
                    <div className="absolute bottom-12 flex justify-center gap-10 items-center z-20 w-full">
                        <button onClick={onCancel} className="p-5 bg-white/10 text-white rounded-full border border-white/20"><Icon name="x" className="w-8 h-8" /></button>
                        <button onClick={capture} className="w-24 h-24 bg-white rounded-full border-[12px] border-white/20 shadow-2xl active:scale-90 transition-all"></button>
                        <div className="w-16"></div>
                    </div>
                    <canvas ref={canvasRef} className="hidden" />
                </div>
            );
        }

        // --- App Principal ---
        function App() {
            const [user, setUser] = useState(null);
            const [role, setRole] = useState(null); 
            const [activeUser, setActiveUser] = useState(null);
            const [habitantes, setHabitantes] = useState([]);
            const [agentes, setAgentes] = useState([]);
            const [admins, setAdmins] = useState([]);
            const [logs, setLogs] = useState([]);
            const [loading, setLoading] = useState(true);
            const [authStep, setAuthStep] = useState('portal');

            useEffect(() => {
                auth.signInAnonymously().catch(e => console.error(e));
                auth.onAuthStateChanged((u) => { if (u) { setUser(u); setLoading(false); } });
            }, []);

            useEffect(() => {
                if (!user) return;
                const pathFn = (c) => db.collection(`artifacts/${appId}/public/data/${c}`);
                pathFn('habitantes').onSnapshot(s => setHabitantes(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                pathFn('agentes').onSnapshot(s => setAgentes(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                pathFn('bitacora').onSnapshot(s => setLogs(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                pathFn('admins').onSnapshot(s => setAdmins(s.docs.map(d => ({ id: d.id, ...d.data() }))));
            }, [user]);

            const handleLogin = (r, u, p) => {
                if (u === 'superuser' && p === 'tlahuiscalpantecutli') {
                    setActiveUser({ nombre: 'Súper Usuario', usuario: 'superuser', isSuper: true });
                    setRole('superuser'); setAuthStep('dashboard'); return;
                }
                if (r === 'admin' && u === 'admin' && p === '123') {
                    setActiveUser({ nombre: 'Activación Maestro', usuario: 'admin', mustInit: true });
                    setRole('admin'); setAuthStep('dashboard'); return;
                }
                let source = r === 'guardia' ? agentes : (r === 'habitante' ? habitantes : (r === 'admin' ? admins : []));
                const target = source.find(x => (x.usuario || x.id) === u && x.password === p);
                if (target) { setActiveUser(target); setRole(r); setAuthStep('dashboard'); } 
                else { alert("Credenciales incorrectas."); }
            };

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center bg-slate-900 text-white gap-6">
                    <div className="p-4 bg-blue-600 rounded-[2rem] shadow-2xl animate-bounce"><Icon name="shield" className="w-14 h-14" /></div>
                    <h2 className="text-2xl font-black tracking-widest uppercase animate-pulse">VIYAUTEPEC</h2>
                </div>
            );

            if (authStep === 'portal') return (
                <div className="flex-1 flex flex-col items-center justify-center p-6 bg-slate-50 space-y-12 animate-fade-in h-screen">
                    <div className="text-center">
                        <div className="p-4 bg-blue-600 text-white rounded-3xl inline-block shadow-2xl mb-6"><Icon name="shield" className="w-10 h-10" /></div>
                        <h1 className="text-4xl md:text-6xl font-black text-slate-900 tracking-tighter uppercase leading-none">Viyautepec 2a. Sección</h1>
                        <p className="text-slate-400 font-bold text-sm md:text-base uppercase mt-2 tracking-widest opacity-80">(control de seguridad)</p>
                    </div>
                    <div className="flex flex-row justify-center items-stretch gap-4 md:gap-6 w-full max-w-4xl px-4">
                        <PortalButton icon="settings" title="ADMIN" color="bg-slate-900" onClick={() => setAuthStep('login_admin')} />
                        <PortalButton icon="user" title="HABITANTE" color="bg-blue-600" onClick={() => setAuthStep('login_habitante')} />
                        <PortalButton icon="shield-check" title="SEGURIDAD" color="bg-emerald-600" onClick={() => setAuthStep('login_guardia')} />
                    </div>
                </div>
            );

            if (authStep.startsWith('login_') && !activeUser) {
                const mode = authStep.split('_')[1];
                return (
                    <div className="flex-1 flex items-center justify-center p-6 bg-slate-50 h-screen">
                        <div className="bg-white p-10 rounded-[3.5rem] shadow-2xl w-full max-w-sm border border-slate-100 text-center animate-fade-in relative overflow-hidden">
                            <div className={`absolute top-0 left-0 w-full h-2 ${mode === 'admin' ? 'bg-slate-900' : mode === 'guardia' ? 'bg-emerald-600' : 'bg-blue-600'}`}></div>

                            <form onSubmit={e => { e.preventDefault(); handleLogin(mode, e.target.u.value, e.target.p.value); }} className="space-y-4 text-left">
                                {mode === 'habitante' ? (
                                    <select name="u" className="w-full p-4 bg-slate-50 rounded-2xl border font-black text-xs outline-none focus:ring-4 focus:ring-blue-100" required>
                                        <option value="">Seleccione Nombre...</option>

                            </form>
                        </div>
                    </div>
                );
            }

            if (activeUser?.mustInit) return <MaestroReg onComplete={setActiveUser} />;

            return (
                <div className="h-full flex flex-col overflow-hidden bg-slate-50 animate-fade-in">
                    <header className="bg-slate-900 text-white h-16 flex items-center justify-between px-6 shadow-2xl shrink-0 z-[100] border-b border-slate-800 no-print">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2 rounded-xl shadow-lg"><Icon name="shield" className="w-4 h-4 text-white"/></div>
                            <div className="flex flex-col leading-none">
                                <span className="font-black text-sm uppercase">VIYAUTEPEC</span>
                                <span className="text-[8px] font-bold text-blue-400 uppercase">2a. Sección</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="flex flex-col items-end text-right">
                                <span className="text-[10px] font-black uppercase text-white leading-none mb-1">{activeUser?.nombre}</span>
                                <span className="text-[8px] font-black text-blue-400 uppercase tracking-widest leading-none">
                                    {role === 'admin' ? 'Administrador' : role === 'guardia' ? 'Seguridad' : role === 'superuser' ? 'Root' : 'Residente'}
                                </span>
                            </div>
                            <button onClick={() => {setRole(null); setActiveUser(null); setAuthStep('portal');}} className="px-3 py-1.5 bg-slate-800 hover:bg-rose-600 text-white rounded-lg font-bold text-[9px] uppercase transition-all shadow-lg border border-slate-700">Salir</button>

                        <div className="max-w-7xl mx-auto w-full h-full pb-24 no-print">

                            {role === 'habitante' && <HabitanteModule activeUser={habitantes.find(h => h.id === activeUser.id) || activeUser} />}

                        </div>
                    </div>
                </div>
            );
        }

        const PortalButton = ({ icon, title, color, onClick }) => (
            <button onClick={onClick} className="bg-white p-4 md:p-8 rounded-[2.5rem] shadow-xl border border-slate-100 flex flex-col items-center justify-center gap-4 hover:scale-105 transition-all group active:scale-95 shadow-slate-200/40 w-full max-w-[140px] md:max-w-[200px]">

                                <div className="space-y-6 text-left">
                                    <div className="space-y-1"><label className="text-[10px] font-black uppercase text-slate-400 ml-2">Nombre del visitante</label><input autoFocus className="w-full p-5 bg-slate-50 rounded-3xl border-2 border-slate-100 font-bold outline-none focus:border-blue-500 transition-all text-center uppercase" value={vName} onChange={e => setVName(e.target.value)} /></div>
                                    <button onClick={() => setScanning(true)} className={`w-full py-5 rounded-[1.5rem] border-2 border-dashed flex items-center justify-center gap-3 transition-all ${photo ? 'bg-emerald-50 border-emerald-500 text-emerald-600' : 'bg-slate-50 border-slate-200 text-slate-400 hover:bg-slate-100'}`}>

        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
