<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Viyautepec 2a Sección - Ver. 9.9.2</title>
    <!-- Bibliotecas Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- Herramientas de Escaneo -->
    <script src="https://unpkg.com/tesseract.js@v5.0.3/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        :root { --overscroll-behavior: none; }
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            font-family: 'Inter', sans-serif; background-color: #f8fafc; 
            overflow-x: hidden; -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: var(--overscroll-behavior);
        }
        #root { height: 100%; display: flex; flex-direction: column; }
        .font-black { font-weight: 900 !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* Animaciones */
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-splash-out { animation: splashOut 0.5s ease-in forwards; animation-delay: 2.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes splashOut { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }

        /* Scanner UI */
        .scanner-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            z-index: 10; pointer-events: none;
        }
        .scanner-guide {
            width: 85vw; height: 53.8vw; max-width: 440px; max-height: 278px;
            position: relative; border-radius: 16px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.75);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }
        .scanner-guide-qr {
            width: 65vw; height: 65vw; max-width: 280px; max-height: 280px;
            position: relative; border-radius: 24px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.75);
            border: 3px solid #3b82f6;
        }
        .scanner-corner { position: absolute; width: 25px; height: 25px; border: 5px solid #3b82f6; }
        .c-tl { top: -5px; left: -5px; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
        .c-tr { top: -5px; right: -5px; border-left: 0; border-bottom: 0; border-radius: 0 12px 0 0; }
        .c-bl { bottom: -5px; left: -5px; border-right: 0; border-top: 0; border-radius: 0 0 0 12px; }
        .c-br { bottom: -5px; right: -5px; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }

        .auto-capture-ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 120px; height: 120px; z-index: 20; pointer-events: none;
        }
        .ring-circle {
            fill: transparent; stroke: #3b82f6; stroke-width: 6;
            stroke-dasharray: 283; stroke-dashoffset: 283;
            transition: stroke-dashoffset 2.6s linear;
        }
        .detecting .ring-circle { stroke-dashoffset: 0; }

        /* Keyboard Adjustment con dVH para soporte móvil moderno */
        .keyboard-aware-modal {
            display: flex; flex-direction: column; justify-content: flex-end; 
            min-height: 100dvh; padding: 16px; overflow-y: auto;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
        }
        @media (min-height: 700px) { .keyboard-aware-modal { justify-content: center; } }

        .camera-flash {
            position: fixed; inset: 0; background: white; z-index: 1000;
            pointer-events: none; opacity: 0;
        }
        .camera-flash.active { animation: flash-anim 0.3s ease-out; }
        @keyframes flash-anim { 0% { opacity: 1; } 100% { opacity: 0; } }

        .diagonal-strike {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            white-space: nowrap; z-index: 40; pointer-events: none;
            padding: 2px 5px; border: 2px solid #ef4444;
            color: #ef4444; font-size: 9px; font-weight: 900;
            border-radius: 2px; text-transform: uppercase;
            background: rgba(255,255,255,0.1);
        }

        /* Input Fix for iOS */
        input, select, textarea { font-size: 16px !important; }
    </style>
</head>
<body class="font-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, Fragment, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyCu2kV9s9ZCmQCFElHZaf7vXPUKStVAh9o",
            authDomain: "viyautepec2seccion.firebaseapp.com",
            projectId: "viyautepec2seccion",
            storageBucket: "viyautepec2seccion.firebasestorage.app",
            messagingSenderId: "1008154187449",
            appId: "1:1008154187449:web:669811e04babbbfb986d68"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = "viyautepec2seccion";
        const VERSION = "Ver. 9.9.2";
        const TITULO_SISTEMA = "Viyautepec 2a Sección";

        // --- Audio Management (Global Context) ---
        let audioCtx = null;
        const resumeAudioContext = () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        };

        const playBeep = (freq = 1400, duration = 0.3) => {
            resumeAudioContext();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); 
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) { console.warn("Audio blocked by browser policy"); }
        };

        const getColRef = (name) => db.collection('artifacts').doc(appId).collection('public').doc('data').collection(name);
        const toTitleCase = (str) => str ? str.toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ') : "";
        const getQRCodeURL = (data) => `https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=${encodeURIComponent(data)}`;

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,
                user: <Fragment><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Fragment>,
                camera: <Fragment><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></Fragment>,
                search: <Fragment><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Fragment>,
                lock: <Fragment><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Fragment>,
                image: <Fragment><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></Fragment>,
                loader: <Fragment><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83" /></Fragment>,
                "x-circle": <Fragment><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></Fragment>,
                refresh: <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" stroke="currentColor" strokeWidth="2" fill="none" />,
                "eye-off": <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"/>,
                eye: <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        // --- Módulo de Cámara (Recorte Proporcional Sin Deformar) ---
        function CameraWidget({ mode, onCapture, onCancel }) {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const guideRef = useRef(null);
            const [processing, setProcessing] = useState(false);
            const [isFlashing, setIsFlashing] = useState(false);
            const [isSteady, setIsSteady] = useState(false);
            const requestRef = useRef(null);
            const timerRef = useRef(null);

            useEffect(() => {
                navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
                })
                .then(s => { 
                    if(videoRef.current) videoRef.current.srcObject = s;
                    if (mode === 'INE') {
                        setIsSteady(true);
                        timerRef.current = setTimeout(captureINE, 2800);
                    } else if (mode === 'QR') {
                        requestRef.current = requestAnimationFrame(scanQR);
                    }
                })
                .catch(() => { alert("Permite el acceso a la cámara."); onCancel(); });

                return () => {
                    if (videoRef.current?.srcObject) videoRef.current.srcObject.getTracks().forEach(t => t.stop());
                    cancelAnimationFrame(requestRef.current);
                    clearTimeout(timerRef.current);
                };
            }, []);

            const scanQR = () => {
                if (videoRef.current && videoRef.current.readyState === videoRef.current.HAVE_ENOUGH_DATA) {
                    const canvas = document.createElement("canvas");
                    canvas.width = videoRef.current.videoWidth;
                    canvas.height = videoRef.current.videoHeight;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);
                    if (code) {
                        playBeep(1000, 0.2);
                        onCapture(code.data);
                        return;
                    }
                }
                requestRef.current = requestAnimationFrame(scanQR);
            };

            const captureINE = async () => {
                if (!videoRef.current || !guideRef.current || processing) return;
                setProcessing(true);
                playBeep(1400, 0.4);
                setIsFlashing(true);
                setTimeout(() => setIsFlashing(false), 200);

                const v = videoRef.current;
                const g = guideRef.current;
                const c = canvasRef.current;
                const ctx = c.getContext('2d');

                const vRect = v.getBoundingClientRect();
                const gRect = g.getBoundingClientRect();

                // Escalado proporcional real
                const scaleX = v.videoWidth / vRect.width;
                const scaleY = v.videoHeight / vRect.height;

                const sx = (gRect.left - vRect.left) * scaleX;
                const sy = (gRect.top - vRect.top) * scaleY;
                const sw = gRect.width * scaleX;
                const sh = gRect.height * scaleY;

                // Definimos el canvas con las dimensiones exactas del recorte
                c.width = sw;
                c.height = sh;
                ctx.drawImage(v, sx, sy, sw, sh, 0, 0, sw, sh);
                const fullImg = c.toDataURL('image/jpeg', 0.92);

                // Mini-canvas para OCR (mejorado para Tesseract)
                const ocrCanvas = document.createElement('canvas');
                ocrCanvas.width = sw * 0.6;
                ocrCanvas.height = sh;
                const ocrCtx = ocrCanvas.getContext('2d');
                ocrCtx.filter = 'grayscale(100%) contrast(200%) brightness(110%)';
                ocrCtx.drawImage(c, 0, 0, sw * 0.6, sh, 0, 0, sw * 0.6, sh);

                try {
                    const result = await Tesseract.recognize(ocrCanvas, 'spa');
                    const lines = result.data.text.split('\n').map(l => l.trim().toUpperCase()).filter(l => l.length > 2);
                    const nameIdx = lines.findIndex(l => l.includes('NOMBRE') || l.includes('NOMB'));
                    const name = nameIdx !== -1 ? lines.slice(nameIdx + 1, nameIdx + 4).join(' ') : "No detectado";
                    onCapture({ img: fullImg, name });
                } catch (e) {
                    onCapture({ img: fullImg, name: "Revisar Nombre" });
                }
            };

            return (
                <div className="fixed inset-0 bg-black z-[600] flex flex-col items-center justify-center overflow-hidden">
                    <div className={`camera-flash ${isFlashing ? 'active' : ''}`} />
                    <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover" />
                    <div className="scanner-container">
                        <div ref={guideRef} className={mode === 'QR' ? "scanner-guide-qr" : "scanner-guide"}>
                            <div className="scanner-corner c-tl"></div><div className="scanner-corner c-tr"></div>
                            <div className="scanner-corner c-bl"></div><div className="scanner-corner c-br"></div>
                            {isSteady && mode === 'INE' && <div className="auto-capture-ring detecting"><svg width="120" height="120" style={{transform: 'rotate(-90deg)'}}><circle className="ring-circle" cx="60" cy="60" r="50" /></svg></div>}
                        </div>
                    </div>
                    <div className="absolute top-12 w-full text-center px-4 font-black">
                        <div className="bg-black/70 py-4 px-8 rounded-3xl inline-block border border-white/10 text-white shadow-2xl">
                            {processing ? "EXTRAYENDO DATOS..." : mode === 'QR' ? "ESCANEANDO QR" : "MANTENGA FIRME EL INE"}
                        </div>
                    </div>
                    <button onClick={onCancel} className="absolute bottom-12 px-8 py-3 bg-white/20 text-white rounded-full border border-white/40 font-black uppercase text-xs">Cancelar</button>
                    <canvas ref={canvasRef} className="hidden" />
                </div>
            );
        }

        // --- Flujo del Guardia ---
        function GuardiaFlow({ agente, habitantes }) {
            const [flowMode, setFlowMode] = useState(null); 
            const [search, setSearch] = useState("");
            const [selected, setSelected] = useState(null);
            const [step, setStep] = useState(1);
            const [catId, setCatId] = useState("");
            const [vName, setVName] = useState("");
            const [photo, setPhoto] = useState(null);
            const [scanning, setScanning] = useState(false);
            const [isManual, setIsManual] = useState(false);

            const handleResidentQR = async (qrId) => {
                const resident = habitantes.find(h => h.id === qrId);
                if (resident) {
                    await getColRef('bitacora').add({
                        tipo: 'Residente',
                        visitante: resident.nombre,
                        lote: resident.casa,
                        timestamp: new Date().toISOString(),
                        autor: agente.nombre,
                        metodo: 'QR'
                    });
                    alert(`Acceso Registrado: ${resident.nombre}`);
                    setFlowMode(null);
                } else {
                    alert("QR inválido o no reconocido.");
                }
                setScanning(false);
            };

            const handleVisitorCapture = (data) => {
                setVName(data.name);
                setPhoto(data.img);
                setStep(3);
                setScanning(false);
            };

            const saveVisitorAccess = async (approved) => {
                await getColRef('bitacora').add({
                    tipo: approved ? 'Visita' : 'Acceso Denegado',
                    subtipo: catId ? (CATEGORIAS_ACCESO.find(c => c.id === catId)?.label.toUpperCase()) : 'VISITA',
                    visitante: vName.toUpperCase(),
                    habitanteNombre: selected.nombre,
                    lote: selected.casa,
                    timestamp: new Date().toISOString(),
                    autor: agente.nombre,
                    fotoINE: photo || ''
                });
                setSelected(null); setStep(1); setVName(""); setPhoto(null); setFlowMode(null);
            };

            if (!flowMode) return (
                <div className="p-6 space-y-8 animate-fade-in flex flex-col items-center justify-center min-h-[70vh]">
                    <h2 className="text-2xl font-black uppercase text-slate-800 text-center">Menú de Acceso</h2>
                    <div className="grid gap-6 w-full max-w-md">
                        <button onClick={() => { resumeAudioContext(); setFlowMode('residente'); setScanning(true); }} className="p-8 bg-blue-600 text-white rounded-[3rem] shadow-xl flex flex-col items-center gap-4 active:scale-95 transition-all">
                            <Icon name="refresh" className="w-12 h-12" />
                            <span className="font-black text-lg uppercase">Residente (QR)</span>
                        </button>
                        <button onClick={() => { resumeAudioContext(); setFlowMode('visita'); }} className="p-8 bg-slate-900 text-white rounded-[3rem] shadow-xl flex flex-col items-center gap-4 active:scale-95 transition-all">
                            <Icon name="user" className="w-12 h-12" />
                            <span className="font-black text-lg uppercase">Visita (INE)</span>
                        </button>
                    </div>
                </div>
            );

            if (flowMode === 'residente') return (
                <Fragment>{scanning && <CameraWidget mode="QR" onCapture={handleResidentQR} onCancel={() => setFlowMode(null)} />}</Fragment>
            );

            const list = search.length > 0 ? habitantes.filter(h => h.nombre.toLowerCase().includes(search.toLowerCase()) || h.casa.includes(search)) : [];

            return (
                <div className="p-4 space-y-4 font-black">
                    <button onClick={() => setFlowMode(null)} className="text-slate-400 text-[10px] mb-2 uppercase font-black">← Menú Principal</button>
                    <div className="bg-white p-4 rounded-2xl shadow-sm flex items-center gap-3 border border-slate-200">
                        <Icon name="search" className="text-slate-400 w-6 h-6" />
                        <input className="flex-1 outline-none text-lg font-black" placeholder="Lote o Nombre..." value={search} onChange={e => setSearch(e.target.value)} />
                    </div>
                    <div className="grid gap-4">
                        {list.map(h => (
                            <div key={h.id} className="bg-white p-5 rounded-3xl shadow-md border-t-8 border-slate-800">
                                <h3 className="text-lg uppercase mb-1 font-black">{h.nombre}</h3>
                                <p className="text-blue-600 mb-4 font-black text-sm">LOTE: {h.casa}</p>
                                <button onClick={() => setSelected(h)} className="w-full py-3 bg-slate-900 text-white rounded-xl font-black uppercase text-xs">REGISTRAR VISITA</button>
                            </div>
                        ))}
                    </div>

                    {selected && (
                        <div className="fixed inset-0 bg-slate-950/90 z-[500] overflow-y-auto">
                            <div className="keyboard-aware-modal w-full max-w-md mx-auto font-black font-black">
                                <div className="bg-white p-6 sm:p-8 rounded-[3.5rem] w-full space-y-6 text-center shadow-2xl border border-slate-100">
                                    <h2 className="text-xl font-black uppercase">Entrada de Visita</h2>
                                    <div className="p-4 bg-slate-100 rounded-[2.5rem]">
                                        <p className="font-black text-lg uppercase">{selected.nombre}</p>
                                        <p className="text-blue-600 font-black text-[11px] uppercase tracking-widest">LOTE {selected.casa}</p>
                                    </div>
                                    
                                    {step === 1 && (
                                        <div className="space-y-6">
                                            <p className="text-[10px] uppercase text-slate-400 font-black tracking-widest">Seleccione Categoría</p>
                                            <div className="grid grid-cols-2 gap-3">
                                                {CATEGORIAS_ACCESO.map(cat => {
                                                    const allowed = selected[`permiso_${cat.id}`] !== false;
                                                    return (
                                                        <button key={cat.id} onClick={() => { setCatId(cat.id); setStep(2); }}
                                                            className={`flex flex-col items-center justify-center p-4 rounded-3xl border-2 transition-all relative ${allowed ? 'bg-white border-slate-100' : 'bg-slate-50 border-slate-200 opacity-60 cursor-not-allowed'}`}
                                                        >
                                                            <div className={`p-3 rounded-2xl bg-${cat.color}-100 text-${cat.color}-600 font-black`}>
                                                                <Icon name={cat.icon} className="w-8 h-8 font-black" />
                                                                {!allowed && <div className="diagonal-strike">BLOQUEADO</div>}
                                                            </div>
                                                            <span className="text-[9px] uppercase mt-2 font-black">{cat.label}</span>
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    {step === 2 && (
                                        <div className="space-y-4 font-black">
                                            <p className="text-xs uppercase text-slate-500 font-black">Escanee el frente del INE</p>
                                            <button onClick={() => { resumeAudioContext(); setScanning(true); }} className="w-24 h-24 mx-auto bg-blue-600 text-white rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-transform">
                                                <Icon name="camera" className="w-12 h-12" />
                                            </button>
                                        </div>
                                    )}

                                    {step === 3 && (
                                        <div className="space-y-4 text-left">
                                            <div>
                                                <label className="text-[10px] uppercase text-slate-400 ml-2 font-black">Nombre del Visitante</label>
                                                <input className={`w-full p-4 rounded-2xl border-2 font-black uppercase text-center ${isManual ? 'border-blue-500 bg-white' : 'border-slate-100 bg-slate-50'}`} value={vName} onChange={e => setVName(e.target.value)} disabled={!isManual} />
                                            </div>
                                            {photo && <img src={photo} className="w-full h-44 object-cover rounded-[2rem] border shadow-inner" alt="Recorte" />}
                                            <div className="flex justify-between px-2">
                                                <button onClick={() => setScanning(true)} className="text-blue-600 text-[11px] font-black underline uppercase">Reintentar</button>
                                                <button onClick={() => setIsManual(true)} className="text-slate-400 text-[11px] font-black underline uppercase">Editar</button>
                                            </div>
                                        </div>
                                    )}

                                    <div className="flex gap-3 pt-2">
                                        <button onClick={() => { if(step > 1) setStep(step - 1); else setSelected(null); }} className="flex-1 py-4 bg-slate-50 text-slate-500 rounded-2xl font-black uppercase text-xs">Atrás</button>
                                        {step === 3 && (
                                            <button onClick={() => saveVisitorAccess(true)} className="flex-1 py-4 bg-emerald-600 text-white rounded-2xl font-black uppercase text-xs shadow-lg">AUTORIZAR</button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    {scanning && <CameraWidget mode="INE" onCapture={handleVisitorCapture} onCancel={() => setScanning(false)} />}
                </div>
            );
        }

        // --- Dashboard Administración ---
        function AdminDashboard({ habitantes, logs, role }) {
            const [tab, setTab] = useState('bitacora');
            const [selectedPhoto, setSelectedPhoto] = useState(null);
            const displayLogs = role === 'superuser' ? logs : logs.filter(l => l.autorRole !== 'SUPERUSER');

            return (
                <div className="p-4 space-y-4 font-black">
                    <div className="flex gap-2 overflow-x-auto pb-2">
                        {['bitacora', 'residentes'].map(t => (
                            <button key={t} onClick={() => setTab(t)} className={`px-5 py-2 rounded-xl text-[10px] uppercase font-black ${tab === t ? 'bg-slate-900 text-white shadow-lg' : 'bg-white text-slate-400 border border-slate-200'}`}>{t}</button>
                        ))}
                    </div>
                    <div className="bg-white p-6 rounded-[2.5rem] shadow-xl border border-slate-100 min-h-[500px]">
                        <h2 className="text-xl uppercase text-slate-800 mb-6 font-black">{tab}</h2>
                        <div className="overflow-x-auto rounded-3xl border border-slate-100">
                            <table className="w-full text-left text-sm font-black">
                                <thead className="bg-slate-50 font-black uppercase text-[10px] text-slate-400 border-b">
                                    <tr><th className="px-4 py-4">Sujeto</th><th className="px-4">Lote</th><th className="text-right pr-6">Acción</th></tr>
                                </thead>
                                <tbody className="divide-y divide-slate-50">
                                    {(tab==='bitacora' ? displayLogs : habitantes).sort((a,b)=> (b.timestamp || "").localeCompare(a.timestamp || "")).map(x => (
                                        <tr key={x.id} className="border-b font-black">
                                            <td className="px-4 py-4">{x.visitante || x.nombre}</td>
                                            <td className="px-4 py-4 text-slate-500 uppercase text-xs">{x.lote || x.casa || 'N/A'}</td>
                                            <td className="px-4 py-4 text-right pr-6">
                                                {(x.fotoINE || x.foto) && <button onClick={() => setSelectedPhoto(x.fotoINE || x.foto)} className="p-2 text-blue-600"><Icon name="image" /></button>}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    {selectedPhoto && (
                        <div className="fixed inset-0 bg-black/95 z-[700] flex flex-col items-center justify-center p-6 backdrop-blur-md" onClick={() => setSelectedPhoto(null)}>
                            <img src={selectedPhoto} className="max-w-full max-h-[85vh] rounded-3xl shadow-2xl" />
                            <button className="mt-8 px-10 py-3 bg-white text-black rounded-full font-black uppercase text-sm font-black">Cerrar</button>
                        </div>
                    )}
                </div>
            );
        }

        // --- App Principal ---
        function App() {
            const [showSplash, setShowSplash] = useState(true);
            const [user, setUser] = useState(null);
            const [role, setRole] = useState(null);
            const [activeUser, setActiveUser] = useState(null);
            const [habitantes, setHabitantes] = useState([]);
            const [agentes, setAgentes] = useState([]);
            const [admins, setAdmins] = useState([]);
            const [logs, setLogs] = useState([]);
            const [loginPass, setLoginPass] = useState("");

            useEffect(() => {
                const timer = setTimeout(() => setShowSplash(false), 3000);
                auth.signInAnonymously().then(() => auth.onAuthStateChanged(u => setUser(u)));
                return () => clearTimeout(timer);
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsub1 = getColRef('habitantes').onSnapshot(s => setHabitantes(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub2 = getColRef('bitacora').onSnapshot(s => setLogs(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub3 = getColRef('admins').onSnapshot(s => setAdmins(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub4 = getColRef('agentes').onSnapshot(s => setAgentes(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { unsub1(); unsub2(); unsub3(); unsub4(); };
            }, [user]);

            const handleLogin = (name, pass) => {
                const formattedName = toTitleCase(name.trim());
                if (name.toLowerCase() === 'superuser' && pass === 'tlahuiscalpantecutli') {
                    setActiveUser({nombre: 'Súper Usuario', usuario: 'superuser'}); setRole('superuser');
                } else {
                    const ad = admins.find(a => a.nombre === formattedName && a.password === pass);
                    if (ad) { setActiveUser(ad); setRole('admin'); }
                    else {
                        const h = habitantes.find(hb => hb.nombre === formattedName && hb.password === pass);
                        if (h) { setActiveUser(h); setRole('habitante'); }
                        else {
                            const g = agentes.find(ga => ga.nombre === formattedName && ga.password === pass);
                            if (g) { setActiveUser(g); setRole('guardia'); }
                            else { alert("Credenciales incorrectas"); }
                        }
                    }
                }
            };

            if (showSplash) return (
                <div className="fixed inset-0 z-[1000] bg-slate-950 flex flex-col items-center justify-center text-white font-black">
                    <div className="p-8 bg-blue-600 rounded-[3rem] animate-pulse mb-6"><Icon name="shield" className="w-16 h-16 font-black" /></div>
                    <h1 className="text-3xl uppercase tracking-tighter text-center px-4">{TITULO_SISTEMA}</h1>
                    <p className="mt-2 text-[10px] uppercase font-black tracking-widest text-white/40">{VERSION}</p>
                </div>
            );

            if (!activeUser) return (
                <div className="flex-1 flex items-center justify-center p-6 bg-slate-50 h-screen font-black">
                    <div className="bg-white p-10 rounded-[4rem] shadow-2xl w-full max-w-sm text-center border border-slate-100 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-slate-900"></div>
                        <Icon name="lock" className="w-12 h-12 mx-auto mb-4 text-slate-800" />
                        <h2 className="text-2xl mb-6 uppercase tracking-tighter">{TITULO_SISTEMA}</h2>
                        <form onSubmit={e => { e.preventDefault(); handleLogin(e.target.name.value, loginPass); }} className="space-y-4 text-left">
                            <input name="name" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold outline-none" placeholder="Nombre completo" required />
                            <input type="password" placeholder="Contraseña" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold outline-none" value={loginPass} onChange={e => setLoginPass(e.target.value)} required />
                            <button onClick={resumeAudioContext} className="w-full py-4 bg-slate-900 text-white rounded-2xl uppercase shadow-lg font-black mt-2">INGRESAR</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="h-full flex flex-col bg-slate-50">
                    <header className="bg-slate-900 text-white p-4 flex justify-between items-center shadow-lg shrink-0 font-black">
                        <div className="flex items-center gap-2 font-black">
                            <Icon name="shield" className="w-6 h-6 text-blue-400" />
                            <span className="text-[11px] uppercase tracking-tighter">{TITULO_SISTEMA}</span>
                        </div>
                        <button onClick={() => { setRole(null); setActiveUser(null); }} className="text-[9px] bg-white/10 px-3 py-1.5 rounded-lg font-black uppercase">SALIR</button>
                    </header>
                    <main className="flex-1 overflow-y-auto">
                        {(role === 'admin' || role === 'superuser') && <AdminDashboard habitantes={habitantes} logs={logs} role={role} />}
                        {role === 'habitante' && <div className="p-6 text-center"><h1 className="text-xl font-black mb-2 uppercase">Bienvenido {activeUser.nombre}</h1><p className="text-slate-400 text-sm">Tu cuenta de residente está activa.</p></div>}
                        {role === 'guardia' && <GuardiaFlow agente={activeUser} habitantes={habitantes} />}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
