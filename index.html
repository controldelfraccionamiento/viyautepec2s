<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Viyautepec 2a Sección - Ver. 10.5</title>
    <!-- Bibliotecas Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- Herramientas de Escaneo y OCR -->
    <script src="https://unpkg.com/tesseract.js@v5.0.3/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        :root { --overscroll-behavior: none; }
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            font-family: 'Inter', sans-serif; background-color: #0f172a; /* Fondo oscuro para resaltar el 'celular' */
            overflow: hidden; -webkit-tap-highlight-color: transparent;
        }

        /* Contenedor que simula un celular en Desktop  */
        #mobile-container {
            width: 100%;
            height: 100%;
            max-width: 450px; /* Ancho estándar de smartphone  */
            margin: 0 auto;
            background-color: #f8fafc;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (min-width: 451px) {
            #mobile-container {
                height: 95vh;
                margin-top: 2.5vh;
                border-radius: 40px;
                border: 8px solid #334155;
            }
        }

        #root { height: 100%; display: flex; flex-direction: column; flex: 1; }
        .font-black { font-weight: 900 !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-splash-out { animation: splashOut 0.5s ease-in forwards; animation-delay: 2.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes splashOut { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }

        /* Scanner UI */
        .scanner-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            z-index: 10; pointer-events: none;
        }
        .scanner-guide {
            width: 85vw; height: calc(85vw * 0.63);
            max-width: 380px; max-height: 240px;
            position: relative; border-radius: 16px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }
        .scanner-guide-qr {
            width: 60vw; height: 60vw; max-width: 250px; max-height: 250px;
            position: relative; border-radius: 24px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.8);
            border: 3px solid #3b82f6;
        }
        .scanner-corner { position: absolute; width: 25px; height: 25px; border: 5px solid #3b82f6; }
        .c-tl { top: -5px; left: -5px; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
        .c-tr { top: -5px; right: -5px; border-left: 0; border-bottom: 0; border-radius: 0 12px 0 0; }
        .c-bl { bottom: -5px; left: -5px; border-right: 0; border-top: 0; border-radius: 0 0 0 12px; }
        .c-br { bottom: -5px; right: -5px; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }

        .auto-capture-ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 110px; height: 110px; z-index: 20; pointer-events: none;
        }
        .ring-circle {
            fill: transparent; stroke: #3b82f6; stroke-width: 6;
            stroke-dasharray: 283; stroke-dashoffset: 283;
            transition: stroke-dashoffset 2.8s linear;
        }
        .detecting .ring-circle { stroke-dashoffset: 0; }

        .keyboard-aware-modal {
            display: flex; flex-direction: column; justify-content: flex-end; 
            min-height: 100%; padding: 16px; overflow-y: auto;
        }

        .camera-flash {
            position: absolute; inset: 0; background: white; z-index: 1000;
            pointer-events: none; opacity: 0;
        }
        .camera-flash.active { animation: flash-anim 0.3s ease-out; }
        @keyframes flash-anim { 0% { opacity: 1; } 100% { opacity: 0; } }

        input, select, textarea { font-size: 16px !important; }
    </style>
</head>
<body>
    <div id="mobile-container">
        <div id="root"></div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, Fragment, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyCu2kV9s9ZCmQCFElHZaf7vXPUKStVAh9o",
            authDomain: "viyautepec2seccion.firebaseapp.com",
            projectId: "viyautepec2seccion",
            storageBucket: "viyautepec2seccion.firebasestorage.app",
            messagingSenderId: "1008154187449",
            appId: "1:1008154187449:web:669811e04babbbfb986d68"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = "viyautepec2seccion";
        const VERSION = "Ver. 10.5";
        const TITULO_SISTEMA = "Viyautepec 2a Sección";

        const CATEGORIAS_ACCESO = [
            { id: 'visita', label: 'Visita', icon: 'user', color: 'emerald' },
            { id: 'delivery', label: 'Delivery', icon: 'motorcycle', color: 'orange' },
            { id: 'paquetería', label: 'Paquetería', icon: 'package', color: 'blue' },
            { id: 'empleado', label: 'Empleado', icon: 'worker-helmet', color: 'amber' },
            { id: 'construccion', label: 'Mat. Construcción', icon: 'truck', color: 'slate' }
        ];

        // --- Audio Management ---
        let audioCtx = null;
        const initAudioContext = () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        };

        const triggerBeep = (freq = 1400, vol = 0.5) => {
            initAudioContext();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); 
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) { console.warn("Audio blocked"); }
        };

        const getColRef = (name) => db.collection('artifacts').doc(appId).collection('public').doc('data').collection(name);
        const toTitleCase = (str) => str ? str.toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ') : "";
        const getQRCodeURL = (data) => `https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=${encodeURIComponent(data)}`;

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,
                user: <Fragment><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Fragment>,
                camera: <Fragment><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></Fragment>,
                search: <Fragment><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Fragment>,
                lock: <Fragment><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Fragment>,
                image: <Fragment><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></Fragment>,
                loader: <Fragment><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83" /></Fragment>,
                "x-circle": <Fragment><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></Fragment>,
                refresh: <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" stroke="currentColor" strokeWidth="2" fill="none" />,
                "eye-off": <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"/>,
                eye: <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>,
                motorcycle: <path d="M5 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm14 0a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM6 18h12m-9 0 1-4h5l1 4m-7-4h6l-1-4h-4zM16 10l-1.5-3h-5L8 10"/>,
                package: <Fragment><path d="M16.5 9.4L7.5 4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></Fragment>,
                "worker-helmet": <Fragment><path d="M12 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zM6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M8 5a5 5 0 0 1 8 0M12 2v3"/></Fragment>,
                truck: <path d="M1 3h15v13H1V3zm15 5h4l3 3v5h-7V8zM5.5 18.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zm13 0a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>,
                "arrow-left": <path d="M19 12H5m7-7-7 7 7 7" stroke="currentColor" strokeWidth="2" fill="none" />,
                trash: <Fragment><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Fragment>,
                "plus-circle": <Fragment><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></Fragment>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        function CameraWidget({ mode, onCapture, onCancel }) {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const guideRef = useRef(null);
            const [processing, setProcessing] = useState(false);
            const [isFlashing, setIsFlashing] = useState(false);
            const [isSteady, setIsSteady] = useState(false);
            const requestRef = useRef(null);
            const timerRef = useRef(null);

            useEffect(() => {
                navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
                })
                .then(s => { 
                    if(videoRef.current) videoRef.current.srcObject = s;
                    if (mode === 'INE') {
                        setIsSteady(true);
                        timerRef.current = setTimeout(captureINE, 3000);
                    } else if (mode === 'QR') {
                        requestRef.current = requestAnimationFrame(scanQR);
                    }
                })
                .catch(() => { alert("Error cámara"); onCancel(); });
                return () => {
                    if (videoRef.current?.srcObject) videoRef.current.srcObject.getTracks().forEach(t => t.stop());
                    cancelAnimationFrame(requestRef.current);
                    clearTimeout(timerRef.current);
                };
            }, []);

            const scanQR = () => {
                if (videoRef.current && videoRef.current.readyState === videoRef.current.HAVE_ENOUGH_DATA) {
                    const canvas = document.createElement("canvas");
                    canvas.width = videoRef.current.videoWidth;
                    canvas.height = videoRef.current.videoHeight;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);
                    if (code) {
                        triggerBeep(1000, 0.2);
                        onCapture(code.data);
                        return;
                    }
                }
                requestRef.current = requestAnimationFrame(scanQR);
            };

            const captureINE = async () => {
                if (!videoRef.current || !guideRef.current || processing) return;
                setProcessing(true);
                triggerBeep(1400, 0.4);
                setIsFlashing(true);
                setTimeout(() => setIsFlashing(false), 200);

                const v = videoRef.current;
                const g = guideRef.current;
                const c = canvasRef.current;
                const ctx = c.getContext('2d');

                const vw = v.videoWidth;
                const vh = v.videoHeight;
                const videoRatio = vw / vh;
                
                const vRect = v.getBoundingClientRect();
                const gRect = g.getBoundingClientRect();
                
                let displayedW, displayedH, offsetX = 0, offsetY = 0;
                const elementRatio = vRect.width / vRect.height;

                if (videoRatio > elementRatio) {
                    displayedH = vRect.height;
                    displayedW = vRect.height * videoRatio;
                    offsetX = (displayedW - vRect.width) / 2;
                } else {
                    displayedW = vRect.width;
                    displayedH = vRect.width / videoRatio;
                    offsetY = (displayedH - vRect.height) / 2;
                }

                const scale = vw / displayedW;
                const sx = (gRect.left - vRect.left + offsetX) * scale;
                const sy = (gRect.top - vRect.top + offsetY) * scale;
                const sw = gRect.width * scale;
                const sh = gRect.height * scale;

                c.width = sw;
                c.height = sh;
                ctx.drawImage(v, sx, sy, sw, sh, 0, 0, sw, sh);
                const fullImg = c.toDataURL('image/jpeg', 0.95);

                const ocrCanvas = document.createElement('canvas');
                ocrCanvas.width = sw * 0.6;
                ocrCanvas.height = sh;
                const ocrCtx = ocrCanvas.getContext('2d');
                ocrCtx.filter = 'grayscale(100%) contrast(200%) brightness(105%)';
                ocrCtx.drawImage(c, 0, 0, sw * 0.6, sh, 0, 0, sw * 0.6, sh);

                try {
                    const result = await Tesseract.recognize(ocrCanvas, 'spa');
                    const lines = result.data.text.split('\n').map(l => l.trim().toUpperCase()).filter(l => l.length > 2);
                    const nameIdx = lines.findIndex(l => l.includes('NOMBRE') || l.includes('NOMB'));
                    const name = nameIdx !== -1 ? lines.slice(nameIdx + 1, nameIdx + 4).join(' ') : "No detectado";
                    onCapture({ img: fullImg, name });
                } catch (e) {
                    onCapture({ img: fullImg, name: "Revisar Manual" });
                }
            };

            return (
                <div className="absolute inset-0 bg-black z-[600] flex flex-col items-center justify-center overflow-hidden font-black">
                    <div className={`camera-flash ${isFlashing ? 'active' : ''}`} />
                    <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover" />
                    <div className="scanner-container">
                        <div ref={guideRef} className={mode === 'QR' ? "scanner-guide-qr" : "scanner-guide"}>
                            <div className="scanner-corner c-tl"></div><div className="scanner-corner c-tr"></div>
                            <div className="scanner-corner c-bl"></div><div className="scanner-corner c-br"></div>
                            {isSteady && mode === 'INE' && <div className="auto-capture-ring detecting"><svg width="110" height="110"><circle className="ring-circle" cx="55" cy="55" r="50" /></svg></div>}
                        </div>
                    </div>
                    <div className="absolute top-12 w-full text-center px-4 font-black">
                        <div className="bg-black/70 py-3 px-6 rounded-3xl inline-block border border-white/10 text-white shadow-2xl text-xs uppercase tracking-tighter">
                            {processing ? "EXTRAYENDO NOMBRE..." : mode === 'QR' ? "ESCANEANDO QR" : "ENFOQUE EL INE (AUTO-CAPTURA)"}
                        </div>
                    </div>
                    <button onClick={onCancel} className="absolute bottom-12 px-8 py-3 bg-white/20 text-white rounded-full border border-white/40 font-black uppercase text-xs">Cancelar</button>
                    <canvas ref={canvasRef} className="hidden" />
                </div>
            );
        }

        function PasswordInput({ placeholder, value, onChange }) {
            const [show, setShow] = useState(false);
            return (
                <div className="relative">
                    <input type={show ? "text" : "password"} placeholder={placeholder} value={value} onChange={onChange} className="w-full p-4 pr-12 bg-white border border-slate-200 rounded-2xl font-bold outline-none focus:ring-4 focus:ring-blue-100 shadow-sm font-black" required />
                    <button type="button" onClick={() => setShow(!show)} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400">
                        <Icon name={show ? "eye-off" : "eye"} className="w-5 h-5" />
                    </button>
                </div>
            );
        }

        // --- Vista de Administración Completa ---
        function AdminView({ habitantes, agentes, logs, admins, role, activeUser, onReset }) {
            const [tab, setTab] = useState('bitacora');
            const [view, setView] = useState('list');
            const [selectedPhoto, setSelectedPhoto] = useState(null);
            const [form, setForm] = useState({ nombre: '', casa: '', password: '' });

            const isRoot = role === 'superuser';
            const isRicardo = activeUser?.nombre?.toLowerCase().includes('ricardo');
            const canReset = isRoot || isRicardo;
            const isMaestro = isRoot || activeUser?.esMaestro;
            
            const filteredAdmins = admins.filter(a => {
                if (isRoot) return a.usuario !== 'superuser'; 
                if (isMaestro) return !a.esMaestro && a.usuario !== 'superuser'; 
                return false;
            });

            const displayLogs = isRoot ? logs : logs.filter(l => l.autorRole !== 'SUPERUSER');

            useEffect(() => { setView('list'); setForm({nombre:'', casa:'', password:''}); }, [tab]);

            const deleteEntry = async (col, id, name) => {
                if(!confirm(`¿Eliminar registro de ${name}?`)) return;
                await getColRef(col).doc(id).delete();
            };

            const handleSave = async (e) => {
                e.preventDefault();
                const col = tab === 'residentes' ? 'habitantes' : (tab === 'guardias' ? 'agentes' : 'admins');
                const data = { 
                    nombre: toTitleCase(form.nombre), 
                    password: form.password, 
                    timestamp: new Date().toISOString() 
                };
                if (tab === 'residentes') { 
                    data.casa = form.casa; 
                    CATEGORIAS_ACCESO.forEach(c => data[`permiso_${c.id}`] = true);
                }
                await getColRef(col).add(data);
                setView('list');
            };

            const resetAll = async () => {
                if (!confirm("¡ADVERTENCIA CRÍTICA! Se borrarán todos los registros. ¿Continuar?")) return;
                const collections = ['habitantes', 'agentes', 'bitacora', 'admins'];
                for (const c of collections) {
                    const snap = await getColRef(c).get();
                    const batch = db.batch();
                    snap.docs.forEach(d => batch.delete(d.ref));
                    await batch.commit();
                }
                onReset();
            };

            return (
                <div className="flex-1 flex flex-col p-4 space-y-4 font-black overflow-hidden">
                    <div className="flex gap-2 overflow-x-auto pb-2 shrink-0">
                        {['bitacora', 'residentes', 'guardias', (isMaestro && 'admins')].filter(Boolean).map(t => (
                            <button key={t} onClick={() => setTab(t)} className={`px-4 py-2 rounded-xl text-[10px] uppercase font-black transition-all whitespace-nowrap ${tab === t ? 'bg-slate-900 text-white shadow-lg' : 'bg-white text-slate-400 border border-slate-200'}`}>{t}</button>
                        ))}
                    </div>

                    <div className="bg-white p-5 rounded-[2.5rem] shadow-xl border border-slate-100 flex-1 flex flex-col overflow-hidden">
                        <div className="flex justify-between items-center mb-6 shrink-0">
                            <h2 className="text-lg uppercase text-slate-800 font-black">{tab}</h2>
                            <div className="flex gap-2">
                                {canReset && tab === 'bitacora' && <button onClick={resetAll} className="bg-rose-600 text-white px-3 py-1.5 rounded-lg text-[9px] uppercase font-black">Reiniciar</button>}
                                {view === 'list' && tab !== 'bitacora' && <button onClick={() => setView('add')} className="flex items-center gap-1 px-3 py-1.5 bg-blue-600 text-white text-[9px] uppercase rounded-lg font-black"><Icon name="plus-circle" className="w-3 h-3"/> Nuevo</button>}
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto custom-scrollbar pr-1">
                            {view === 'list' ? (
                                <table className="w-full text-left text-sm font-black">
                                    <thead className="bg-slate-50 uppercase text-[9px] text-slate-400 border-b sticky top-0 z-10">
                                        <tr>
                                            <th className="px-4 py-3">{tab === 'bitacora' ? 'Guardia' : 'Nombre'}</th>
                                            <th className="px-4">{tab === 'bitacora' ? 'Info' : 'ID'}</th>
                                            <th className="text-right pr-4">Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-50">
                                        {(tab==='bitacora' ? displayLogs : tab==='residentes' ? habitantes : tab==='guardias' ? agentes : filteredAdmins).sort((a,b)=> (b.timestamp || "").localeCompare(a.timestamp || "")).map(x => (
                                            <tr key={x.id} className={`border-b ${x.tipo === 'Acceso Denegado' ? 'bg-rose-50/30' : ''}`}>
                                                <td className="px-4 py-3 font-black leading-tight text-xs">
                                                    {tab === 'bitacora' ? x.autor : (x.nombre || x.visitante)}
                                                </td>
                                                <td className="px-4 text-slate-500 uppercase text-[10px] font-black leading-tight">
                                                    {tab === 'bitacora' ? (
                                                        <Fragment>{x.visitante}<br/><span className="text-blue-600">LOTE {x.lote}</span></Fragment>
                                                    ) : (x.casa || x.lote || 'N/A')}
                                                </td>
                                                <td className="px-4 text-right flex justify-end gap-1 items-center h-full pt-3">
                                                    {(x.fotoINE || x.foto) && <button onClick={() => setSelectedPhoto(x.fotoINE || x.foto)} className="p-1.5 text-blue-600"><Icon name="image" className="w-4 h-4"/></button>}
                                                    {tab !== 'bitacora' && <button onClick={() => deleteEntry(tab, x.id, x.nombre)} className="p-1.5 text-rose-500"><Icon name="trash" className="w-4 h-4"/></button>}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            ) : (
                                <form onSubmit={handleSave} className="space-y-4 pt-2">
                                    <input className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-black text-sm" placeholder="Nombre completo" value={form.nombre} onChange={e => setForm({...form, nombre: e.target.value})} required />
                                    {tab === 'residentes' && <input className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-black text-sm" placeholder="Lote / Casa" value={form.casa} onChange={e => setForm({...form, casa: e.target.value})} required />}
                                    <PasswordInput placeholder="Contraseña" value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
                                    <button type="submit" className="w-full py-5 bg-slate-900 text-white rounded-[1.5rem] font-black uppercase text-sm shadow-xl mt-4">Guardar</button>
                                    <button type="button" onClick={() => setView('list')} className="w-full text-center text-slate-400 text-xs uppercase font-black">Cancelar</button>
                                </form>
                            )}
                        </div>
                    </div>
                    {selectedPhoto && (
                        <div className="absolute inset-0 bg-black/95 z-[700] flex flex-col items-center justify-center p-6 backdrop-blur-md animate-fade-in" onClick={() => setSelectedPhoto(null)}>
                            <img src={selectedPhoto} className="max-w-full max-h-[85%] rounded-3xl shadow-2xl" />
                            <button className="mt-8 px-10 py-3 bg-white text-black rounded-full font-black uppercase text-xs">Cerrar</button>
                        </div>
                    )}
                </div>
            );
        }

        function HabitanteModule({ habitante }) {
            return (
                <div className="flex-1 flex flex-col p-4 space-y-6 animate-fade-in overflow-y-auto custom-scrollbar">
                    <div className="bg-white p-8 rounded-[3.5rem] shadow-2xl border border-slate-100 text-center relative overflow-hidden shrink-0">
                        <div className="absolute top-0 left-0 w-full h-3 bg-blue-600"></div>
                        <h2 className="text-xl uppercase mb-6 mt-2 tracking-tighter text-slate-900 font-black">Pase Residencial</h2>
                        <div className="bg-white p-4 rounded-3xl inline-block border-4 border-slate-50 shadow-inner mb-6">
                            <img src={getQRCodeURL(habitante.id)} className="w-48 h-48 mx-auto" alt="QR" />
                        </div>
                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 w-full">
                            <span className="text-[9px] uppercase text-slate-400 block mb-1 tracking-widest font-black">ID de Acceso</span>
                            <p className="font-black text-blue-600 text-lg tracking-[0.2em] uppercase">{habitante.id.slice(0,8)}</p>
                        </div>
                    </div>
                </div>
            );
        }

        function GuardiaFlow({ agente, habitantes }) {
            const [flowMode, setFlowMode] = useState(null); 
            const [search, setSearch] = useState("");
            const [selected, setSelected] = useState(null);
            const [step, setStep] = useState(1);
            const [catId, setCatId] = useState("");
            const [vName, setVName] = useState("");
            const [photo, setPhoto] = useState(null);
            const [scanning, setScanning] = useState(false);
            const [isManual, setIsManual] = useState(false);

            const handleResidentQR = async (qrId) => {
                const resident = habitantes.find(h => h.id === qrId);
                if (resident) {
                    await getColRef('bitacora').add({
                        tipo: 'Residente',
                        visitante: resident.nombre,
                        lote: resident.casa,
                        timestamp: new Date().toISOString(),
                        autor: agente.nombre,
                        autorRole: 'GUARDIA',
                        metodo: 'QR'
                    });
                    alert(`Acceso Registrado: ${resident.nombre}`);
                    setFlowMode(null);
                } else {
                    alert("QR no válido.");
                }
                setScanning(false);
            };

            const handleVisitorCapture = (data) => {
                setVName(data.name);
                setPhoto(data.img);
                setStep(3);
                setScanning(false);
            };

            const saveVisitorAccess = async (approved) => {
                await getColRef('bitacora').add({
                    tipo: approved ? 'Visita' : 'Acceso Denegado',
                    subtipo: catId ? (CATEGORIAS_ACCESO.find(c => c.id === catId)?.label.toUpperCase()) : 'VISITA',
                    visitante: vName.toUpperCase(),
                    habitanteNombre: selected.nombre,
                    lote: selected.casa,
                    timestamp: new Date().toISOString(),
                    autor: agente.nombre,
                    autorRole: 'GUARDIA',
                    fotoINE: photo || ''
                });
                setSelected(null); setStep(1); setVName(""); setPhoto(null); setFlowMode(null);
            };

            if (!flowMode) return (
                <div className="flex-1 flex flex-col items-center justify-center p-6 space-y-8 animate-fade-in font-black">
                    <h2 className="text-xl font-black uppercase text-slate-800 text-center">Menú de Acceso</h2>
                    <div className="grid gap-6 w-full">
                        <button onClick={() => { initAudioContext(); setFlowMode('residente'); setScanning(true); }} className="p-8 bg-blue-600 text-white rounded-[3rem] shadow-xl flex flex-col items-center gap-4 active:scale-95 transition-all">
                            <Icon name="refresh" className="w-10 h-10" />
                            <span className="font-black text-lg uppercase">Residente</span>
                        </button>
                        <button onClick={() => { initAudioContext(); setFlowMode('visita'); }} className="p-8 bg-slate-900 text-white rounded-[3rem] shadow-xl flex flex-col items-center gap-4 active:scale-95 transition-all">
                            <Icon name="user" className="w-10 h-10" />
                            <span className="font-black text-lg uppercase">Visita</span>
                        </button>
                    </div>
                </div>
            );

            if (flowMode === 'residente') return (
                <Fragment>{scanning && <CameraWidget mode="QR" onCapture={handleResidentQR} onCancel={() => setFlowMode(null)} />}</Fragment>
            );

            const list = search.length > 0 ? habitantes.filter(h => h.nombre.toLowerCase().includes(search.toLowerCase()) || h.casa.includes(search)) : [];

            return (
                <div className="flex-1 flex flex-col p-4 space-y-4 font-black overflow-hidden">
                    <button onClick={() => setFlowMode(null)} className="text-slate-400 text-[10px] mb-2 uppercase font-black shrink-0">← Volver</button>
                    <div className="bg-white p-4 rounded-2xl shadow-sm flex items-center gap-3 border border-slate-200 shrink-0">
                        <Icon name="search" className="text-slate-400 w-6 h-6" />
                        <input className="flex-1 outline-none text-lg font-black" placeholder="Buscar..." value={search} onChange={e => setSearch(e.target.value)} />
                    </div>
                    <div className="flex-1 overflow-y-auto space-y-4 custom-scrollbar">
                        {list.map(h => (
                            <div key={h.id} className="bg-white p-5 rounded-3xl shadow-md border-t-8 border-slate-800">
                                <h3 className="text-md uppercase mb-1 font-black">{h.nombre}</h3>
                                <p className="text-blue-600 mb-4 font-black text-xs">LOTE: {h.casa}</p>
                                <button onClick={() => setSelected(h)} className="w-full py-3 bg-slate-900 text-white rounded-xl font-black uppercase text-[10px]">Registrar</button>
                            </div>
                        ))}
                    </div>

                    {selected && (
                        <div className="absolute inset-0 bg-slate-950/90 z-[500] flex flex-col overflow-y-auto">
                            <div className="keyboard-aware-modal max-w-md mx-auto w-full">
                                <div className="bg-white p-6 rounded-t-[3rem] w-full space-y-6 text-center shadow-2xl border border-slate-100 font-black">
                                    <h2 className="text-lg font-black uppercase">Visita a Lote {selected.casa}</h2>
                                    
                                    {step === 1 && (
                                        <div className="space-y-4">
                                            <p className="text-[10px] uppercase text-slate-400 font-black">Seleccione Categoría</p>
                                            <div className="grid grid-cols-2 gap-2">
                                                {CATEGORIAS_ACCESO.map(cat => {
                                                    const allowed = selected[`permiso_${cat.id}`] !== false;
                                                    return (
                                                        <button key={cat.id} onClick={() => { setCatId(cat.id); setStep(2); }}
                                                            className={`flex flex-col items-center justify-center p-3 rounded-2xl border-2 transition-all relative ${allowed ? 'bg-white border-slate-100' : 'bg-slate-50 border-slate-200 opacity-60'}`}
                                                        >
                                                            <div className={`p-2.5 rounded-xl bg-${cat.color}-100 text-${cat.color}-600 font-black`}>
                                                                <Icon name={cat.icon} className="w-7 h-7 font-black" />
                                                                {!allowed && <div className="diagonal-strike">BLOQUEADO</div>}
                                                            </div>
                                                            <span className="text-[8px] uppercase mt-1 font-black">{cat.label}</span>
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    {step === 2 && (
                                        <div className="space-y-4 font-black">
                                            <p className="text-xs uppercase text-slate-500 font-black">Escanear Identificación</p>
                                            <button onClick={() => { initAudioContext(); setScanning(true); }} className="w-20 h-20 mx-auto bg-blue-600 text-white rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-transform">
                                                <Icon name="camera" className="w-10 h-10" />
                                            </button>
                                        </div>
                                    )}

                                    {step === 3 && (
                                        <div className="space-y-4 text-left">
                                            <input className={`w-full p-4 rounded-xl border-2 font-black uppercase text-center text-sm ${isManual ? 'border-blue-500 bg-white' : 'border-slate-100 bg-slate-50'}`} value={vName} onChange={e => setVName(e.target.value)} disabled={!isManual} />
                                            {photo && <img src={photo} className="w-full h-40 object-cover rounded-2xl border shadow-inner" alt="Recorte" />}
                                            <div className="flex justify-between px-2 font-black">
                                                <button onClick={() => setScanning(true)} className="text-blue-600 text-[10px] font-black underline uppercase">Reintentar</button>
                                                <button onClick={() => setIsManual(true)} className="text-slate-400 text-[10px] font-black underline uppercase">Editar</button>
                                            </div>
                                        </div>
                                    )}

                                    <div className="flex gap-3 pt-2">
                                        <button onClick={() => { if(step > 1) setStep(step - 1); else setSelected(null); }} className="flex-1 py-4 bg-slate-50 text-slate-500 rounded-xl font-black uppercase text-xs">Cerrar</button>
                                        {step === 3 && <button onClick={() => saveVisitorAccess(true)} className="flex-1 py-4 bg-emerald-600 text-white rounded-xl font-black uppercase text-xs shadow-lg">Autorizar</button>}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    {scanning && <CameraWidget mode="INE" onCapture={handleVisitorCapture} onCancel={() => setScanning(false)} />}
                </div>
            );
        }

        function App() {
            const [showSplash, setShowSplash] = useState(true);
            const [role, setRole] = useState(null);
            const [activeUser, setActiveUser] = useState(null);
            const [habitantes, setHabitantes] = useState([]);
            const [agentes, setAgentes] = useState([]);
            const [admins, setAdmins] = useState([]);
            const [logs, setLogs] = useState([]);
            const [loginPass, setLoginPass] = useState("");

            const logout = () => { setRole(null); setActiveUser(null); setLoginPass(""); };

            useEffect(() => {
                const timer = setTimeout(() => setShowSplash(false), 3000);
                auth.signInAnonymously();
                const unsub1 = getColRef('habitantes').onSnapshot(s => setHabitantes(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub2 = getColRef('bitacora').onSnapshot(s => setLogs(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub3 = getColRef('admins').onSnapshot(s => setAdmins(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub4 = getColRef('agentes').onSnapshot(s => setAgentes(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { unsub1(); unsub2(); unsub3(); unsub4(); clearTimeout(timer); };
            }, []);

            const handleLogin = (name, pass) => {
                const formattedName = toTitleCase(name.trim());
                if (name.toLowerCase() === 'superuser' && pass === 'tlahuiscalpantecutli') {
                    setActiveUser({nombre: 'Súper Usuario', usuario: 'superuser'}); setRole('superuser');
                } else {
                    const ad = admins.find(a => a.nombre === formattedName && a.password === pass);
                    if (ad) { setActiveUser(ad); setRole('admin'); }
                    else {
                        const h = habitantes.find(hb => hb.nombre === formattedName && hb.password === pass);
                        if (h) { setActiveUser(h); setRole('habitante'); }
                        else {
                            const g = agentes.find(ga => ga.nombre === formattedName && ga.password === pass);
                            if (g) { setActiveUser(g); setRole('guardia'); }
                            else { alert("Acceso denegado"); }
                        }
                    }
                }
            };

            if (showSplash) return (
                <div id="root" className="bg-slate-950 flex flex-col items-center justify-center text-white font-black">
                    <div className="p-8 bg-blue-600 rounded-[3rem] animate-pulse mb-6"><Icon name="shield" className="w-16 h-16 font-black" /></div>
                    <h1 className="text-3xl font-black uppercase tracking-tighter text-center px-4">{TITULO_SISTEMA}</h1>
                    <p className="mt-2 text-[10px] uppercase font-black tracking-widest text-white/40">{VERSION}</p>
                </div>
            );

            if (!activeUser) return (
                <div id="root" className="flex-1 flex items-center justify-center p-6 bg-slate-50 font-black">
                    <div className="bg-white p-10 rounded-[3.5rem] shadow-2xl w-full max-w-sm text-center border border-slate-100 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-slate-900"></div>
                        <Icon name="lock" className="w-10 h-10 mx-auto mb-4 text-slate-800" />
                        <h2 className="text-2xl mb-8 uppercase tracking-tighter">{TITULO_SISTEMA}</h2>
                        <form onSubmit={e => { e.preventDefault(); handleLogin(e.target.name.value, loginPass); }} className="space-y-4 text-left">
                            <input name="name" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold outline-none font-black text-sm" placeholder="Usuario" required />
                            <PasswordInput placeholder="Contraseña" value={loginPass} onChange={e => setLoginPass(e.target.value)} />
                            <button onClick={initAudioContext} className="w-full py-4 bg-slate-900 text-white rounded-2xl uppercase shadow-lg font-black mt-2 text-xs">Ingresar</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div id="root" className="h-full flex flex-col bg-slate-50 overflow-hidden">
                    <header className="bg-slate-900 text-white p-4 flex justify-between items-center shadow-lg shrink-0 font-black">
                        <div className="flex items-center gap-2">
                            <Icon name="shield" className="w-6 h-6 text-blue-400" />
                            <span className="text-[10px] uppercase tracking-tighter">{TITULO_SISTEMA}</span>
                        </div>
                        <button onClick={logout} className="text-[9px] bg-white/10 px-3 py-1.5 rounded-lg font-black uppercase">Salir</button>
                    </header>
                    <main className="flex-1 flex flex-col overflow-hidden font-black">
                        {(role === 'admin' || role === 'superuser') && <AdminView habitantes={habitantes} agentes={agentes} logs={logs} admins={admins} role={role} activeUser={activeUser} onReset={logout} />}
                        {role === 'habitante' && <HabitanteModule habitante={activeUser} />}
                        {role === 'guardia' && <GuardiaFlow agente={activeUser} habitantes={habitantes} />}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
